,qty:.5,unit:"tsp",optional:!0,shopCategory:"Spices",availability:["mainstream"],substitutes:[{name:"Black pepper",note:"Use a little less."}]},{id:"butter",group:"To finish",name:"Butter",qty:2,unit:"tbsp",optional:!0,shopCategory:"Other",availability:["mainstream"],note:"Gives a glossy, rich finish.",substitutes:[{name:"Skip it",note:"Dairy-free and still delicious."}]},{id:"garnish-tomato",group:"To finish",name:"Fresh tomatoes",qty:2,unit:"",prep:"sliced into rounds",scale:"whole",optional:!0,shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"garnish-onion",group:"To finish",name:"Onion",qty:1,unit:"",prep:"sliced into rings",scale:"whole",optional:!0,shopCategory:"Produce",availability:["mainstream"],substitutes:[]}],steps:[{id:"s1",phase:"prep",title:"Set everything out before you start",body:"Wash your hands. Then take out every ingredient and every piece of equipment on the list and put them where you can reach them. Open the tomato paste. Unwrap the stock cubes. Measure the oil, stock and spices into cups or small bowls.",why:"Once the frying starts, jollof moves quickly. If you are searching for the curry powder while the tomato paste is frying, it can burn.",about:"About 5 minutes",media:[R("Every jollof ingredient laid out on the Mcuire counter, labelled, in small bowls. Overhead.","jollof")],ingredientIds:[],tips:[{kind:"mcuire",text:"In our kitchen we call this \u201Csetting your station\u201D. Every Mcuire chef does it before every service, even for a dish they have cooked a thousand times."}]},{id:"s2",phase:"prep",title:"Blend the pepper base",body:"Roughly cut the tomatoes, red peppers and the red onion into big chunks. Pull the stalk off the scotch bonnet. Put everything into the blender with 2\u20133 tablespoons of water (just enough to get it moving). Blend until completely smooth.",cues:{see:"A smooth, bright orange-red liquid with no visible chunks or pepper skins.",texture:"Like a thin smoothie."},about:"About 1\u20132 minutes of blending",media:[$t("10-second clip: blender running, then pouring the smooth pepper base so the texture is visible.","jollof")],ingredientIds:["tomatoes","red-peppers","scotch-bonnet","onion-blend"],tips:[{kind:"watch",text:"Scotch bonnet is very hot. After cutting it, wash your hands with soap before you touch your face or eyes."},{kind:"chef",text:"For a milder jollof, cut the scotch bonnet open and scrape out the seeds and white inside before blending. That\u2019s where most of the heat is."}],checkpoint:{question:"Does your blend look like this?",options:[{id:"chunky",label:"Chunky, I can see bits",verdict:"wait",media:R("Blender jug showing a chunky, uneven blend with visible pepper pieces.","jollof"),guidance:"Blend for another 30\u201360 seconds. If the blades are spinning but nothing moves, add one more tablespoon of water."},{id:"smooth",label:"Smooth and even",verdict:"good",media:R("Spoon lifted from a perfectly smooth pepper base.","jollof"),guidance:"Perfect. Move on."},{id:"watery",label:"Very thin and watery",verdict:"fix",media:R("Pepper base so thin it looks like juice.","jollof"),guidance:"No problem. You added a bit too much water. You\u2019ll just boil it a few minutes longer in the next step."}]}},{id:"s3",phase:"prep",title:"Boil the pepper base down until thick",body:"Pour the blended pepper base into your big pot. Turn the heat to medium-high and let it bubble with the lid OFF. Stir every 3\u20134 minutes, scraping the bottom. You are boiling away water so the mixture becomes thick.",cues:{see:"The level in the pot drops by about half. It turns from bright orange to a deeper red.",hear:"Thick \u201Cplop-plop\u201D bubbles instead of a rolling boil.",texture:"Like a loose porridge. A spoon dragged across the bottom leaves a trail for a second."},about:"About 15\u201320 minutes",timer:{minutes:15,label:"Boil down pepper base"},media:[R("Pepper base at the start: thin and bright, pot nearly full.","jollof"),R("Pepper base reduced by half: thick, deeper red, spoon trail visible.","jollof")],ingredientIds:[],tips:[{kind:"watch",text:"It will splutter. Tilt the lid over the pot, leaving a gap, so steam can escape but the splashes stay in."},{kind:"kitchen",text:"Use this time to do the next step: washing the rice."},{kind:"mcuire",text:"You can make the pepper base a day ahead and keep it in the fridge. It even freezes for a month."}],checkpoint:{question:"Has yours thickened like this?",options:[{id:"watery",label:"Still watery",verdict:"wait",media:R("Pepper base still thin and splashy, level barely dropped.","jollof"),guidance:"Keep boiling with the lid off. Check again in 5 minutes. Watery base is the #1 reason jollof turns out soggy."},{id:"almost",label:"Thicker, but still runs fast",verdict:"wait",media:R("Pepper base partly reduced, still runs off the spoon quickly.","jollof"),guidance:"Almost there. Give it 3\u20135 more minutes."},{id:"correct",label:"Thick, spoon leaves a trail",verdict:"good",media:R("Pepper base correctly reduced, spoon trail across pot base.","jollof"),guidance:"That\u2019s it. Turn off the heat and pour it into a bowl. You\u2019ll need the pot for the next stage."},{id:"dry",label:"Sticking or catching",verdict:"fix",media:R("Pepper base too dry, dark patches catching on the pot bottom.","jollof"),guidance:"Turn the heat down and stir in \xBC cup of water straight away. Don\u2019t scrape any black bits from the bottom into the sauce."}]},troubleshooting:[{problem:"It\u2019s splashing everywhere",fix:"Turn the heat down to medium and half-cover with the lid."},{problem:"It smells slightly burnt",fix:"Pour it into a clean pot without scraping the bottom, add a splash of water and continue on lower heat."}]},{id:"s4",phase:"prep",title:"Wash the rice until the water is clearer",body:"Put the rice in a large bowl and cover with cold water. Rub the rice between your hands for about 10 seconds. The water will turn cloudy. Tip the cloudy water out, keeping the rice in the bowl with your hand. Do this 3\u20134 times. Then pour the rice into a sieve and leave it to drain.",why:"The cloudiness is loose starch. Washing it off is what keeps your jollof grains separate instead of sticky.",cues:{see:"The water goes from milky-white to almost clear."},about:"About 3\u20135 minutes",media:[R("Side by side: first wash (milky water) vs fourth wash (nearly clear water) in a glass bowl.","rice")],ingredientIds:["rice"],tips:[{kind:"kitchen",text:"It doesn\u2019t have to be perfectly clear. \u201CClearer\u201D is enough."}],checkpoint:{question:"How does your water look now?",options:[{id:"milky",label:"Still milky white",verdict:"wait",media:R("Bowl of rice with milky water.","rice"),guidance:"Wash it 1\u20132 more times."},{id:"clear",label:"Mostly clear",verdict:"good",media:R("Bowl of rice with nearly clear water.","rice"),guidance:"Great. Drain it in the sieve and leave it there."}]}},{id:"s5",phase:"cook",title:"Soften the onion in hot oil",body:"Put the empty pot back on medium heat and pour in the oil. Wait 1\u20132 minutes for the oil to heat up. Test it by dropping in one slice of onion. If it sizzles gently, it\u2019s ready. Add all the sliced onion and stir. Cook, stirring now and then, until the onion is soft.",cues:{see:"Onion turns soft and see-through, with the edges just starting to turn golden.",hear:"A steady, gentle sizzle, not loud crackling.",smell:"Sweet onion."},about:"About 3\u20134 minutes",timer:{minutes:4,label:"Soften onion"},media:[R("Sliced onion in oil, soft and translucent with golden edges.","onion")],ingredientIds:["oil","onion-slice"],tips:[{kind:"watch",text:"If the onion goes brown in under a minute, your heat is too high. Turn it down a little before the next step."}]},{id:"s6",phase:"cook",title:"Fry the tomato paste until it darkens",body:"Add the tomato paste to the onions and stir it into the oil. Keep stirring, almost constantly, scraping the bottom of the pot. The paste will slowly change colour. Don\u2019t rush this part. Frying the paste is what removes the sour \u201Craw tomato\u201D taste.",cues:{see:"Bright tomato red slowly becomes a deeper brick red. It may start to stick to the bottom slightly.",smell:"Sharp and sour at first, then sweeter and richer."},about:"About 5\u20137 minutes",timer:{minutes:6,label:"Fry tomato paste"},media:[$t("15-second clip: stirring tomato paste in oil; colour change from bright red to brick red.","jollof")],ingredientIds:["tomato-paste"],tips:[{kind:"ready",text:"It\u2019s ready when it is a darker brick red, smells sweet rather than sharp, and the oil around the edges looks red."}],checkpoint:{question:"What colour is your paste now?",options:[{id:"bright",label:"Still bright red",verdict:"wait",media:R("Tomato paste just added: bright, shiny, tomato red.","jollof"),guidance:"Keep stirring for another 2\u20133 minutes."},{id:"brick",label:"Deeper, brick red",verdict:"good",media:R("Tomato paste correctly fried: deep brick red, oil tinted red at edges.","jollof"),guidance:"Perfect. Go straight to the next step."},{id:"black",label:"Dark brown with black bits",verdict:"fix",media:R("Overfried tomato paste: dark brown, black specks.","jollof"),guidance:"Turn off the heat. If it smells bitter, wipe the pot and start this step again. A bitter base ruins the whole pot. A few dark specks with no bitter smell are fine. Add the pepper base now."}]}},{id:"s7",phase:"cook",title:"Fry the pepper base until the oil rises",body:"Stand back a little and pour the thick pepper base into the pot. It will splutter. Stir well. Add the bay leaves, thyme and curry powder. Leave the lid off and let it cook on medium heat, stirring every 2\u20133 minutes and scraping the bottom each time.",why:"This is the most important step in the whole recipe. Rushing it is why jollof tastes raw or sour. Wait for the oil.",cues:{see:"A layer of red oil appears on top and around the edges of the pot. The sauce looks darker and glossy.",smell:"Rich and savoury, not like fresh tomatoes any more.",texture:"Thick enough that it holds its shape for a moment when you stir."},about:"About 10\u201315 minutes",timer:{minutes:12,label:"Fry pepper base"},media:[R("Close-up: red oil separated and floating on top of fried pepper base, pooled at the pot edge.","jollof"),$t("10-second clip: pushing the sauce aside with a spoon to show oil pooling.","jollof")],ingredientIds:["bay","thyme","curry"],tips:[{kind:"mcuire",text:"At Mcuire we say: \u201Cthe oil will tell you when it\u2019s ready.\u201D Until you see red oil on top, keep frying."},{kind:"watch",text:"If it starts to stick and darken quickly, lower the heat. Don\u2019t add water yet."}],checkpoint:{question:"Can you see oil floating on top?",options:[{id:"no-oil",label:"No oil, sauce looks wet",verdict:"wait",media:R("Pepper sauce just added: wet, no visible oil.","jollof"),guidance:"Keep frying and stirring every few minutes. This can take 15 minutes. That\u2019s normal."},{id:"some",label:"A little oil at the edges",verdict:"wait",media:R("Pepper sauce with thin oil beginning at the pot edge.","jollof"),guidance:"Nearly there. 3\u20135 more minutes."},{id:"oil",label:"Red oil clearly on top",verdict:"good",media:R("Fried pepper sauce with clear layer of red oil on top.","jollof"),guidance:"Beautiful. This is the moment. Move on."}]},troubleshooting:[{problem:"It\u2019s been 20 minutes and still no oil",fix:"Your base was probably still watery. Keep going, it will come. Or, if your sauce is very thick already, it may just need 2 tablespoons more oil."}]},{id:"s8",phase:"cook",title:"Season the sauce and taste",body:"Crumble in the stock cubes. Add the salt and white pepper. Pour in the warm stock and stir. Turn the heat up and let it come to a boil. Now taste it with a clean spoon (careful, it\u2019s hot).",why:"The sauce should taste a little too salty and too strong on its own. The rice will soak up the flavour. If the sauce tastes \u201Cjust right\u201D now, the rice will taste bland.",cues:{see:"A loose, red, bubbling sauce.",smell:"Savoury and warm, with curry and thyme."},about:"About 3\u20135 minutes",media:[R("Seasoned jollof sauce at a rolling boil before rice goes in.","jollof")],ingredientIds:["stock-cubes","salt","white-pepper","stock"],tips:[{kind:"ready",text:"It\u2019s ready when it\u2019s boiling and tastes slightly stronger and saltier than you\u2019d want to eat by itself."}],troubleshooting:[{problem:"It tastes too salty, not just slightly",fix:"Add \xBD cup of water and taste again. Remember the rice will absorb some salt."},{problem:"It tastes flat",fix:"Add half a stock cube or a pinch of salt and taste again."}]},{id:"s9",phase:"cook",title:"Add the rice and check the liquid level",body:"Tip in the drained rice and stir well so every grain is coated in red sauce. Then use your spoon to press the rice down flat. Now look closely. The liquid should come just to the top of the rice, not cover it like soup.",cues:{see:"The rice surface is flat. Liquid is just visible between the top grains, but the rice is not floating."},about:"About 2 minutes",media:[R("Rice pressed flat in sauce with liquid exactly level with the top of the rice.","jollof")],ingredientIds:["rice"],tips:[{kind:"chef",text:"Simple test: touch the surface lightly with the tip of a clean spoon. If liquid rises above the rice by more than a few millimetres, there\u2019s too much."},{kind:"mcuire",text:"Too little water is easy to fix later. Too much water makes soggy jollof. When in doubt, use less."}],checkpoint:{question:"Compare your liquid level",options:[{id:"flooded",label:"Rice is under liquid",verdict:"fix",media:R("Too much liquid: rice submerged like soup.","jollof"),guidance:"Spoon some liquid out into a cup until it\u2019s level with the rice. Keep it nearby in case you need it later."},{id:"level",label:"Liquid just at the rice",verdict:"good",media:R("Correct: liquid level with the rice surface.","jollof"),guidance:"Exactly right. Next step."},{id:"dry",label:"Rice looks dry on top",verdict:"fix",media:R("Too little liquid: dry grains on top, sauce only at the bottom.","jollof"),guidance:"Add \xBC cup of water or stock, stir once, and press flat again."}]}},{id:"s10",phase:"cook",title:"Cover tightly and steam on low",body:"Lay a sheet of foil over the top of the pot and press it down around the edges. Put the lid on top of the foil. Turn the heat down to LOW. Now leave it alone. Don\u2019t open it and don\u2019t stir it.",why:"Party jollof is steamed, not boiled. The foil traps steam so the grains cook evenly. Stirring now breaks the grains and makes it mushy.",cues:{hear:"Very quiet bubbling. If you hear loud boiling, the heat is too high.",smell:"After about 15 minutes it smells toasty and savoury."},about:"20 minutes",timer:{minutes:20,label:"Steam the rice"},media:[R("Pot covered with foil pressed around the rim, lid on top, low flame.","jollof")],ingredientIds:[],tips:[{kind:"watch",text:"If you smell burning before the timer ends, your heat is too high. Turn it to the lowest setting. Don\u2019t open the pot."},{kind:"kitchen",text:"Good time to fry your plantain or warm your chicken."}]},{id:"s11",phase:"cook",title:"Check the rice and turn it gently",body:"Take off the lid and foil. Taste a few grains from the top. Then slide your spatula down to the bottom of the pot and gently lift and fold the rice over, from bottom to top, in 4\u20135 places. Don\u2019t stir in circles. Cover again with the foil and lid and cook on low for 10 more minutes.",cues:{see:"Grains are swollen, orange-red, and mostly separate.",texture:"Soft on the outside with a very slight firmness in the middle."},about:"10 more minutes",timer:{minutes:10,label:"Final steam"},media:[$t("15-second clip: folding jollof from the bottom with a flat spatula, showing correct gentle motion.","jollof")],ingredientIds:[],checkpoint:{question:"How does the rice feel when you bite it?",options:[{id:"hard-dry",label:"Hard and the pot looks dry",verdict:"fix",media:R("Undercooked jollof: hard white centres, dry surface.","jollof"),guidance:"Sprinkle \xBC cup of water over the top (don\u2019t pour it in one spot). Cover and give it the full 10 minutes, then check again."},{id:"firm",label:"Soft outside, firm middle",verdict:"good",media:R("Nearly done jollof: grains swollen, slight bite.","jollof"),guidance:"Exactly where it should be. The last 10 minutes will finish it."},{id:"mushy",label:"Soft and wet or mushy",verdict:"fix",media:R("Overly wet jollof: grains soft and clumping.","jollof"),guidance:"Don\u2019t add anything and don\u2019t stir. Leave the lid off, keep the heat low, and let the extra water steam away for 5\u20138 minutes."}]}},{id:"s12",phase:"finish",title:"Make the smoky \u201Cparty\u201D finish",body:"Optional, but this is what makes it taste like party jollof. Add the butter on top. Lay the sliced tomatoes and onion rings over the rice. Cover again. Turn the heat up to medium for 3\u20135 minutes without stirring. The rice touching the bottom will toast and give a gentle smoky smell.",cues:{smell:"Toasty and slightly smoky, like bread toasted just past golden.",hear:"A light crackle from the bottom of the pot."},about:"3\u20135 minutes",timer:{minutes:4,label:"Party finish"},media:[R("Sliced tomato and onion rings laid over jollof with butter melting.","jollof")],ingredientIds:["butter","garnish-tomato","garnish-onion"],tips:[{kind:"mcuire",text:"At Nigerian parties, jollof is cooked in huge pots over firewood. That smoky \u201Cbottom pot\u201D flavour is what everyone is chasing. This step is how you get it at home."},{kind:"watch",text:"If the smell turns sharp or bitter, switch off the heat immediately. When you serve, don\u2019t scrape up the very bottom layer."}]},{id:"s13",phase:"finish",title:"Rest it, then fluff",body:"Turn off the heat. Leave the pot covered for 5\u201310 minutes. Then remove the bay leaves and gently fluff the rice with a fork or spatula, lifting from the bottom.",why:"Resting lets the last of the steam settle into the grains so they firm up and separate.",about:"5\u201310 minutes",timer:{minutes:5,label:"Rest jollof"},media:[R("Fluffing finished jollof with a fork: separate, glossy grains.","jollof")],ingredientIds:[]},{id:"s14",phase:"finish",title:"Serve it like Mcuire",body:"Spoon the jollof onto plates. Serve with chicken, fried plantain and a simple salad or coleslaw. You can share some of the smoky bottom-pot rice too, as long as it isn\u2019t burnt black.",cues:{see:"Deep orange-red grains, separate and glossy, not wet. A few darker smoky grains are a good sign."},media:[R("Mcuire plating: jollof, peppered chicken, dodo, salad on a Mcuire plate. 45\xB0.","jollof")],ingredientIds:[],tips:[{kind:"kitchen",text:"Leftovers keep 3 days in the fridge. Reheat with a splash of water, covered, until steaming hot all the way through."}],checkpoint:{question:"Does yours look like this?",options:[{id:"perfect",label:"Red, separate, glossy grains",verdict:"good",media:R("Perfect finished jollof close-up.","jollof"),guidance:"You did it. That is party jollof."},{id:"pale",label:"Paler / more orange than red",verdict:"fix",media:R("Pale orange jollof for comparison.","jollof"),guidance:"Still delicious! Next time, use one more red pepper and fry the tomato paste a minute or two longer for a deeper colour."},{id:"soft",label:"A bit soft or sticky",verdict:"fix",media:R("Soft, slightly sticky jollof for comparison.","jollof"),guidance:"Next time, start with a little less stock in step 9 and wash the rice one more time. Your flavour is the hard part, and you have it."}]}}]},q=(t,e,i,a,o,n,r,l="Beginner friendly",m)=>({id:t,slug:t,status:"outline",title:i,subtitle:o,categoryId:e,region:a,prepMinutes:n,cookMinutes:r,difficulty:l,baseServings:4,servingOptions:[2,4,6,10,15,20],previewSteps:0,allergens:[],dietary:[],hero:R(`Finished ${i}, plated Mcuire style.`,m||Ja.find(g=>g.id===e).tone),equipment:[],ingredients:[],steps:[]}),js=[q("
