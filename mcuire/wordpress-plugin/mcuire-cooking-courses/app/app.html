Faster way: put the soaked beans in the blender with water and pulse 2\u20133 times, just to crack them. The skins float off when you add more water.`,why:"Skins make moi moi grainy and grey. Peeled beans give that silky, orange finish.",about:"15\u201320 minutes",media:[ue("20-second clip: rubbing beans between palms underwater; skins floating to the top and being poured off.","rice")],ingredientIds:[],checkpoint:{question:"How do your beans look?",options:[{id:"skins",label:"Lots of dark skins left",verdict:"wait",media:j("Half-peeled beans, many dark skins.","rice"),guidance:"Keep rubbing and rinsing. Change the water each round."},{id:"white",label:"Mostly white, a few skins",verdict:"good",media:j("Correctly peeled beans, mostly white.","rice"),guidance:"Perfect. A few skins are fine."}]}},{id:"m3",phase:"prep",title:"Blend until completely smooth",body:"Drain the beans. Roughly chop the peppers and onion. Blend everything with just enough water to keep the blender moving, about \xBD cup to start. Blend in two batches if needed, until perfectly smooth.",cues:{texture:"Smooth like thick custard. Rub a little between your fingers: it shouldn\u2019t feel gritty."},about:"3\u20135 minutes",media:[j("Smooth orange bean batter pouring from the blender.","jollof")],ingredientIds:["rbp","sb","onion"],checkpoint:{question:"Rub some between your fingers. How does it feel?",options:[{id:"gritty",label:"Gritty or grainy",verdict:"wait",media:j("Grainy bean batter.","jollof"),guidance:"Blend for another 1\u20132 minutes. Add a splash of water if the blender is struggling."},{id:"smooth",label:"Silky smooth",verdict:"good",media:j("Silky smooth bean batter.","jollof"),guidance:"Perfect."}]}},{id:"m4",phase:"prep",title:"Season and loosen the batter",body:"Pour the batter into a big bowl. Stir in the oil, crayfish, crumbled stock cubes and salt. Now add the warm stock a little at a time, stirring well, until it pours slowly off the spoon.",why:"The thickness decides the texture. Too thick and moi moi comes out hard and dry; too thin and it won\u2019t set.",cues:{texture:"Like thick pancake batter: it pours off the spoon slowly and smoothly.",see:"Bright orange and glossy from the oil."},about:"5 minutes",media:[ue("10-second clip: lifting a spoon from the seasoned batter to show it pouring slowly.","jollof")],ingredientIds:["oil","crayfish","stock-cubes","salt","warm-stock"],tips:[{kind:"watch",text:"Don\u2019t taste the raw batter. Raw beans can upset your stomach. Measure the seasoning instead. You can adjust next time."}],checkpoint:{question:"How does your batter pour?",options:[{id:"thick",label:"Thick paste, barely moves",verdict:"fix",media:j("Batter too thick, sitting on the spoon.","jollof"),guidance:"Add more warm stock, 2 tablespoons at a time."},{id:"right",label:"Pours slowly like pancake batter",verdict:"good",media:j("Correct moi moi batter consistency.","jollof"),guidance:"Perfect."},{id:"thin",label:"Runs like soup",verdict:"fix",media:j("Batter too thin, runny.","jollof"),guidance:"Too thin. Stir in a few tablespoons of bean flour (or blend a few more soaked beans). Otherwise it may not set."}]}},{id:"m5",phase:"prep",title:"Fill the containers",body:"Lightly oil each container. Fill them about three-quarters full (it rises a little). Push a slice of egg and a little fish into each one. Cover each tightly with a piece of foil.",about:"10 minutes",media:[j("Ramekins filled \xBE with orange batter, egg slices pushed in, foil being pressed over.","jollof")],ingredientIds:["eggs","fish"]},{id:"m6",phase:"cook",title:"Steam the moi moi",body:"Put the rack or crumpled foil in the bottom of your big pot and arrange the containers on it. Carefully pour boiling water into the pot until it comes about halfway up the sides of the containers. Cover the pot and steam on medium-low.",cues:{hear:"A gentle bubbling under the lid. Not a hard, rattling boil."},about:"45\u201360 minutes",timer:{minutes:45,label:"Steam the moi moi"},media:[j("Covered ramekins standing in a pot with water halfway up their sides.","rice")],ingredientIds:[],tips:[{kind:"watch",text:"Check the water every 15 minutes and top up with boiling water from the kettle. If the pot boils dry, the bottoms will burn."}]},{id:"m7",phase:"cook",title:"Check that it\u2019s set",body:"Lift the foil off one container (watch out for steam) and push a knife or skewer into the centre, then pull it out.",cues:{texture:"Firm and springy when pressed, like a set custard."},about:"1 minute",media:[j("Clean knife pulled out of a set moi moi.","jollof")],ingredientIds:[],checkpoint:{question:"What\u2019s on the knife?",options:[{id:"wet",label:"Wet batter sticks to it",verdict:"wait",media:j("Knife with wet batter on it.","jollof"),guidance:"Not set yet. Re-cover and steam for 10\u201315 more minutes, then check again."},{id:"clean",label:"Comes out clean",verdict:"good",media:j("Clean knife from a set moi moi.","jollof"),guidance:"It\u2019s done. Turn off the heat."}]}},{id:"m8",phase:"finish",title:"Rest, turn out and serve",body:"Leave the moi moi to rest in the pot for 10 minutes. It firms up as it cools slightly. Run a knife around the edge and turn it out onto a plate, or serve it right in the container.",about:"10 minutes",timer:{minutes:10,label:"Rest the moi moi"},media:[j("Mcuire plating: moi moi turned out next to jollof and dodo.","jollof")],ingredientIds:[],tips:[{kind:"kitchen",text:"Moi moi freezes beautifully for up to 2 months. Reheat by steaming for 15 minutes."}]}]}});var C,me,gt,la,da,ca,pa,ha,ua=N(()=>{C=(t,e,i=t)=>({kind:"photo",src:null,alt:i,brief:t,tone:e}),me=(t,e,i=t)=>({kind:"video",src:null,poster:null,alt:i,brief:t,tone:e}),gt="Check stock cubes: some contain wheat, soy or celery",la={id:"efo-riro",slug:"efo-riro",status:"complete",title:"Efo Riro",subtitle:"Spinach stewed in a rich, fried pepper sauce with palm oil, iru and tender meat.",categoryId:"soups",region:"Nigeria (Yoruba)",story:"\u201CEfo riro\u201D means \u201Cstirred leaves\u201D in Yoruba. It\u2019s a thick vegetable stew, not a runny soup. The trick is squeezing the water out of the spinach so the sauce stays rich, and frying the peppers until the oil rises.",prepMinutes:25,cookMinutes:50,difficulty:"Beginner friendly",baseServings:6,servingOptions:[2,4,6,10,15,20],previewSteps:0,allergens:["Fish and shellfish (dried fish, crayfish)",gt],dietary:["Gluten-free if your stock cubes are","Dairy-free"],hero:C("Efo riro in a pot: dark green spinach in red pepper sauce, glossy palm oil, pieces of meat. Overhead.","leaf","A pot of efo riro"),gallery:[C("Efo riro plated with a ball of pounded yam.","leaf")],serveWith:["Pounded Yam","Eba","White rice","Boiled yam or plantain"],equipment:[{name:"Large pot",note:""},{name:"Colander",note:"For washing and squeezing the spinach."},{name:"Blender",note:""},{name:"Wooden spoon",note:""},{name:"Knife and chopping board",note:""}],ingredients:[{id:"spinach",group:"Greens",name:"Fresh spinach",qty:1,unit:"kg",shopCategory:"Produce",availability:["mainstream"],note:"It looks like a lot, but it shrinks to a fraction.",substitutes:[{name:"Frozen chopped spinach, 800 g",note:"Thaw it, then squeeze out all the water in step 1."},{name:"Tete or soko leaves",note:"The traditional greens, at African grocery stores."}]},{id:"meat",group:"Meat & fish",name:"Beef, goat or assorted meat, in chunks",qty:600,unit:"g",shopCategory:"Meat & Fish",availability:["mainstream","african-grocery"],substitutes:[{name:"Smoked turkey wings",note:"Very popular in Canada and the US. Simmer about 40 minutes."}]},{id:"dried-fish",group:"Meat & fish",name:"Dried or smoked fish",qty:150,unit:"g",optional:!0,shopCategory:"African Ingredients",availability:["african-grocery","online"],substitutes:[{name:"Smoked mackerel",note:""}]},{id:"rbp",group:"Pepper sauce",name:"Red bell peppers (tatashe)",qty:3,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"sb",group:"Pepper sauce",name:"Scotch bonnet peppers",qty:2,unit:"",scale:"taste",shopCategory:"Produce",availability:["african-grocery","international","mainstream"],substitutes:[{name:"Habanero",note:""}]},{id:"tomato",group:"Pepper sauce",name:"Tomatoes",qty:2,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"onion",group:"Pepper sauce",name:"Onions (1 for blending, 1 sliced)",qty:2,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"palm-oil",group:"Pepper sauce",name:"Red palm oil",qty:.5,unit:"cup",altQty:120,altUnit:"ml",shopCategory:"African Ingredients",availability:["african-grocery","online"],substitutes:[{name:"Vegetable oil + 1 tsp paprika",note:"For colour; the flavour will be milder."}]},{id:"iru",group:"Pepper sauce",name:"Iru (fermented locust beans)",qty:1,unit:"tbsp",shopCategory:"African Ingredients",availability:["african-grocery","online"],note:"The signature flavour of efo riro. Strong smell, deep taste.",substitutes:[{name:"1 tsp white miso",note:"Similar savoury depth."}]},{id:"crayfish",group:"Pepper sauce",name:"Ground crayfish",qty:2,unit:"tbsp",shopCategory:"African Ingredients",availability:["african-grocery","online"],substitutes:[{name:"Dried shrimp powder",note:""}]},{id:"stock-cubes",group:"Pepper sauce",name:"Stock cubes",qty:3,unit:"cube",scale:"whole",shopCategory:"African Ingredients",availability:["mainstream","african-grocery"],substitutes:[]},{id:"salt",group:"Pepper sauce",name:"Salt",qty:1,unit:"tsp",scale:"taste",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]}],steps:[{id:"er1",phase:"prep",title:"Wash, chop and squeeze the spinach",body:"Wash the spinach well in a big bowl of water, then chop it roughly. Put it in a colander in the sink and pour a kettle of boiling water over it. When it\u2019s cool enough to touch, take handfuls and squeeze out as much water as you can.",why:"Spinach is full of water. If you don\u2019t squeeze it out, your efo riro turns watery and pale.",about:"10 minutes",media:[me("10-second clip: squeezing a handful of wilted spinach until water stops dripping.","leaf")],ingredientIds:["spinach"],checkpoint:{question:"Squeeze a handful. What happens?",options:[{id:"drips",label:"Water still runs out",verdict:"wait",media:C("Spinach dripping water when squeezed.","leaf"),guidance:"Squeeze harder, a little at a time."},{id:"dry",label:"Only a few drops",verdict:"good",media:C("Tight, squeezed balls of spinach.","leaf"),guidance:"Perfect. Set it aside."}]}},{id:"er2",phase:"cook",title:"Cook the meat",body:"Put the meat in a pot with half of the sliced onion, 1 crumbled stock cube, a pinch of salt and \xBD cup of water. Cover and let it steam for 10 minutes, then add 2 cups of water and simmer until tender. Keep the stock.",cues:{texture:"A fork slides into the meat easily."},about:"35\u201345 minutes",timer:{minutes:35,label:"Simmer the meat"},media:[C("Seasoned meat simmering in its stock.","suya")],ingredientIds:["meat"],tips:[{kind:"mcuire",text:"Already cooked meat for egusi or stew this week? Use that and skip to step 3."}]},{id:"er3",phase:"prep",title:"Blend the peppers roughly",body:"Blend the red peppers, scotch bonnets, tomatoes and one onion for just a few seconds. Leave it a little chunky.",cues:{see:"A coarse, bright red mix with tiny bits visible."},about:"1 minute",media:[C("Coarse red pepper blend in a blender jug.","jollof")],ingredientIds:["rbp","sb","tomato","onion"],tips:[{kind:"chef",text:"Coarse is traditional for efo riro. It gives the stew a lovely texture."}]},{id:"er4",phase:"cook",title:"Boil the pepper mix down",body:"Pour the blend into a pot and cook on medium-high with the lid off, stirring now and then, until about a third of the liquid has bubbled away and it looks thick.",cues:{texture:"Like a thick, chunky sauce. A spoon leaves a trail."},about:"10\u201315 minutes",timer:{minutes:10,label:"Boil down peppers"},media:[C("Reduced pepper mix, thick and darker red.","jollof")],ingredientIds:[],checkpoint:{question:"Is it thick yet?",options:[{id:"thin",label:"Still watery",verdict:"wait",media:C("Pepper mix still thin.","jollof"),guidance:"Keep it bubbling for 5 more minutes."},{id:"thick",label:"Thick, spoon leaves a trail",verdict:"good",media:C("Reduced pepper mix with spoon trail.","jollof"),guidance:"Great. Tip it into a bowl and wipe the pot."}]}},{id:"er5",phase:"cook",title:"Fry the onion and iru in palm oil",body:"Warm the palm oil in the pot on medium until melted and clear. Add the remaining sliced onion and the iru. Stir for 2 minutes.",cues:{smell:"Strong and savoury from the iru. That\u2019s right."},about:"3 minutes",media:[C("Palm oil with onion and iru frying.","jollof")],ingredientIds:["palm-oil","iru"],tips:[{kind:"watch",text:"Palm oil should never smoke. If it does, take the pot off the heat for a minute."}]},{id:"er6",phase:"cook",title:"Fry the peppers until the oil rises",body:"Add the thick pepper mix to the pot. Fry on medium, stirring every couple of minutes, until it\u2019s darker and the oil separates and floats on top.",cues:{see:"A layer of red oil on top and around the edges.",smell:"Cooked and sweet, not raw."},about:"10\u201312 minutes",timer:{minutes:10,label:"Fry pepper sauce"},media:[C("Fried pepper sauce with red oil floating on top.","jollof")],ingredientIds:[],checkpoint:{question:"Can you see the oil on top?",options:[{id:"no",label:"Not yet",verdict:"wait",media:C("Pepper sauce without separated oil.","jollof"),guidance:"Keep frying, 3\u20135 more minutes."},{id:"yes",label:"Yes, red oil floating",verdict:"good",media:C("Pepper sauce with oil floating.","jollof"),guidance:"Perfect. Next step."}]}},{id:"er7",phase:"cook",title:"Add meat, fish and seasoning",body:"Add the cooked meat, the fish, the crayfish, 2 crumbled stock cubes and about \xBD cup of the meat stock. Stir and simmer for 5 minutes. Taste and add salt if needed.",about:"5 minutes",timer:{minutes:5,label:"Simmer with meat"},media:[],ingredientIds:["dried-fish","crayfish","stock-cubes","salt"],tips:[{kind:"ready",text:"The sauce should be thick, not runny. Add more stock only if it\u2019s sticking."}]},{id:"er8",phase:"finish",title:"Stir in the spinach",body:"Add the squeezed spinach. Stir well so the leaves are coated in the red sauce. Cook uncovered for 3\u20135 minutes, stirring once or twice. Don\u2019t add water.",cues:{see:"Dark green leaves evenly coated in red sauce, with oil glistening."},about:"3\u20135 minutes",timer:{minutes:3,label:"Cook the spinach"},media:[me("8-second clip: folding squeezed spinach into the red pepper sauce.","leaf")],ingredientIds:[],checkpoint:{question:"How does your efo look?",options:[{id:"watery",label:"Watery at the bottom",verdict:"fix",media:C("Watery efo riro.","leaf"),guidance:"Leave the lid off and cook 3\u20135 more minutes so the water evaporates. Next time, squeeze the spinach harder."},{id:"right",label:"Thick, glossy, leaves coated",verdict:"good",media:C("Correct efo riro: thick and glossy.","leaf"),guidance:"That\u2019s efo riro."}]}},{id:"er9",phase:"finish",title:"Serve",body:"Serve hot with pounded yam, eba, white rice, or boiled yam.",media:[C("Mcuire plating: efo riro beside pounded yam.","leaf")],ingredientIds:[],tips:[{kind:"kitchen",text:"Keeps 3 days in the fridge and freezes well for a month."}]}]},da={id:"ogbono",slug:"ogbono",status:"complete",title:"Ogbono Soup",subtitle:"The famously \u201Cdrawy\u201D soup: silky, savoury and stretchy, perfect with swallow.",categoryId:"soups",region:"Nigeria",story:"Ogbono is made from ground wild mango seeds. When cooked, they give the soup its famous \u201Cdraw\u201D: long, silky strands when you lift your spoon. The key is low heat and patience. Rush it and it burns or goes lumpy.",prepMinutes:20,cookMinutes:60,difficulty:"Beginner friendly",baseServings:6,servingOptions:[2,4,6,10,15,20],previewSteps:0,allergens:["Fish and shellfish (dried fish, crayfish)",gt],dietary:["Gluten-free if your stock cubes are","Dairy-free"],hero:C("Ogbono soup with a spoon lifting long stretchy strands, meat and greens visible. 45\xB0.","egusi","Ogbono soup"),gallery:[C("Ground ogbono powder next to whole ogbono seeds.","egusi")],serveWith:["Eba","Pounded Yam","Fufu","Semolina"],equipment:[{name:"Large heavy pot",note:"A heavy base stops the soup catching."},{name:"Wooden spoon",note:""},{name:"Knife and chopping board",note:""}],ingredients:[{id:"meat",group:"Meat & fish",name:"Beef or assorted meat, in chunks",qty:800,unit:"g",shopCategory:"Meat & Fish",availability:["mainstream","african-grocery"],substitutes:[{name:"Smoked turkey or chicken",note:""}]},{id:"dried-fish",group:"Meat & fish",name:"Dried or smoked fish",qty:150,unit:"g",shopCategory:"African Ingredients",availability:["african-grocery","online"],substitutes:[{name:"Smoked mackerel",note:""}]},{id:"ogbono-seed",group:"Soup",name:"Ground ogbono",qty:.5,unit:"cup",altQty:70,altUnit:"g",shopCategory:"African Ingredients",availability:["african-grocery","online"],note:"Buy it ground, or grind whole seeds in a dry blender. Keep it in the freezer so it stays fresh.",substitutes:[{name:"No true substitute",note:"Okra soup gives a similar \u201Cdraw\u201D if you can\u2019t find ogbono."}]},{id:"palm-oil",group:"Soup",name:"Red palm oil",qty:.33,unit:"cup",altQty:80,altUnit:"ml",shopCategory:"African Ingredients",availability:["african-grocery","online"],substitutes:[]},{id:"sb",group:"Soup",name:"Scotch bonnet peppers, finely chopped or blended",qty:2,unit:"",scale:"taste",shopCategory:"Produce",availability:["african-grocery","international","mainstream"],substitutes:[{name:"Habanero",note:""}]},{id:"crayfish",group:"Soup",name:"Ground crayfish",qty:2,unit:"tbsp",shopCategory:"African Ingredients",availability:["african-grocery","online"],substitutes:[{name:"Dried shrimp powder",note:""}]},{id:"stock-cubes",group:"Soup",name:"Stock cubes",qty:3,unit:"cube",scale:"whole",shopCategory:"African Ingredients",availability:["mainstream","african-grocery"],substitutes:[]},{id:"onion",group:"Soup",name:"Onion",qty:1,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"salt",group:"Soup",name:"Salt",qty:1,unit:"tsp",scale:"taste",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"greens",group:"Greens",name:"Spinach or ugu leaves, chopped",qty:200,unit:"g",shopCategory:"Produce",availability:["mainstream","african-grocery"],substitutes:[{name:"Frozen spinach",note:"Thaw and squeeze dry."}]},{id:"okra",group:"Greens",name:"Okra, thinly sliced",qty:150,unit:"g",optional:!0,shopCategory:"Produce",availability:["african-grocery","international","mainstream"],note:"Adds even more draw.",substitutes:[{name:"Frozen sliced okra",note:""}]}],steps:[{id:"og1",phase:"cook",title:"Season and cook the meat",body:"Put the meat in a pot with half the onion (chopped), 1 crumbled stock cube, a pinch of salt and \xBD cup of water. Cover and steam for 10 minutes, then add 4 cups of water and simmer until tender. You\u2019ll need about 3\u20134 cups of this stock for the soup.",cues:{texture:"A fork slides in easily."},about:"35\u201345 minutes",timer:{minutes:35,label:"Simmer the meat"},media:[C("Meat simmering in plenty of stock.","suya")],ingredientIds:["meat"]},{id:"og2",phase:"prep",title:"Prepare the fish and greens",body:"While the meat cooks, soak the dried fish in hot water for 10 minutes, then remove the bones and break it into pieces. Wash and chop the greens, and slice the okra thinly if you\u2019re using it.",about:"10 minutes",timer:{minutes:10,label:"Soak the fish"},media:[C("Prepared fish pieces, chopped greens and sliced okra in bowls.","leaf")],ingredientIds:["dried-fish","greens","okra"]},{id:"og3",phase:"cook",title:"Melt the ogbono into the palm oil, on low",body:"Lift the meat out and pour the stock into a jug. Put the empty pot on LOW heat and add the palm oil. As soon as it melts, add the ground ogbono and stir constantly for 1\u20132 minutes until it dissolves into a smooth, thick paste with no dry powder.",why:"Low heat is everything with ogbono. High heat makes it burn and lose its draw.",cues:{see:"A smooth, lighter, creamy-orange paste."},about:"2 minutes",media:[me("10-second clip: stirring ground ogbono into melted palm oil on low heat until smooth.","egusi")],ingredientIds:["palm-oil","ogbono-seed"],checkpoint:{question:"How does it look?",options:[{id:"lumpy",label:"Dry lumps of powder",verdict:"wait",media:C("Ogbono not yet dissolved, dry lumps.","egusi"),guidance:"Keep stirring on low and press the lumps against the pot."},{id:"smooth",label:"Smooth, creamy paste",verdict:"good",media:C("Smooth ogbono paste in palm oil.","egusi"),guidance:"Perfect. Add the stock now."}]}},{id:"og4",phase:"cook",title:"Add the stock little by little",body:"Pour in about 1 cup of stock and stir until it\u2019s smooth. Keep adding stock, one cup at a time, stirring each time, until you\u2019ve added about 3 cups. Add the scotch bonnet, crayfish and 1 crumbled stock cube.",cues:{see:"It turns thick and starts to look stretchy."},about:"3\u20134 minutes",media:[],ingredientIds:["sb","crayfish","stock-cubes"]},{id:"og5",phase:"cook",title:"Simmer gently to build the draw",body:"Keep the heat low and leave the lid off. Simmer, stirring and scraping the bottom every 3 minutes so it doesn\u2019t stick.",cues:{texture:"When you lift the spoon, long silky strands stretch from it."},about:"15 minutes",timer:{minutes:15,label:"Simmer the ogbono"},media:[me("8-second clip: lifting a spoon to show long stretchy ogbono strands.","egusi")],ingredientIds:[],tips:[{kind:"watch",text:"Ogbono catches on the bottom easily. If you smell burning, move it to a clean pot straight away without scraping."},{kind:"mcuire",text:"Many Nigerian cooks keep the lid off ogbono. They say covering it kills the draw."}],checkpoint:{question:"Lift your spoon. What do you see?",options:[{id:"none",label:"No strands yet",verdict:"wait",media:C("Ogbono without draw.","egusi"),guidance:"Keep simmering on low for 5 more minutes."},{id:"draw",label:"Long, silky strands",verdict:"good",media:C("Ogbono with long draw.","egusi"),guidance:"That\u2019s the draw. Perfect."},{id:"thick",label:"Very thick, hard to stir",verdict:"fix",media:C("Overly thick ogbono.","egusi"),guidance:"Stir in \xBD cup of the remaining stock."}]}},{id:"og6",phase:"cook",title:"Add the meat and fish, then taste",body:"Add the meat and fish. Simmer for 5 more minutes. Taste and add salt or the last stock cube if needed.",about:"5 minutes",timer:{minutes:5,label:"Simmer with meat"},media:[],ingredientIds:["salt"]},{id:"og7",phase:"finish",title:"Stir in the greens (and okra)",body:"Add the okra (if using) and the greens. Stir and cook for 3 minutes, until the leaves wilt but are still bright green. Turn off the heat.",about:"3 minutes",timer:{minutes:3,label:"Cook the greens"},media:[C("Greens and okra stirred into ogbono.","leaf")],ingredientIds:[]},{id:"og8",phase:"finish",title:"Serve with swallow",body:"Serve hot in bowls with eba, pounded yam or fufu. Pinch the swallow, dip, and let the soup \u201Cdraw\u201D onto it.",media:[C("Mcuire plating: ogbono with eba, a pinch of eba lifting drawy soup.","egusi")],ingredientIds:[],tips:[{kind:"kitchen",text:"When reheating, add a splash of water and warm it slowly on low. Ogbono thickens in the fridge."}]}]},ca={id:"akara",slug:"akara",status:"complete",title:"Akara",subtitle:"Crisp, golden bean fritters, fluffy inside, spiked with onion and pepper.",categoryId:"street",region:"Nigeria",story:"Akara is the classic Saturday-morning street breakfast, fried fresh at the roadside and eaten with pap or bread. It uses the same peeled beans as moi moi, but blended very thick and whipped with air so it puffs up in the oil.",prepMinutes:60,cookMinutes:20,difficulty:"Intermediate",baseServings:6,servingOptions:[2,4,6,10,15,20],previewSteps:0,allergens:[gt],dietary:["Vegan","Gluten-free if your stock cube is"],hero:C("A pile of golden, craggy akara balls, one broken open to show fluffy inside. Breakfast light.","plantain","Golden akara"),gallery:[C("Akara with a bowl of pap and a split bread roll.","rice")],serveWith:["Pap (ogi) or custard","Soft bread rolls (akara and bread)","Tea"],equipment:[{name:"Large bowl",note:""},{name:"Blender",note:""},{name:"Wooden spoon or hand whisk",note:"An electric whisk works too."},{name:"Deep pot or wok",note:"For deep frying."},{name:"Slotted spoon",note:""},{name:"Tablespoon",note:"For dropping the batter."}],ingredients:[{id:"beans",name:"Black-eyed beans or Nigerian brown beans (dry)",qty:2,unit:"cup",altQty:400,altUnit:"g",shopCategory:"Rice & Grains",availability:["mainstream","african-grocery"],substitutes:[{name:"Peeled bean flour (akara flour)",note:"Mix with a little water to a thick paste, then whisk as in step 4."}]},{id:"onion",name:"Onion, finely chopped",qty:1,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"sb",name:"Scotch bonnet, finely chopped",qty:1,unit:"",scale:"taste",shopCategory:"Produce",availability:["african-grocery","international","mainstream"],substitutes:[{name:"Habanero",note:""}]},{id:"salt",name:"Salt",qty:1,unit:"tsp",scale:"taste",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"stock-cube",name:"Stock cube, crushed",qty:1,unit:"cube",scale:"whole",optional:!0,shopCategory:"African Ingredients",availability:["mainstream","african-grocery"],substitutes:[]},{id:"oil",name:"Vegetable oil for deep frying",qty:4,unit:"cup",altQty:1,altUnit:"l",scale:"fixed",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]}],steps:[{id:"ak1",phase:"prep",title:"Soak the beans",body:"Cover the beans with plenty of cold water and leave them to soak so the skins loosen.",about:"30\u201360 minutes",timer:{minutes:30,label:"Soak the beans"},media:[C("Beans soaking, skins wrinkling.","rice")],ingredientIds:["beans"]},{id:"ak2",phase:"prep",title:"Peel the beans",body:"Rub handfuls of beans firmly between your palms under the water. The skins float. Pour them off, add fresh water and repeat until the beans are mostly white. (Or pulse the soaked beans 2\u20133 times in the blender with water to crack the skins, then float them off.)",about:"15\u201320 minutes",media:[me("15-second clip: rubbing beans underwater and pouring off the floating skins.","rice")],ingredientIds:[],checkpoint:{question:"How do your beans look?",options:[{id:"skins",label:"Lots of dark skins",verdict:"wait",media:C("Half-peeled beans.","rice"),guidance:"Keep rubbing and rinsing."},{id:"white",label:"Mostly white",verdict:"good",media:C("Peeled white beans.","rice"),guidance:"Perfect."}]}},{id:"ak3",phase:"prep",title:"Blend very thick",body:"Drain the beans well. Blend them with as little water as possible, starting with just 3\u20134 tablespoons and adding more only if the blender is stuck. Stop the blender and push the mix down with a spoon as needed.",why:"This is the big difference from moi moi. Akara batter must be thick. Watery batter spreads flat in the oil and soaks up grease.",cues:{texture:"Thick, smooth paste that holds its shape on a spoon, like thick hummus."},about:"3\u20135 minutes",media:[C("Thick akara paste holding its shape on a spoon.","rice")],ingredientIds:[],checkpoint:{question:"How thick is your paste?",options:[{id:"runny",label:"Runny, pours easily",verdict:"fix",media:C("Runny bean batter.","rice"),guidance:"Too much water. Blend in a few more soaked beans, or stir in 2\u20133 tablespoons of bean flour."},{id:"thick",label:"Thick, holds its shape",verdict:"good",media:C("Thick, correct akara paste.","rice"),guidance:"Perfect."}]}},{id:"ak4",phase:"prep",title:"Whip air into the batter",body:"Tip the paste into a bowl. Beat it hard with a wooden spoon or whisk, in a circular folding motion, for 3\u20135 minutes (2 minutes with an electric whisk).",why:"Whipping traps air, and the air is what makes akara puff up light and fluffy.",cues:{see:"Paler, lighter and bigger, with a mousse-like look."},about:"3\u20135 minutes",media:[me("15-second clip: whipping akara batter until pale and fluffy.","rice")],ingredientIds:[],tips:[{kind:"chef",text:"Test it: drop a small blob into a glass of water. If it floats, the batter is ready. If it sinks, whip for another minute."}],checkpoint:{question:"Try the float test. What happens?",options:[{id:"sinks",label:"It sinks",verdict:"wait",media:C("Batter blob sinking in water.","rice"),guidance:"Whip for another 1\u20132 minutes and test again."},{id:"floats",label:"It floats",verdict:"good",media:C("Batter blob floating in water.","rice"),guidance:"Perfect. Light and full of air."}]}},{id:"ak5",phase:"cook",title:"Heat the oil",body:"Heat oil about 6\u20138 cm deep in the pot on medium. Test with a small drop of batter: it should rise and sizzle steadily within 3\u20134 seconds (about 170\xB0C).",about:"5\u20138 minutes",media:[],ingredientIds:["oil"],tips:[{kind:"watch",text:"Never leave hot oil alone. Keep a lid nearby, and never use water on an oil fire."}]},{id:"ak6",phase:"cook",title:"Season just before frying",body:"Only now, just before frying, gently fold in the chopped onion, scotch bonnet, salt and stock cube. Don\u2019t beat it again. You want to keep the air in.",why:"Salt added too early pulls water out of the onion and makes the batter runny.",about:"1 minute",media:[],ingredientIds:["onion","sb","salt","stock-cube"]},{id:"ak7",phase:"cook",title:"Fry spoonfuls until golden",body:"Dip a tablespoon in the hot oil (so the batter slides off), scoop up a spoonful of batter and gently drop it into the oil. Fry 5\u20136 at a time. When the bottom is golden, turn them and fry the other side.",cues:{see:"Puffed, craggy and deep golden-brown.",hear:"A lively, steady sizzle."},about:"3\u20134 minutes per batch",timer:{minutes:3,label:"Fry akara batch"},media:[me("12-second clip: dropping spoonfuls of akara batter into oil and turning golden fritters.","plantain")],ingredientIds:[],checkpoint:{question:"How do your akara look?",options:[{id:"flat",label:"Flat and oily",verdict:"fix",media:C("Flat, oily akara.","rice"),guidance:"The oil is too cool or the batter too thin. Turn the heat up a little and whip the batter again."},{id:"golden",label:"Puffed and golden",verdict:"good",media:C("Perfect puffed golden akara.","plantain"),guidance:"Perfect. Keep going."},{id:"dark",label:"Dark outside, raw inside",verdict:"fix",media:C("Akara too dark outside.","suya"),guidance:"Oil too hot. Turn it down and wait 2 minutes."}]}},{id:"ak8",phase:"finish",title:"Drain and serve hot",body:"Lift the akara out onto paper towels. Serve hot with pap (ogi), custard, or tucked into soft bread rolls.",media:[C("Mcuire plating: akara with pap and bread.","plantain")],ingredientIds:[],tips:[{kind:"ready",text:"Crisp outside, soft and fluffy inside, with no wet batter in the middle."}]}]},pa={id:"chin-chin",slug:"chin-chin",status:"complete",title:"Chin Chin",subtitle:"Crunchy, lightly sweet little fried dough bites with a hint of nutmeg.",categoryId:"street",region:"Nigeria",story:"Chin chin is the snack in every Nigerian party pack and on every coffee table at Christmas. It\u2019s a simple dough, rolled, cut into small squares and fried until crunchy. It keeps for weeks, so make a big batch.",prepMinutes:30,cookMinutes:30,difficulty:"Beginner friendly",baseServings:8,servingOptions:[4,8,16,24,40],previewSteps:0,allergens:["Wheat (gluten)","Eggs","Milk"],dietary:[],hero:C("A glass jar and bowl full of small golden chin chin squares. Natural light.","plantain","Chin chin"),gallery:[C("Rolled dough cut into small squares on a floured board.","rice")],serveWith:["Chapman or soft drinks","Party packs","Tea or coffee"],equipment:[{name:"Large mixing bowl",note:""},{name:"Rolling pin",note:"A clean wine bottle works too."},{name:"Knife or pizza cutter",note:""},{name:"Deep pot or wok",note:""},{name:"Slotted spoon",note:""},{name:"Airtight jar or container",note:"For storing."}],ingredients:[{id:"flour",name:"All-purpose (plain) flour",qty:3,unit:"cup",altQty:375,altUnit:"g",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"sugar",name:"Sugar",qty:.33,unit:"cup",altQty:70,altUnit:"g",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"bp",name:"Baking powder",qty:.5,unit:"tsp",shopCategory:"Pantry",availability:["mainstream"],note:"Makes it slightly lighter. Leave it out for extra-hard, crunchy chin chin.",substitutes:[]},{id:"nutmeg",name:"Ground nutmeg",qty:.5,unit:"tsp",shopCategory:"Spices",availability:["mainstream"],substitutes:[]},{id:"salt",name:"Salt",qty:.25,unit:"tsp",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"butter",name:"Butter, cold, in small cubes",qty:75,unit:"g",shopCategory:"Other",availability:["mainstream"],substitutes:[{name:"Margarine",note:"Same amount."}]},{id:"egg",name:"Egg, beaten",qty:1,unit:"",scale:"whole",shopCategory:"Other",availability:["mainstream"],substitutes:[{name:"3 tbsp extra milk",note:"For egg-free chin chin."}]},{id:"milk",name:"Milk",qty:.33,unit:"cup",altQty:80,altUnit:"ml",shopCategory:"Other",availability:["mainstream"],note:"Add gradually. You may need a little more or less.",substitutes:[{name:"Evaporated milk or water",note:""}]},{id:"oil",name:"Vegetable oil for deep frying",qty:4,unit:"cup",altQty:1,altUnit:"l",scale:"fixed",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]}],steps:[{id:"cc1",phase:"prep",title:"Mix the dry ingredients",body:"In a large bowl, mix the flour, sugar, baking powder, nutmeg and salt.",about:"1 minute",media:[],ingredientIds:["flour","sugar","bp","nutmeg","salt"]},{id:"cc2",phase:"prep",title:"Rub in the butter",body:"Add the cold butter cubes. Using your fingertips, rub the butter into the flour, lifting and letting it fall back into the bowl, until it looks like fine breadcrumbs with no big lumps of butter.",about:"3\u20135 minutes",media:[me("10-second clip: rubbing butter into flour with fingertips until it looks like breadcrumbs.","rice")],ingredientIds:["butter"],checkpoint:{question:"How does it look?",options:[{id:"lumps",label:"Big butter lumps",verdict:"wait",media:C("Flour with large butter lumps.","rice"),guidance:"Keep rubbing for another minute or two."},{id:"crumbs",label:"Like fine breadcrumbs",verdict:"good",media:C("Flour and butter like fine breadcrumbs.","rice"),guidance:"Perfect."}]}},{id:"cc3",phase:"prep",title:"Make a firm dough",body:"Add the beaten egg, then pour in the milk a little at a time, mixing with your hand, until it comes together. Knead on the counter for 2 minutes until smooth.",cues:{texture:"Firm, smooth and not sticky, like play dough."},about:"3\u20134 minutes",media:[C("Smooth, firm ball of chin chin dough.","rice")],ingredientIds:["egg","milk"],checkpoint:{question:"How does your dough feel?",options:[{id:"sticky",label:"Sticky",verdict:"fix",media:C("Sticky dough clinging to fingers.","rice"),guidance:"Knead in flour, 1 tablespoon at a time."},{id:"firm",label:"Firm and smooth",verdict:"good",media:C("Correct firm dough.","rice"),guidance:"Perfect."},{id:"crumbly",label:"Crumbly, cracking",verdict:"fix",media:C("Crumbly dough.","rice"),guidance:"Add milk, 1 teaspoon at a time."}]}},{id:"cc4",phase:"prep",title:"Rest the dough",body:"Cover the dough with cling film or a bowl and let it rest.",why:"Resting relaxes the dough so it rolls out easily without shrinking back.",about:"10 minutes",timer:{minutes:10,label:"Rest the dough"},media:[],ingredientIds:[]},{id:"cc5",phase:"prep",title:"Roll and cut into small squares",body:"Lightly flour the counter. Roll the dough out to about 5 mm thick, about the thickness of a coin stack of three. Cut it into strips about 1 cm wide, then cut across into small squares. Toss them with a little flour so they don\u2019t stick together.",cues:{see:"Lots of small, even squares, all about the same size."},about:"10 minutes",media:[me("15-second clip: rolling the dough and cutting it into 1 cm squares with a pizza cutter.","rice")],ingredientIds:[],tips:[{kind:"kitchen",text:"Work in halves if your counter is small. Even sizes mean they all finish frying together."}]},{id:"cc6",phase:"cook",title:"Heat the oil",body:"Heat oil about 6\u20138 cm deep on medium. Test with one piece: it should sizzle and float up steadily, not violently (about 170\xB0C).",about:"5\u20138 minutes",media:[],ingredientIds:["oil"],tips:[{kind:"watch",text:"Never leave hot oil alone, and never use water on an oil fire."}]},{id:"cc7",phase:"cook",title:"Fry in batches, stirring",body:"Add a handful of chin chin, enough for one layer. Stir them constantly with the slotted spoon so they colour evenly. Fry until golden brown, then lift them out.",cues:{see:"Even golden brown all over.",hear:"The sizzle gets quieter as they finish."},about:"4\u20136 minutes per batch",timer:{minutes:5,label:"Fry chin chin batch"},media:[me("10-second clip: stirring chin chin in oil as it turns golden.","plantain")],ingredientIds:[],tips:[{kind:"chef",text:"Take them out a shade lighter than you want. They keep darkening for a minute after they leave the oil."}],checkpoint:{question:"What colour are they?",options:[{id:"pale",label:"Pale",verdict:"wait",media:C("Pale, underfried chin chin.","rice"),guidance:"Keep stirring 1\u20132 minutes more."},{id:"golden",label:"Golden brown",verdict:"good",media:C("Perfect golden chin chin.","plantain"),guidance:"Out they come."},{id:"dark",label:"Dark brown",verdict:"fix",media:C("Overfried dark chin chin.","suya"),guidance:"Lower the heat a little for the next batch."}]}},{id:"cc8",phase:"finish",title:"Cool completely, then store",body:"Spread the chin chin on paper towels and let it cool completely. It gets crunchier as it cools. Store in an airtight jar.",about:"20 minutes cooling",timer:{minutes:20,label:"Cool the chin chin"},media:[C("Cooled chin chin in a glass jar with the lid off.","plantain")],ingredientIds:[],tips:[{kind:"kitchen",text:"Keeps 2\u20133 weeks in an airtight container. Perfect for party packs and gifts."}]}]},ha={id:"white-rice-and-stew",slug:"white-rice-and-stew",status:"complete",title:"White Rice & Nigerian Tomato Stew",subtitle:"Deep red, slow-fried tomato and pepper stew with chicken, over fluffy white rice.",categoryId:"rice",region:"Nigeria",story:"This is the everyday meal of almost every Nigerian home, and the stew is a building block for dozens of other dishes. Learn it once and you\u2019ll cook it for life. Like jollof, the secret is frying the pepper base slowly until the oil rises.",prepMinutes:25,cookMinutes:75,difficulty:"Beginner friendly",baseServings:6,servingOptions:[2,4,6,10,15,20],previewSteps:0,allergens:[gt],dietary:["Gluten-free if your stock cubes are","Dairy-free"],hero:C("White rice with deep red Nigerian stew and a piece of fried chicken, on a Mcuire plate. 45\xB0.","jollof","Rice and stew"),gallery:[C("A pot of finished stew with oil glistening on top and chicken pieces.","jollof")],serveWith:["Fried Plantain (Dodo)","Moi Moi","Boiled yam","Beans"],equipment:[{name:"Large heavy pot",note:"For the stew."},{name:"Medium pot with lid",note:"For the rice."},{name:"Blender",note:""},{name:"Frying pan",note:"Optional, for frying the chicken."},{name:"Wooden spoon",note:""}],ingredients:[{id:"chicken",group:"Chicken",name:"Chicken pieces, bone-in",qty:1.2,unit:"kg",shopCategory:"Meat & Fish",availability:["mainstream"],substitutes:[{name:"Beef or goat",note:"Simmer 35\u201345 minutes in step 1 instead of 20."}]},{id:"chicken-onion",group:"Chicken",name:"Onion (for the chicken)",qty:.5,unit:"",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"tomatoes",group:"Stew base",name:"Ripe plum tomatoes",qty:6,unit:"",scale:"whole",altQty:600,altUnit:"g",shopCategory:"Produce",availability:["mainstream"],substitutes:[{name:"2 \xD7 400 g tins plum tomatoes",note:""}]},{id:"rbp",group:"Stew base",name:"Red bell peppers (tatashe)",qty:4,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],note:"These give the stew its deep red colour.",substitutes:[]},{id:"sb",group:"Stew base",name:"Scotch bonnet peppers",qty:2,unit:"",scale:"taste",shopCategory:"Produce",availability:["african-grocery","international","mainstream"],substitutes:[{name:"Habanero",note:""}]},{id:"onion",group:"Stew base",name:"Onions (1 blended, 1 sliced)",qty:2,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"paste",group:"Stew base",name:"Tomato paste",qty:2,unit:"tbsp",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"oil",group:"Stew base",name:"Vegetable oil",qty:.75,unit:"cup",altQty:180,altUnit:"ml",shopCategory:"Pantry",availability:["mainstream"],note:"Nigerian stew is rich. The oil carries the flavour.",substitutes:[]},{id:"curry",group:"Stew base",name:"Nigerian-style curry powder",qty:1,unit:"tsp",shopCategory:"Spices",availability:["african-grocery","online"],substitutes:[{name:"Mild curry powder",note:""}]},{id:"thyme",group:"Stew base",name:"Dried thyme",qty:1,unit:"tsp",shopCategory:"Spices",availability:["mainstream"],substitutes:[]},{id:"bay",group:"Stew base",name:"Bay leaves",qty:2,unit:"leaf",scale:"whole",shopCategory:"Spices",availability:["mainstream"],substitutes:[]},{id:"stock-cubes",group:"Stew base",name:"Stock cubes",qty:3,unit:"cube",scale:"whole",shopCategory:"African Ingredients",availability:["mainstream","african-grocery"],substitutes:[]},{id:"salt",group:"Stew base",name:"Salt",qty:1,unit:"tsp",scale:"taste",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"rice",group:"White rice",name:"Long-grain parboiled rice",qty:3,unit:"cup",altQty:600,altUnit:"g",shopCategory:"Rice & Grains",availability:["mainstream","african-grocery"],substitutes:[{name:"Basmati or jasmine",note:"Use about 1 cup less water and check 5 minutes earlier."}]},{id:"rice-water",group:"White rice",name:"Water for the rice",qty:4.5,unit:"cup",altQty:1.1,altUnit:"l",shopCategory:"Other",availability:["mainstream"],substitutes:[]}],steps:[{id:"st1",phase:"cook",title:"Season and cook the chicken",body:"Put the chicken in a pot with the half onion (sliced), 1 crumbled stock cube, a pinch of salt and \xBD cup of water. Cover and cook on medium, turning once, until cooked through. Lift out the chicken and keep the liquid. It\u2019s your stock.",cues:{see:"Chicken white all the way through, juices clear."},about:"20\u201325 minutes",timer:{minutes:20,label:"Cook the chicken"},media:[C("Cooked chicken in golden stock.","onion")],ingredientIds:["chicken","chicken-onion"],tips:[{kind:"ready",text:"Cut into the thickest piece by the bone. No pink, juices clear."}]},{id:"st2",phase:"prep",title:"Blend the stew base",body:"While the chicken cooks, blend the tomatoes, red peppers, scotch bonnets and one onion until smooth.",about:"2 minutes",media:[C("Smooth red stew base in a blender.","jollof")],ingredientIds:["tomatoes","rbp","sb","onion"]},{id:"st3",phase:"cook",title:"Boil the base down until thick",body:"Pour the blend into a pot and cook uncovered on medium-high, stirring every few minutes, until about half the water has gone and it looks thick.",cues:{texture:"Like a loose porridge. A spoon leaves a trail."},about:"15\u201320 minutes",timer:{minutes:15,label:"Boil down stew base"},media:[C("Stew base reduced by half, thick and darker.","jollof")],ingredientIds:[],tips:[{kind:"watch",text:"It splutters. Tilt the lid over the pot, leaving a gap."}],checkpoint:{question:"Has it thickened?",options:[{id:"thin",label:"Still watery",verdict:"wait",media:C("Thin stew base.","jollof"),guidance:"Keep boiling, 5 more minutes."},{id:"thick",label:"Thick, spoon leaves a trail",verdict:"good",media:C("Thick stew base.","jollof"),guidance:"Perfect. Tip it into a bowl."}]}},{id:"st4",phase:"cook",title:"Fry the chicken (optional)",body:"For extra flavour, fry the cooked chicken in 3 tablespoons of the oil in a frying pan on medium-high until golden on both sides. Skip this if you prefer. The stew is still delicious.",about:"4\u20135 minutes per side",timer:{minutes:5,label:"Fry chicken side"},media:[C("Golden fried chicken pieces in a pan.","suya")],ingredientIds:[]},{id:"st5",phase:"cook",title:"Fry the onion and tomato paste",body:"Heat the rest of the oil in your big pot on medium. Add the sliced onion and cook for 3 minutes. Add the tomato paste and stir almost constantly until it turns from bright red to a deeper brick red.",cues:{smell:"Sweet, not sour.",see:"Deeper brick red."},about:"5\u20136 minutes",timer:{minutes:5,label:"Fry tomato paste"},media:[C("Tomato paste fried to brick red with onions.","jollof")],ingredientIds:["oil","paste"]},{id:"st6",phase:"cook",title:"Fry the stew base until the oil rises",body:"Add the thick stew base, bay leaves, thyme and curry. Fry on medium, stirring every 2\u20133 minutes and scraping the bottom, until it\u2019s deep red and the oil floats on top.",why:"Frying the base slowly is what makes Nigerian stew taste rich and sweet instead of sour.",cues:{see:"Deep red, glossy, with oil floating on top and around the edges."},about:"15\u201320 minutes",timer:{minutes:15,label:"Fry the stew"},media:[C("Stew with oil separated on top, deep red.","jollof")],ingredientIds:["curry","thyme","bay"],tips:[{kind:"mcuire",text:"Start the rice (step 7) now so both finish together."}],checkpoint:{question:"Can you see the oil on top?",options:[{id:"no",label:"No, still wet and bright",verdict:"wait",media:C("Stew without oil separation.","jollof"),guidance:"Keep frying and stirring. This can take 20 minutes."},{id:"yes",label:"Yes, deep red with oil on top",verdict:"good",media:C("Stew with oil floating, deep red.","jollof"),guidance:"Perfect."}]}},{id:"st7",phase:"cook",title:"Cook the white rice",body:"Wash the rice 3\u20134 times until the water is mostly clear. Put it in a pot with the water and a pinch of salt. Bring to the boil, then cover, turn the heat to low and cook until the water is absorbed and the rice is soft.",cues:{texture:"Soft and fluffy, grains separate."},about:"18\u201320 minutes",timer:{minutes:18,label:"Cook the white rice"},media:[C("Fluffy white rice in a pot.","rice")],ingredientIds:["rice","rice-water"],checkpoint:{question:"Taste a few grains",options:[{id:"hard",label:"Still hard",verdict:"wait",media:C("Undercooked rice.","rice"),guidance:"Add \xBC cup of water, cover and cook 5 more minutes."},{id:"soft",label:"Soft and fluffy",verdict:"good",media:C("Perfect white rice.","rice"),guidance:"Turn off the heat and keep it covered."}]}},{id:"st8",phase:"finish",title:"Add stock and chicken, then simmer",body:"Pour about 1 cup of the chicken stock into the stew. Add 2 crumbled stock cubes and stir. Add the chicken, cover and simmer on low so the chicken soaks up the stew. Taste and add salt if needed.",about:"10 minutes",timer:{minutes:10,label:"Simmer stew with chicken"},media:[C("Chicken pieces simmering in red stew.","jollof")],ingredientIds:["stock-cubes","salt"],tips:[{kind:"ready",text:"Thick enough to coat a spoon, deep red, with a little oil on top. It tastes rich and slightly sweet."}]},{id:"st9",phase:"finish",title:"Serve",body:"Remove the bay leaves. Spoon the rice onto plates, ladle stew over it and add a piece of chicken. It\u2019s even better with dodo on the side.",media:[C("Mcuire plating: white rice, red stew, chicken and dodo.","jollof")],ingredientIds:[],tips:[{kind:"kitchen",text:"Stew keeps 4 days in the fridge and 3 months in the freezer. Many families cook a big pot on Sunday for the whole week."}]}]}});var ae,Xe,$s,Ss,xs,Cs,As,ma,ga=N(()=>{ae=(t,e,i=t)=>({kind:"photo",src:null,alt:i,brief:t,tone:e}),Xe=t=>({status:"complete",kind:"meal",categoryId:"meals",region:"Complete meal",previewSteps:0,allergens:[],dietary:[],equipment:[],ingredients:[],servingOptions:[2,4,6,10,15,20],...t,slug:t.id}),$s=Xe({id:"jollof-chicken-plantain",title:"Jollof + Chicken + Plantain",subtitle:"The classic Nigerian party plate, timed so all three are hot at the same moment.",story:"Cooking one dish is a recipe. Cooking three at once is a plan. This lesson is the plan: what to start when, what can wait, and how to use the hands-off moments so nothing goes cold.",prepMinutes:40,cookMinutes:140,difficulty:"Beginner friendly",baseServings:6,components:["party-jollof","peppered-chicken","dodo"],hero:ae("The Mcuire party plate: jollof, glossy peppered chicken, dodo, a little salad. 45\xB0.","jollof","Jollof, peppered chicken and plantain"),steps:[{id:"pp1",phase:"prep",title:"Shop, and season the chicken the night before",body:"Add this meal to your shopping list and everything for all three dishes is added at once. If you can, season the chicken the night before (Peppered Chicken, steps 1\u20132) and keep it in the fridge. It saves 30 minutes and tastes better.",about:"The day before (optional)",media:[],ingredientIds:[],links:["peppered-chicken"],tips:[{kind:"mcuire",text:"Make sure your plantains are yellow with black spots. If they\u2019re green, buy them 4\u20137 days ahead."}]},{id:"pp2",phase:"prep",title:"2 hr 30 before: start the chicken and the jollof base",body:"Not seasoned yet? Season the chicken now and let it rest (Peppered Chicken, step 2). At the same time, blend the jollof pepper base and start boiling it down (Jollof, steps 1\u20133).",about:"2 hr 30 before dinner",timer:{minutes:30,label:"Chicken marinates / base reduces"},media:[],ingredientIds:[],links:["peppered-chicken","party-jollof"]},{id:"pp3",phase:"cook",title:"2 hr before: cook the chicken while frying the jollof base",body:"Put the chicken on to cook in its own juices (Peppered Chicken, step 3). While it cooks, wash the rice and fry the onion, tomato paste and pepper base for the jollof until the oil rises (Jollof, steps 4\u20137).",about:"2 hr before dinner",media:[],ingredientIds:[],links:["peppered-chicken","party-jollof"],tips:[{kind:"mcuire",text:"Use some of the chicken\u2019s cooking liquid as the stock for your jollof. That\u2019s how restaurants do it."}]},{id:"pp4",phase:"cook",title:"1 hr 20 before: rice in, lid on, now fry the chicken",body:"Season the jollof sauce, add the rice, cover with foil and steam on low (Jollof, steps 8\u201310). You now have about 30 hands-off minutes. Use them to dry and fry the chicken (or bake it), and make the pepper sauce (Peppered Chicken, steps 4\u20136).",about:"1 hr 20 before dinner",timer:{minutes:30,label:"Jollof steams: fry chicken now"},media:[],ingredientIds:[],links:["party-jollof","peppered-chicken"],tips:[{kind:"watch",text:"Don\u2019t lift the jollof lid while you\u2019re busy with the chicken. Trust the timer."}]},{id:"pp5",phase:"cook",title:"35 min before: finish the jollof, toss the chicken",body:"Check and turn the jollof, then give it the smoky party finish (Jollof, steps 11\u201312). Turn the pepper sauce to low and toss the fried chicken in it (Peppered Chicken, step 7). Leave it covered on the lowest heat.",about:"35 minutes before dinner",media:[],ingredientIds:[],links:["party-jollof","peppered-chicken"]},{id:"pp6",phase:"cook",title:"15 min before: fry the dodo while the jollof rests",body:"Turn off the jollof and let it rest, covered (Jollof, step 13). Now peel, slice and fry the plantain (Dodo, steps 2\u20135). Dodo is best fresh, so it goes last.",about:"15 minutes before dinner",timer:{minutes:15,label:"Fry dodo, jollof rests"},media:[],ingredientIds:[],links:["dodo","party-jollof"]},{id:"pp7",phase:"finish",title:"Plate it the Mcuire way",body:"Spoon a generous mound of jollof onto one side of the plate. Lean a piece or two of peppered chicken against it, spooning over a little sauce. Fan 4\u20135 slices of dodo on the other side. Add a little coleslaw or sliced tomato and cucumber for freshness.",media:[ae("Step-by-step plating: jollof mound, chicken leaning, dodo fanned, salad.","jollof")],ingredientIds:[],checkpoint:{question:"Is everything hot and ready together?",options:[{id:"yes",label:"All hot at once",verdict:"good",media:ae("Three dishes ready on the counter at once.","jollof"),guidance:"You just cooked a party plate. That\u2019s real confidence in the kitchen."},{id:"cold",label:"Something went cold",verdict:"fix",media:ae("Reheating chicken in a hot oven.","suya"),guidance:"Warm chicken for 8 minutes in a 200\xB0C oven, and jollof covered on low with a splash of water. Next time, start the chicken 15 minutes later."}]}}]}),Ss=Xe({id:"egusi-pounded-yam",title:"Egusi + Pounded Yam",subtitle:"Soup and swallow, the way it\u2019s served at a Mcuire table.",story:"Pounded yam has to be made at the very last minute, while the soup waits happily on low heat. This plan shows you how to get them to the table together, piping hot.",prepMinutes:40,cookMinutes:100,difficulty:"Beginner friendly",baseServings:6,components:["egusi","pounded-yam"],hero:ae("Egusi in a bowl beside a smooth mound of pounded yam on a Mcuire plate. 45\xB0.","egusi","Egusi and pounded yam"),steps:[{id:"ep1",phase:"prep",title:"2 hr before: start the meat",body:"Season and steam the meat, then simmer until tender (Egusi, steps 1\u20133). While it simmers, soak the fish, blend the peppers and mix the egusi paste (Egusi, steps 4\u20136).",about:"2 hr before dinner",timer:{minutes:45,label:"Meat simmers: prep the rest"},media:[],ingredientIds:[],links:["egusi"]},{id:"ep2",phase:"cook",title:"1 hr 10 before: cook the soup",body:"Fry the egusi lumps in palm oil, add the peppers and stock, then the meat and fish, and simmer (Egusi, steps 7\u201311).",about:"1 hr 10 before dinner",media:[],ingredientIds:[],links:["egusi"]},{id:"ep3",phase:"prep",title:"45 min before: peel and boil the yam",body:"While the soup simmers, peel and cut the yam and put it on to boil (Pounded Yam, steps 1\u20132).",about:"45 minutes before dinner",timer:{minutes:25,label:"Yam boils"},media:[],ingredientIds:[],links:["pounded-yam"],tips:[{kind:"kitchen",text:"Set up your food processor now, so it\u2019s ready the moment the yam is soft."}]},{id:"ep4",phase:"cook",title:"15 min before: greens in, soup on low",body:"Stir the greens into the egusi (Egusi, step 12), then turn the soup to the lowest heat and cover it. It will happily wait.",about:"15 minutes before dinner",media:[],ingredientIds:[],links:["egusi"]},{id:"ep5",phase:"cook",title:"10 min before: pound the yam",body:"Drain the yam and pound it while it\u2019s very hot, then shape it into balls (Pounded Yam, steps 3\u20135).",about:"10 minutes before dinner",media:[],ingredientIds:[],links:["pounded-yam"],tips:[{kind:"mcuire",text:"Swallow is always last. Soup can wait; pounded yam can\u2019t."}]},{id:"ep6",phase:"finish",title:"Serve",body:"Ladle egusi into deep bowls with plenty of meat and fish. Put a ball of pounded yam on a plate beside each bowl. Put a bowl of water on the table for washing hands: it\u2019s traditional to eat this with your right hand.",media:[ae("Table set with egusi, pounded yam and a hand-washing bowl.","egusi")],ingredientIds:[]}]}),xs=Xe({id:"rice-stew-protein",title:"Rice + Stew + Protein",subtitle:"Cook once on Sunday, eat well all week. A meal-prep plan with Nigerian stew.",story:"A big pot of stew is the backbone of a Nigerian kitchen. Cook it once and it becomes rice and stew, stew with yam, stew with plantain and beans\u2026 This plan doubles the stew, portions it and gives you a week of quick dinners.",prepMinutes:30,cookMinutes:100,difficulty:"Beginner friendly",baseServings:10,servingOptions:[6,10,15,20],components:["white-rice-and-stew","dodo"],hero:ae("Meal-prep containers of rice and red stew with chicken, a pot of stew behind. Overhead.","jollof","Rice and stew meal prep"),steps:[{id:"rs1",phase:"prep",title:"Choose your batch size",body:"Set the servings above to the number of meals you want for the week (10 is about 5 days for 2 people). Add this meal to your shopping list and the quantities scale automatically.",about:"Before you shop",media:[],ingredientIds:[],links:["white-rice-and-stew"],tips:[{kind:"kitchen",text:"You\u2019ll need your largest pot. If it\u2019s more than half full, split the stew between two pots."}]},{id:"rs2",phase:"cook",title:"Cook the chicken and the stew base together",body:"Cook the chicken in its juices while you blend and boil down the stew base (Rice & Stew, steps 1\u20133).",about:"First 30 minutes",media:[],ingredientIds:[],links:["white-rice-and-stew"]},{id:"rs3",phase:"cook",title:"Fry the stew slowly",body:"Fry the chicken if you like, then fry the paste and the stew base until the oil rises (Rice & Stew, steps 4\u20136). A big batch takes 5\u201310 minutes longer. Wait for the oil.",about:"45 minutes",media:[],ingredientIds:[],links:["white-rice-and-stew"]},{id:"rs4",phase:"cook",title:"Cook the rice and finish the stew",body:"Cook the rice while the stew finishes with the stock and chicken (Rice & Stew, steps 7\u20138).",about:"20 minutes",media:[],ingredientIds:[],links:["white-rice-and-stew"]},{id:"rs5",phase:"finish",title:"Cool quickly and portion",body:"Spread the rice on a tray to cool, and pour the stew into a wide dish so it cools faster. Within 2 hours of cooking, divide into containers: rice, a ladle of stew and one piece of chicken each. Refrigerate what you\u2019ll eat in the next 3 days and freeze the rest.",why:"Cooling quickly and refrigerating within 2 hours keeps cooked rice safe to eat later.",about:"20 minutes",timer:{minutes:20,label:"Cool before portioning"},media:[ae("Portioning rice, stew and chicken into containers.","jollof")],ingredientIds:[],tips:[{kind:"watch",text:"Reheat rice until steaming hot all the way through, and only reheat it once."}]},{id:"rs6",phase:"finish",title:"On the day: add fresh dodo",body:"Reheat a container until steaming hot. Fry a fresh plantain in 10 minutes (Dodo lesson) and you have a full Mcuire plate on a weeknight.",media:[],ingredientIds:[],links:["dodo"],tips:[{kind:"mcuire",text:"Leftover stew also turns into a new meal: serve it with boiled yam, with beans and plantain, or with fried eggs and bread."}]}]}),Cs=Xe({id:"sunday-dinner",title:"West African Sunday Dinner",subtitle:"Fried rice, peppered chicken, moi moi and dodo: a full family table, planned from morning to plate.",story:"Sunday dinner is about the whole table. The trick is that two dishes, moi moi and seasoned chicken, can be done in the morning, so the afternoon is calm and dinner arrives together.",prepMinutes:90,cookMinutes:180,difficulty:"Intermediate",baseServings:8,servingOptions:[6,8,10,15,20],components:["moi-moi","peppered-chicken","nigerian-fried-rice","dodo"],hero:ae("A family table: fried rice, peppered chicken, moi moi turned out, dodo, coleslaw, drinks. Overhead.","plantain","A West African Sunday dinner"),steps:[{id:"sd1",phase:"prep",title:"Morning: soak the beans and season the chicken",body:"Put the beans to soak (Moi Moi, step 1) and season the chicken, then put it in the fridge (Peppered Chicken, steps 1\u20132).",about:"Morning (around 10am for a 5pm dinner)",timer:{minutes:30,label:"Beans soak"},media:[],ingredientIds:[],links:["moi-moi","peppered-chicken"]},{id:"sd2",phase:"cook",title:"Late morning: make and steam the moi moi",body:"Peel and blend the beans, mix the batter, fill the containers and steam them (Moi Moi, steps 2\u20137). Once set, let them cool in the pot. They reheat perfectly later.",about:"Late morning",media:[],ingredientIds:[],links:["moi-moi"],tips:[{kind:"mcuire",text:"Making moi moi first means the hardest dish is done before lunch."}]},{id:"sd3",phase:"prep",title:"3 hr before: cook the curry rice and cool it",body:"Cook the rice in curry stock and spread it out to cool (Fried Rice, steps 1\u20133). Then chop all the vegetables.",about:"3 hr before dinner",media:[],ingredientIds:[],links:["nigerian-fried-rice"],tips:[{kind:"kitchen",text:"Rice cooked early and cooled makes the best fried rice."}]},{id:"sd4",phase:"cook",title:"2 hr before: cook and fry the chicken",body:"Cook the chicken in its juices, dry it, and fry (or bake) it (Peppered Chicken, steps 3\u20135). Make the pepper sauce but don\u2019t toss yet (step 6).",about:"2 hr before dinner",media:[],ingredientIds:[],links:["peppered-chicken"]},{id:"sd5",phase:"cook",title:"45 min before: fry the rice",body:"Cook the prawns and liver, stir-fry the vegetables, then fry the rice in batches (Fried Rice, steps 4\u20137). Cover the dish with foil and keep it in a low oven (90\xB0C).",about:"45 minutes before dinner",media:[],ingredientIds:[],links:["nigerian-fried-rice"]},{id:"sd6",phase:"cook",title:"20 min before: reheat moi moi, toss chicken, fry dodo",body:"Put the moi moi back on to steam for 15 minutes. Toss the chicken in the warm pepper sauce (Peppered Chicken, step 7). Fry the dodo last (Dodo, steps 2\u20135).",about:"20 minutes before dinner",timer:{minutes:15,label:"Moi moi reheats: fry dodo"},media:[],ingredientIds:[],links:["peppered-chicken","dodo","moi-moi"]},{id:"sd7",phase:"finish",title:"Set the table",body:"Serve everything family-style in the middle of the table: fried rice in a big dish, chicken piled high, moi moi turned out onto a plate, dodo in a bowl, and a fresh salad or coleslaw.",media:[ae("Family-style table layout from above.","plantain")],ingredientIds:[]}]}),As=Xe({id:"party-platter",title:"Party Platter for 20",subtitle:"Small chops, jollof, fried rice and grills for a crowd, with a two-day timing plan.",story:"Feeding twenty people is about planning, not panic. Half of this menu can be made the day before. This is the order we\u2019d use in the Mcuire kitchen for a big celebration.",prepMinutes:180,cookMinutes:300,difficulty:"Confident cook",baseServings:20,servingOptions:[10,15,20,30,40],components:["party-jollof","nigerian-fried-rice","peppered-chicken","suya","moi-moi","puff-puff","dodo","chin-chin"],hero:ae("A full party table: trays of jollof and fried rice, chicken, suya, moi moi, puff-puff, dodo, chin chin. Overhead.","jollof","A party platter"),steps:[{id:"pt1",phase:"prep",title:"A week before: plan, shop and make chin chin",body:"Add this meal to your shopping list for 20 people. Check you have big enough pots. You\u2019ll want two pots for the jollof (rice cooks unevenly in one giant pot). Make the chin chin now: it keeps for weeks in a sealed container.",about:"Up to a week before",media:[],ingredientIds:[],links:["chin-chin"],tips:[{kind:"mcuire",text:"Ask one friend to help on the day just with frying. It changes everything."}]},{id:"pt2",phase:"prep",title:"The day before: bases, seasoning and moi moi",body:"Blend and boil down the jollof pepper base (Jollof, steps 2\u20133) and refrigerate it. Season the chicken (Peppered Chicken, steps 1\u20132) and the suya beef (Suya, steps 1\u20134) and refrigerate them. Make and steam the moi moi (Moi Moi lesson). It reheats perfectly.",about:"The day before",media:[],ingredientIds:[],links:["party-jollof","peppered-chicken","suya","moi-moi"]},{id:"pt3",phase:"cook",title:"Party morning: rice dishes",body:"Cook and cool the curry rice for fried rice (Fried Rice, steps 1\u20133). Then cook the jollof in two pots, using your ready-made base (Jollof, steps 4\u201313). Keep the jollof covered. It holds its heat well.",about:"Morning",media:[],ingredientIds:[],links:["nigerian-fried-rice","party-jollof"]},{id:"pt4",phase:"cook",title:"3 hr before: chicken, then puff-puff batter",body:"Cook, fry and sauce the chicken (Peppered Chicken, steps 3\u20137). Mix the puff-puff batter and leave it to rise (Puff-Puff, steps 1\u20134).",about:"3 hr before guests arrive",media:[],ingredientIds:[],links:["peppered-chicken","puff-puff"]},{id:"pt5",phase:"cook",title:"90 min before: fry the rice and puff-puff",body:"Finish the fried rice (Fried Rice, steps 4\u20137) and keep it covered in a low oven. Fry the puff-puff (Puff-Puff, steps 5\u20138).",about:"90 minutes before",media:[],ingredientIds:[],links:["nigerian-fried-rice","puff-puff"]},{id:"pt6",phase:"cook",title:"40 min before: suya, moi moi and dodo",body:"Grill the suya (Suya, steps 5\u20138). Reheat the moi moi by steaming it for 15\u201320 minutes. Fry the dodo last (Dodo lesson).",about:"40 minutes before",timer:{minutes:20,label:"Moi moi reheats: grill suya"},media:[],ingredientIds:[],links:["suya","dodo","moi-moi"]},{id:"pt7",phase:"finish",title:"Lay out the platter",body:"Serve the rice dishes side by side in large trays. Pile chicken and suya together, with onions and yaji. Put the small chops (puff-puff, chin chin, dodo, moi moi) on a separate platter, so guests can graze before the main meal.",media:[ae("Party buffet layout: rice trays, grills, small chops platter.","jollof")],ingredientIds:[],checkpoint:{question:"How did it go?",options:[{id:"great",label:"Everything came together",verdict:"good",media:ae("Happy guests at a full party table.","jollof"),guidance:"You just catered a party. That\u2019s Party Chef territory."},{id:"rushed",label:"Some things were rushed",verdict:"fix",media:ae("Busy kitchen counter mid-party.","suya"),guidance:"Totally normal the first time. Next time, move puff-puff to the morning and keep it warm in a low oven."}]}}]}),ma=[$s,Ss,xs,Cs,As]});var c,K,Z,ft,Re,b,J,V,Ae,Q,Y,ce,bt,ge,oe,Ie,yt,ke,ai,$e,Pe,kt,pe,et=N(()=>{c=(t,e,i=t)=>({kind:"photo",src:null,alt:i,brief:t,tone:e}),K=(t,e,i=t)=>({kind:"video",src:null,poster:null,alt:i,brief:t,tone:e}),Z="Check stock cubes: some contain wheat, soy or celery",ft=["african-grocery","online"],Re=["mainstream"],b=(t,e,i,a,o,n=Re,r={})=>({id:t,name:e,qty:i,unit:a,shopCategory:o,availability:n,substitutes:[],...r}),J=(t=2,e="sb",i={})=>b(e,"Scotch bonnet peppers",t,"","Produce",["african-grocery","international","mainstream"],{scale:"taste",note:"Use fewer, or remove the seeds, for less heat.",substitutes:[{name:"Habanero",note:"Same heat and fruity flavour."}],...
