f-_Rice%29.jpg"},"step-garri":{src:"https://upload.wikimedia.org/wikipedia/commons/5/50/Garri_Displayed_For_Sale_After_Processing.jpg",author:"Airypedia",license:"CC BY-SA 4.0",page:"https://commons.wikimedia.org/wiki/File:Garri_Displayed_For_Sale_After_Processing.jpg"},"step-ogbono-pot":{src:"https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/Ogbono_soup_20th_April.jpg/960px-Ogbono_soup_20th_April.jpg",author:"Sasu photography",license:"CC BY-SA 4.0",page:"https://commons.wikimedia.org/wiki/File:Ogbono_soup_20th_April.jpg"},"step-bitterleaf-pot":{src:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Onugbu_Soup_in_Pot2.jpg/960px-Onugbu_Soup_in_Pot2.jpg",author:"Asuzu Obinna Justin",license:"CC BY-SA 4.0",page:"https://commons.wikimedia.org/wiki/File:Onugbu_Soup_in_Pot2.jpg"},"step-dodo-fry":{src:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Dodo_fried.jpg/960px-Dodo_fried.jpg",author:"Setor33",license:"CC0",page:"https://commons.wikimedia.org/wiki/File:Dodo_fried.jpg"},"step-goat-grill":{src:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Fried_goat_meat.jpg/960px-Fried_goat_meat.jpg",author:"Edithobayaa1",license:"CC BY-SA 4.0",page:"https://commons.wikimedia.org/wiki/File:Fried_goat_meat.jpg"},"step-chicken-grill":{src:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Chicken_Grills_%28Suya%29_in_Northern_Nigeria_%283%29.jpg/960px-Chicken_Grills_%28Suya%29_in_Northern_Nigeria_%283%29.jpg",author:"Zarerh",license:"CC BY-SA 4.0",page:"https://commons.wikimedia.org/wiki/File:Chicken_Grills_%28Suya%29_in_Northern_Nigeria_%283%29.jpg"},"step-amala-wrap":{src:"https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/Amala_and_ewedu.jpg/960px-Amala_and_ewedu.jpg",author:"Stephanie cheks",license:"CC BY-SA 4.0",page:"https://commons.wikimedia.org/wiki/File:Amala_and_ewedu.jpg"}},ut={egusi:{e10:"step-egusi-pot"},afang:{af3:"step-afang-leaves"},banga:{bg3:"step-banga-pound"},akara:{ak7:"step-akara-frying"},"moi-moi":{m4:"step-moimoi-batter",m5:"step-moimoi-foil"},okra:{ok5:"step-okra-stir"},"puff-puff":{p6:"step-puff-shape"},"chin-chin":{cc5:"step-chinchin-cut"},suya:{y3:"step-yaji"},"grilled-fish":{gf4:"step-fish-grill"},"party-jollof":{s13:"step-jollof-pot"},ogbono:{og5:"step-ogbono-pot"},"bitterleaf-soup":{bl5:"step-bitterleaf-pot"},dodo:{d5:"step-dodo-fry"},"goat-meat":{as2:"step-goat-grill"},"grilled-chicken":{gc5:"step-chicken-grill"}},Ki={egusi:{"egusi-seed":"step-egusi-seeds"},afang:{"afang-leaf":"step-afang-leaves"},eba:{garri:"step-garri"}},ks="https://mcuire.ca/wp-content/uploads/",ws={"party-jollof":"2026/01/ChatGPT-Image-Jan-19-2026-09_58_39-AM-683x1024.png",suya:"2026/01/IMG_3339-768x1024.jpeg",egusi:"2026/01/ChatGPT-Image-Jan-10-2026-02_13_59-PM-768x768.png",okra:"2026/01/ChatGPT-Image-Jan-10-2026-02_11_12-PM-1-768x768.png","puff-puff":"2026/01/ChatGPT-Image-Jan-10-2026-02_17_22-PM-768x768.png","egusi-pounded-yam":"2026/01/2025-08-31.jpg",fufu:"2026/01/2025-07-05.jpg","white-rice-and-stew":"2025/12/keesha-s-kitchen-N_544vYDfwM-unsplash-1024x683.jpg","grilled-chicken":"2025/12/femoree-SC7R-d27_9E-unsplash-1024x683.jpg","party-platter":"2025/12/ChatGPT-Image-Jan-3-2026-02_01_30-PM-1024x683.png","sunday-dinner":"2025/12/ChatGPT-Image-Jan-3-2026-04_32_09-PM-1024x683.png",waakye:"2025/12/2022-12-26.webp","grilled-fish":"2025/12/2024-07-13.webp","jollof-chicken-plantain":"2025/12/social-cat-instagram_mcuire__5-768x1024.jpg","rice-stew-protein":"2025/12/social-cat-instagram_mcuire__10-768x1024.jpg","step-suya-grill":"2026/01/ChatGPT-Image-Jan-19-2026-10_18_18-AM-683x1024.png","step-jollof-plate":"2026/01/Jollof-Rice-768x576.jpg"};for(let[t,e]of Object.entries(ws))ye[t]={src:ks+e,author:"Mcuire African Restaurant",license:"",page:"https://mcuire.ca/"};vs={waakye:"waakye.jpg","white-rice-and-stew":"white-rice-and-stew.jpg"},ii=["https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Waakye_with_kelewele%2C_spaghetti%2C_salad%2C_stew_and_shito.jpg/960px-Waakye_with_kelewele%2C_spaghetti%2C_salad%2C_stew_and_shito.jpg","https://upload.wikimedia.org/wikipedia/commons/e/eb/White_rice_and_stew_with_chicken.jpg"];for(let[t,e]of Object.entries(vs))ye[t]&&ii.push(ye[t].src),ye[t]={src:"media:"+e,author:"Mcuire African Restaurant",license:"",page:"https://mcuire.ca/"};ut.suya.y7="step-suya-grill";ut["party-jollof"].s14="step-jollof-plate"});var F,qe,Qi,Ji,Zi,Xi=N(()=>{F=(t,e,i=t)=>({kind:"photo",src:null,alt:i,brief:t,tone:e}),qe=(t,e,i=t)=>({kind:"video",src:null,poster:null,alt:i,brief:t,tone:e}),Qi={id:"egusi",slug:"egusi",status:"complete",title:"Egusi Soup",subtitle:"Golden lumps of fried melon seed in a rich palm-oil soup with tender meat and greens.",categoryId:"soups",region:"Nigeria",story:"Egusi is the soup most people fall in love with first. The secret at Mcuire is frying the egusi paste in palm oil before any liquid goes in. That gives you soft, nutty lumps instead of a grainy soup. We\u2019ll show you exactly what each stage looks like, so you know you\u2019ve got it right.",prepMinutes:30,cookMinutes:75,difficulty:"Beginner friendly",baseServings:6,servingOptions:[2,4,6,10,15,20],previewSteps:0,allergens:["Fish and shellfish (dried fish, crayfish)","Check stock cubes: some contain wheat, soy or celery"],dietary:["Gluten-free if your stock cubes are","Dairy-free"],hero:F("Finished egusi in a clay pot: golden lumps, glossy red oil on top, green leaves through it, meat visible. Overhead.","egusi","A pot of egusi soup"),gallery:[F("Plated: egusi beside a smooth ball of pounded yam on a Mcuire plate. 45\xB0.","egusi"),F("Close-up of the egusi lumps, showing their soft, crumbly texture.","egusi")],serveWith:["Eba","Pounded Yam","Fufu","Semolina"],equipment:[{name:"Large heavy pot with a lid",note:"At least 5 litres for 6 servings."},{name:"Medium bowl",note:"For mixing the egusi paste."},{name:"Blender",note:"For the pepper mix. A food processor also works."},{name:"Wooden spoon or flat spatula",note:""},{name:"Colander",note:"For washing the greens."},{name:"Knife and chopping board",note:""}],ingredients:[{id:"meat",group:"Meat & fish",name:"Beef or goat meat, in chunks",qty:1,unit:"kg",shopCategory:"Meat & Fish",availability:["mainstream","african-grocery"],note:"Ask the butcher for stewing beef or bone-in goat cut into 3\u20134 cm pieces.",substitutes:[{name:"Bone-in chicken thighs",note:"Cooks in about half the time."}]},{id:"assorted",group:"Meat & fish",name:"Assorted meat (shaki / tripe, cow skin)",qty:300,unit:"g",optional:!0,shopCategory:"Frozen",availability:["african-grocery"],note:"Often sold frozen and already cleaned.",substitutes:[{name:"More beef",note:"Simply add 300 g more meat."}]},{id:"dried-fish",group:"Meat & fish",name:"Dried or smoked fish",qty:150,unit:"g",scale:"linear",shopCategory:"African Ingredients",availability:["african-grocery","online"],note:"Gives egusi its deep, smoky flavour.",substitutes:[{name:"Smoked mackerel fillets",note:"In most supermarket fish fridges. Flake it in at step 11."},{name:"Leave it out",note:"Add an extra tablespoon of crayfish."}]},{id:"egusi-seed",group:"Egusi",name:"Ground egusi (melon seed)",qty:2,unit:"cup",altQty:250,altUnit:"g",shopCategory:"African Ingredients",availability:["african-grocery","online"],note:"Buy it already ground. If it\u2019s whole, blend it dry until fine like flour.",substitutes:[{name:"Ground pumpkin seeds (pepitas)",note:"The closest match. Blend raw, unsalted seeds until fine."}]},{id:"palm-oil",group:"For the pot",name:"Red palm oil",qty:.5,unit:"cup",altQty:120,altUnit:"ml",shopCategory:"African Ingredients",availability:["african-grocery","online","international"],note:"Gives the colour and the true taste. It may be solid in a cold kitchen. That\u2019s normal.",substitutes:[{name:"Vegetable oil + 1 tsp sweet paprika",note:"Right colour, different flavour. Use it only if you can\u2019t get palm oil."}]},{id:"onion",group:"For the pot",name:"Onions",qty:2,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],note:"One for the meat and pepper mix, one chopped for frying.",substitutes:[]},{id:"scotch-bonnet",group:"For the pot",name:"Scotch bonnet peppers",qty:2,unit:"",scale:"taste",shopCategory:"Produce",availability:["african-grocery","international","mainstream"],note:"One for mild, two for proper Nigerian heat.",substitutes:[{name:"Habanero",note:"Same heat and flavour."}]},{id:"red-pepper",group:"For the pot",name:"Red bell pepper",qty:1,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"crayfish",group:"For the pot",name:"Ground crayfish",qty:2,unit:"tbsp",shopCategory:"African Ingredients",availability:["african-grocery","online"],note:"Small dried shrimp, ground. It\u2019s the savoury backbone of Nigerian soups.",substitutes:[{name:"Dried shrimp powder",note:"Asian grocery stores sell this. Use the same amount."},{name:"1 tsp fish sauce",note:"Last resort. Add it with the stock cubes."}]},{id:"iru",group:"For the pot",name:"Iru (fermented locust beans)",qty:1,unit:"tbsp",optional:!0,shopCategory:"African Ingredients",availability:["african-grocery","online"],note:"Strong smell, deep flavour. Loved by many, optional for all.",substitutes:[{name:"1 tsp white miso",note:"Similar fermented depth."}]},{id:"stock-cubes",group:"For the pot",name:"Stock cubes",qty:3,unit:"cube",scale:"whole",shopCategory:"African Ingredients",availability:["mainstream","african-grocery"],substitutes:[{name:"Bouillon powder",note:"1 tsp per cube."}]},{id:"salt",group:"For the pot",name:"Salt",qty:1,unit:"tsp",scale:"taste",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"greens",group:"Greens",name:"Spinach or ugu leaves, washed and chopped",qty:300,unit:"g",shopCategory:"Produce",availability:["mainstream","african-grocery"],note:"Ugu (fluted pumpkin leaf) is traditional; spinach is easy to find and works beautifully.",substitutes:[{name:"Frozen chopped spinach",note:"Thaw and squeeze out the water first."},{name:"Kale",note:"Strip off the stalks and cook 3 minutes longer."}]}],steps:[{id:"e1",phase:"prep",title:"Set out everything you need",body:"Wash your hands. Put the meat in a bowl and rinse it under cold water, then drain. Peel the onions. Chop one onion finely and cut the other into quarters. Wash the greens in a colander, shake them dry and chop them roughly.",about:"About 10 minutes",media:[F("All egusi ingredients on the Mcuire counter: ground egusi, palm oil, crayfish, meat, fish, peppers, greens.","egusi")],ingredientIds:["meat","onion","greens"],tips:[{kind:"mcuire",text:"Wash the greens in two changes of water. Spinach and ugu often hide grit, and nobody wants crunchy soup."}]},{id:"e2",phase:"cook",title:"Season the meat and let it steam",body:"Put the meat (and assorted meat, if using) in your big pot. Add two of the onion quarters, 1 crumbled stock cube, half the salt and \xBD cup of water. Stir, cover with the lid and cook on medium heat. The meat will release its own juices and soak up the seasoning.",why:"Steaming meat in its own juices first gives it far more flavour than boiling it in lots of water.",cues:{smell:"After a few minutes, a rich savoury smell.",see:"The meat turns from red to grey-brown and juices collect at the bottom."},about:"10 minutes",timer:{minutes:10,label:"Steam the meat"},media:[F("Seasoned raw beef chunks in the pot with onion quarters, before the lid goes on.","suya")],ingredientIds:["meat","assorted","stock-cubes","salt"],tips:[{kind:"watch",text:"If the pot starts to sizzle and stick, add a few tablespoons of water. It should steam, not fry."}]},{id:"e3",phase:"cook",title:"Simmer the meat until tender",body:"Add 3 cups of water, cover again and let it bubble gently on medium-low heat until the meat is tender. Meanwhile, do the next few steps.",cues:{texture:"A fork slides into a piece of meat easily. Goat may take longer than beef."},about:"35\u201345 minutes (beef), 50\u201360 (goat), 20 (chicken)",timer:{minutes:35,label:"Simmer the meat"},media:[],ingredientIds:[],tips:[{kind:"mcuire",text:"Don\u2019t throw this liquid away. It\u2019s your stock, and it\u2019s full of flavour. You\u2019ll pour it into the soup later."},{kind:"kitchen",text:"Check now and then. If the water drops below the meat, add another cup."}],checkpoint:{question:"Is your meat tender yet?",options:[{id:"tough",label:"The fork pushes back",verdict:"wait",media:F("Fork pressing into firm beef that resists.","suya"),guidance:"Keep simmering and check every 10 minutes. Add water if the pot is getting low."},{id:"tender",label:"The fork slides in",verdict:"good",media:F("Fork sliding easily into a tender beef chunk.","suya"),guidance:"Perfect. Turn off the heat. Keep the meat in its stock for now."}]}},{id:"e4",phase:"prep",title:"Prepare the dried fish",body:"While the meat cooks, put the dried fish in a bowl and cover it with hot water from the kettle. Leave it for 10 minutes to soften. Then lift it out, pull off any hard bones and skin with your fingers, and break the fish into bite-size pieces.",about:"10 minutes soaking",timer:{minutes:10,label:"Soak dried fish"},media:[F("Softened dried fish being broken into pieces by hand, bones set aside.","suya")],ingredientIds:["dried-fish"],tips:[{kind:"kitchen",text:"Soaking also washes off any sand or dust, so drain away that water."}]},{id:"e5",phase:"prep",title:"Blend the peppers",body:"Put the scotch bonnets, red bell pepper and the remaining two onion quarters into the blender with 3 tablespoons of water. Blend for just a few seconds. You want it a little coarse, not a smooth juice.",cues:{see:"A rough, orange-red mix with tiny visible bits."},about:"1 minute",media:[F("Blender jug with a coarse pepper and onion blend.","jollof")],ingredientIds:["scotch-bonnet","red-pepper"],tips:[{kind:"watch",text:"Wash your hands with soap after touching scotch bonnet, and keep them away from your eyes."}]},{id:"e6",phase:"prep",title:"Mix the egusi into a thick paste",body:"Put the ground egusi in a bowl. Add \xBD cup of water a little at a time, stirring with a spoon, until it becomes one thick paste that holds together.",why:"A thick paste is what turns into soft lumps when it fries. Too much water and it melts into the soup instead.",cues:{texture:"Like thick peanut butter. It holds its shape on the spoon."},about:"2 minutes",media:[qe("8-second clip: stirring water into ground egusi until it forms a thick paste that holds on the spoon.","egusi")],ingredientIds:["egusi-seed"],checkpoint:{question:"How does your paste look?",options:[{id:"dry",label:"Dry and crumbly",verdict:"fix",media:F("Egusi with too little water: dry crumbs.","egusi"),guidance:"Add water 1 tablespoon at a time and stir until it comes together."},{id:"paste",label:"Thick paste, holds its shape",verdict:"good",media:F("Correct egusi paste: thick, holding shape on a spoon.","egusi"),guidance:"Exactly right."},{id:"runny",label:"Runny like a sauce",verdict:"fix",media:F("Egusi with too much water: loose and runny.","egusi"),guidance:"Too much water. Stir in 2\u20133 more tablespoons of ground egusi if you have it. If not, it will still work, but you\u2019ll get smaller lumps."}]}},{id:"e7",phase:"cook",title:"Warm the palm oil and soften the onion",body:"Lift the meat out of its stock into a bowl and pour the stock into a jug. Wipe the pot dry. Put it back on medium heat and add the palm oil. When the oil has melted and looks clear and bright red, add the chopped onion and the iru (if using). Stir for 2 minutes.",cues:{see:"Clear, bright red-orange oil. Onions turning soft.",smell:"Warm, earthy palm oil and onion."},about:"3\u20134 minutes",media:[F("Melted palm oil in the pot with chopped onion, bright red-orange.","jollof")],ingredientIds:["palm-oil","iru"],tips:[{kind:"watch",text:"Palm oil should never smoke. If you see smoke, take the pot off the heat for a minute and turn the heat down."}]},{id:"e8",phase:"cook",title:"Fry the egusi into lumps",body:"Drop the egusi paste into the oil in spoonfuls, spread around the pot. Now leave it alone for 3\u20134 minutes. Don\u2019t stir. Then gently turn the pieces over with your spatula. Keep frying on medium-low, turning every couple of minutes, until the lumps look drier and golden and the oil is red and clear around them.",why:"This is the Mcuire secret. Frying the paste first gives soft, nutty lumps instead of a grainy soup.",cues:{smell:"Nutty and toasty, like roasted seeds.",see:"The lumps go from pale cream to golden yellow and look drier and slightly crumbly."},about:"8\u201310 minutes",timer:{minutes:8,label:"Fry the egusi"},media:[qe("15-second clip: dropping spoonfuls of paste into palm oil, waiting, then gently turning the golden lumps.","egusi")],ingredientIds:[],tips:[{kind:"mcuire",text:"Patience here makes the soup. If you stir too early, the paste breaks into crumbs. Let it set first, then turn."}],checkpoint:{question:"Do your lumps look like this?",options:[{id:"wet",label:"Still pale and wet",verdict:"wait",media:F("Egusi just added: pale, wet paste in oil.","egusi"),guidance:"Keep frying and turning gently. Give it another 3\u20134 minutes."},{id:"golden",label:"Golden, drier, nutty smell",verdict:"good",media:F("Correctly fried egusi: golden lumps, oil clear around them.","egusi"),guidance:"That\u2019s it. Move on."},{id:"dark",label:"Brown edges, smells burnt",verdict:"fix",media:F("Overfried egusi with dark brown edges.","egusi"),guidance:"Go straight to the next step to stop the frying. A few brown bits are fine, but if it smells bitter, lower your heat next time."}]}},{id:"e9",phase:"cook",title:"Add the peppers and the stock",body:"Pour in the blended peppers and stir gently, trying not to break the lumps. Then pour in about 2 cups of the meat stock from your jug. Add the crayfish and 1 crumbled stock cube. Stir gently from the bottom and bring it to a gentle bubble.",cues:{see:"A red-orange soup with golden lumps floating in it.",smell:"Peppery and savoury."},about:"3 minutes",media:[F("Pepper mix and stock poured over fried egusi lumps.","jollof")],ingredientIds:["crayfish","stock-cubes"],tips:[{kind:"kitchen",text:"Stir by sliding the spoon along the bottom and lifting. That way the lumps stay whole."}]},{id:"e10",phase:"cook",title:"Add the meat and fish, then simmer",body:"Add the cooked meat and the fish pieces. Cover the pot, turn the heat to low and let it simmer. Every 4\u20135 minutes, lift the lid and gently stir from the bottom so nothing sticks.",cues:{see:"A thin layer of red oil rises to the top. The soup thickens.",texture:"Thick enough to coat the back of a spoon."},about:"15 minutes",timer:{minutes:15,label:"Simmer the soup"},media:[F("Egusi simmering with meat and fish, red oil rising on the surface.","egusi")],ingredientIds:[],checkpoint:{question:"How thick is your soup?",options:[{id:"watery",label:"Thin and watery",verdict:"wait",media:F("Watery egusi: thin liquid, lumps floating apart.","egusi"),guidance:"Take the lid off and simmer 5\u201310 more minutes so some water cooks away."},{id:"right",label:"Thick, coats the spoon, oil on top",verdict:"good",media:F("Correct egusi: thick, coating the spoon, red oil on top.","egusi"),guidance:"Perfect consistency. Next, taste and season."},{id:"thick",label:"Very thick, sticking",verdict:"fix",media:F("Overly thick egusi catching on the pot.","egusi"),guidance:"Stir in \xBD cup of the remaining stock (or water) and lower the heat."}]}},{id:"e11",phase:"cook",title:"Taste and season",body:"Taste a spoonful (let it cool first). Add salt a pinch at a time, or the last stock cube, until it tastes rich and savoury. If it needs more heat, add a little extra pepper now.",about:"2 minutes",media:[],ingredientIds:["salt"],tips:[{kind:"ready",text:"It tastes deep and savoury, a little smoky from the fish, and the pepper warms the back of your throat without hurting."}],troubleshooting:[{problem:"Too salty",fix:"Add \xBD cup of water or unsalted stock and simmer 3 minutes."},{problem:"Tastes flat",fix:"Add another teaspoon of crayfish and a pinch of salt."},{problem:"Too spicy",fix:"Add a little more stock and a tablespoon of palm oil. Serve with plenty of swallow."}]},{id:"e12",phase:"finish",title:"Stir in the greens",body:"Add the chopped greens and stir them gently through the soup. Leave the lid off. Cook just until the leaves wilt: about 2 minutes for spinach, 4\u20135 for ugu or kale. Then turn off the heat.",cues:{see:"Leaves soft and wilted but still bright green."},about:"2\u20135 minutes",timer:{minutes:2,label:"Wilt the greens"},media:[F("Spinach just wilted into egusi, still bright green.","leaf")],ingredientIds:["greens"],tips:[{kind:"watch",text:"Don\u2019t overcook the leaves. They turn dark and lose their freshness. Bright green is what you want."}]},{id:"e13",phase:"finish",title:"Rest it and serve with swallow",body:"Leave the soup to rest for 5 minutes. Serve it in bowls next to your swallow (eba, pounded yam, fufu or semolina). To eat, pinch off a small piece of swallow, roll it into a ball with your fingers, make a small dent with your thumb, and use it to scoop up the soup.",about:"5 minutes",timer:{minutes:5,label:"Rest the soup"},media:[F("Mcuire plating: egusi in a bowl beside a smooth ball of eba, hand pinching a piece.","egusi")],ingredientIds:[],tips:[{kind:"kitchen",text:"Egusi tastes even better the next day. It keeps 3 days in the fridge or 2 months in the freezer."}],checkpoint:{question:"Does yours look like this?",options:[{id:"perfect",label:"Golden lumps, green leaves, oil on top",verdict:"good",media:F("Perfect egusi close-up.","egusi"),guidance:"Beautiful. That\u2019s Mcuire egusi."},{id:"grainy",label:"Grainy, no lumps",verdict:"fix",media:F("Grainy egusi for comparison.","egusi"),guidance:"Still tasty! Next time, make the paste thicker in step 6 and wait longer before turning in step 8."}]}}]},Ji={id:"eba",slug:"eba",status:"complete",title:"Eba",subtitle:"The quickest swallow there is: smooth, soft garri you can shape and dip in any soup.",categoryId:"soups",region:"Nigeria",story:"Eba is made from garri, which is toasted cassava. It takes five minutes and only two ingredients, but getting it smooth with no lumps is a skill. We\u2019ll show you the feel you\u2019re looking for.",prepMinutes:2,cookMinutes:5,difficulty:"Beginner friendly",baseServings:4,servingOptions:[1,2,4,6,10],previewSteps:0,allergens:[],dietary:["Gluten-free","Vegan"],hero:F("Two smooth, shaped balls of yellow eba on a plate next to a bowl of soup. 45\xB0.","plantain","Smooth balls of eba"),gallery:[F("Yellow garri and white garri side by side in small bowls.","rice")],serveWith:["Egusi Soup","Okra Soup","Ogbono Soup","Efo Riro"],equipment:[{name:"Kettle or pot",note:"For boiling water."},{name:"Heatproof bowl",note:"Medium-sized and sturdy."},{name:"Wooden spoon or turning stick",note:"A strong, flat wooden spoon is best."},{name:"Cling film",note:"Optional, for wrapping and keeping it warm."}],ingredients:[{id:"garri",name:"Garri (yellow or white)",qty:2,unit:"cup",altQty:300,altUnit:"g",shopCategory:"African Ingredients",availability:["african-grocery","online"],note:"Yellow garri has palm oil in it and tastes slightly richer. White is milder. Fine garri gives the smoothest eba.",substitutes:[{name:"Fine semolina",note:"Makes a different swallow (semolina). Cook it in a pot. See the Semolina lesson."}]},{id:"water",name:"Boiling water",qty:2.5,unit:"cup",altQty:600,altUnit:"ml",shopCategory:"Other",availability:["mainstream"],note:"It must be boiling, not just hot.",substitutes:[]}],steps:[{id:"b1",phase:"prep",title:"Boil the water",body:"Boil the water in a kettle or pot until it\u2019s at a full, rolling boil with big bubbles.",why:"Boiling water cooks the garri properly. Warm water gives you raw-tasting, sandy eba.",cues:{hear:"The kettle clicks off, or the pot bubbles hard."},about:"3 minutes",media:[],ingredientIds:["water"],tips:[{kind:"watch",text:"Boiling water burns. Keep the bowl on a stable, flat surface and keep children away."}]},{id:"b2",phase:"cook",title:"Pour water in first, then sprinkle the garri",body:"Pour about two-thirds of the boiling water into the bowl (keep the rest nearby). Now sprinkle the garri evenly over the top of the water, a handful at a time, until the garri covers the water and you can\u2019t see any water through it. Don\u2019t stir yet.",cues:{see:"A layer of garri sitting on top of the water, slowly getting darker as it soaks."},about:"1 minute",media:[qe("10-second clip: sprinkling garri evenly over hot water until it covers the surface.","plantain")],ingredientIds:["garri"],tips:[{kind:"mcuire",text:"Water first, garri on top. This is how we avoid lumps: every grain gets wet at the same time."}]},{id:"b3",phase:"cook",title:"Let it soak",body:"Leave the bowl alone so the garri can soak up the water and swell.",cues:{see:"The garri swells and the water disappears."},about:"1\u20132 minutes",timer:{minutes:1.5,label:"Let garri soak"},media:[],ingredientIds:[]},{id:"b4",phase:"cook",title:"Turn the eba until smooth",body:"Hold the bowl steady with one hand (use a cloth, as it\u2019s hot). With the wooden spoon, press the garri firmly against the side of the bowl, then fold it over onto itself. Press, fold, turn the bowl a little, and repeat. Keep going until it comes together in one smooth piece.",cues:{texture:"Smooth, soft and slightly stretchy, like playdough. It holds its shape when you stop."},about:"1\u20132 minutes",media:[qe("20-second clip: pressing and folding eba against the bowl with a wooden spoon until smooth.","plantain")],ingredientIds:[],tips:[{kind:"chef",text:"Use your strength. Turning eba is pressing and folding, not stirring in circles."}],checkpoint:{question:"How does your eba feel?",options:[{id:"soft",label:"Too soft and sticky",verdict:"fix",media:F("Eba too soft: sticky, not holding shape.","plantain"),guidance:"Sprinkle in 1\u20132 more tablespoons of garri and keep turning."},{id:"smooth",label:"Smooth, holds its shape",verdict:"good",media:F("Correct eba: smooth, soft, holding shape.","plantain"),guidance:"Perfect. Shape and serve."},{id:"hard",label:"Too stiff and hard",verdict:"fix",media:F("Eba too stiff, cracking.","plantain"),guidance:"Add 2 tablespoons of the reserved boiling water and keep turning."},{id:"lumpy",label:"Lumpy",verdict:"wait",media:F("Lumpy eba with visible dry pockets.","plantain"),guidance:"Keep pressing the lumps against the side of the bowl. They\u2019ll smooth out."}]}},{id:"b5",phase:"finish",title:"Shape and serve",body:"Wet your hands or a small bowl with cold water. Scoop out portions and shape them into smooth balls. Serve straight away with soup, or wrap each ball in cling film to keep it warm and soft.",about:"1 minute",media:[F("Hands shaping eba into a smooth ball; wrapped portions beside.","plantain")],ingredientIds:[],tips:[{kind:"kitchen",text:"To eat: pinch a small piece, roll it into a ball, press a dent with your thumb, and scoop up the soup."}]}]},Zi={id:"peppered-chicken",slug:"peppered-chicken",status:"complete",title:"Peppered Chicken",subtitle:"Seasoned, cooked tender, fried crisp, then tossed in a glossy pepper sauce.",categoryId:"grills",region:"Nigeria",story:"This is the chicken that sits next to jollof at every party. The flavour goes all the way through because the chicken is seasoned and cooked in its own juices before it\u2019s fried. Then it gets coated in a sweet-hot pepper sauce.",prepMinutes:40,cookMinutes:55,difficulty:"Beginner friendly",baseServings:6,servingOptions:[2,4,6,10,15,20],previewSteps:0,allergens:["Check stock cubes: some contain wheat, soy or celery"],dietary:["Gluten-free if your stock cubes are","Dairy-free"],hero:F("Glossy peppered chicken pieces piled in a bowl, red pepper sauce clinging, sliced onions on top. 45\xB0.","suya","A bowl of peppered chicken"),gallery:[F("Peppered chicken next to party jollof and dodo on a Mcuire plate.","jollof")],serveWith:["Nigerian Party Jollof Rice","Fried Plantain (Dodo)","Fried Rice"],equipment:[{name:"Large pot with lid",note:"For cooking the chicken."},{name:"Deep frying pan or wok",note:"Heavy-based is safest. Or use the oven instead (step 5)."},{name:"Blender or grater",note:"For onion, garlic, ginger and peppers."},{name:"Tongs or slotted spoon",note:"For turning and lifting from hot oil."},{name:"Plate with paper towels",note:"For draining."},{name:"Kitchen thermometer",note:"Optional, but takes the guesswork out of frying."}],ingredients:[{id:"chicken",group:"Chicken",name:"Chicken drumsticks and thighs, skin on",qty:1.5,unit:"kg",shopCategory:"Meat & Fish",availability:["mainstream"],note:"Bone-in pieces stay juicy.",substitutes:[{name:"Whole chicken cut into 10 pieces",note:"Ask the butcher to do it."}]},{id:"onion",group:"Seasoning",name:"Onion",qty:1,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"garlic",group:"Seasoning",name:"Garlic",qty:4,unit:"clove",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[{name:"1 tsp garlic powder",note:""}]},{id:"ginger",group:"Seasoning",name:"Fresh ginger",qty:30,unit:"g",note:"About a thumb-sized piece.",shopCategory:"Produce",availability:["mainstream"],substitutes:[{name:"1 tsp ground ginger",note:""}]},{id:"thyme",group:"Seasoning",name:"Dried thyme",qty:1,unit:"tsp",shopCategory:"Spices",availability:["mainstream"],substitutes:[]},{id:"curry",group:"Seasoning",name:"Nigerian-style curry powder",qty:1,unit:"tsp",shopCategory:"Spices",availability:["african-grocery","online"],substitutes:[{name:"Mild curry powder + pinch of turmeric",note:""}]},{id:"stock-cubes",group:"Seasoning",name:"Stock cubes",qty:3,unit:"cube",scale:"whole",shopCategory:"African Ingredients",availability:["mainstream","african-grocery"],substitutes:[{name:"Bouillon powder",note:"1 tsp per cube."}]},{id:"salt",group:"Seasoning",name:"Salt",qty:1,unit:"tsp",scale:"taste",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"fry-oil",group:"For frying",name:"Vegetable oil for frying",qty:3,unit:"cup",altQty:750,altUnit:"ml",scale:"fixed",shopCategory:"Pantry",availability:["mainstream"],note:"Enough for 2\u20133 cm in your pan. Strain and reuse it once.",substitutes:[{name:"Bake instead",note:"See step 5. No frying oil needed."}]},{id:"sb",group:"Pepper sauce",name:"Scotch bonnet peppers",qty:2,unit:"",scale:"taste",shopCategory:"Produce",availability:["african-grocery","international","mainstream"],substitutes:[{name:"Habanero",note:""}]},{id:"rbp",group:"Pepper sauce",name:"Red bell peppers",qty:2,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"sauce-onion",group:"Pepper sauce",name:"Onion, half blended, half sliced in rings",qty:1,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"sauce-oil",group:"Pepper sauce",name:"Vegetable oil",qty:3,unit:"tbsp",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]}],steps:[{id:"c1",phase:"prep",title:"Prepare the chicken",body:"Take the chicken out of the packet and pat it dry with paper towels. Trim off any large flaps of loose fat with a knife or kitchen scissors. Wash your hands, the board and the knife with hot soapy water afterwards.",why:"We don\u2019t rinse raw chicken under the tap. The water splashes germs around your sink. Cooking makes it safe.",about:"5 minutes",media:[F("Chicken drumsticks and thighs patted dry on a board, excess fat trimmed.","onion")],ingredientIds:["chicken"]},{id:"c2",phase:"prep",title:"Season the chicken and let it rest",body:"Blend or finely grate the onion, garlic and ginger. Put the chicken in a large bowl. Add the blended onion mix, thyme, curry powder, 2 crumbled stock cubes and the salt. Rub it all over every piece with your hands. Cover and leave it for 30 minutes, or overnight in the fridge for even more flavour.",cues:{smell:"Fragrant: ginger, garlic and curry."},about:"30 minutes (or overnight)",timer:{minutes:30,label:"Marinate the chicken"},media:[F("Chicken pieces coated in seasoning paste in a bowl.","plantain")],ingredientIds:["onion","garlic","ginger","thyme","curry","stock-cubes","salt"],tips:[{kind:"mcuire",text:"At Mcuire we season the night before. If you can plan ahead, do it. The flavour goes right to the bone."}]},{id:"c3",phase:"cook",title:"Cook the chicken in its own juices",body:"Put the chicken and all the seasoning into the pot. Add \xBD cup of water. Cover and cook on medium heat, turning the pieces once halfway, until the chicken is cooked all the way through.",cues:{see:"Chicken turns white all over and the juices around it are clear, not pink.",texture:"Meat starts to pull away from the bone at the ends of the drumsticks."},about:"20\u201325 minutes",timer:{minutes:20,label:"Cook the chicken"},media:[F("Cooked chicken in the pot with clear, golden juices.","onion")],ingredientIds:[],tips:[{kind:"ready",text:"Cut into the thickest piece next to the bone. No pink, and the juices are clear. With a thermometer, it reads 74\xB0C (165\xB0F)."},{kind:"mcuire",text:"Save the liquid in the pot. It\u2019s a delicious stock for the pepper sauce, or for jollof."}]},{id:"c4",phase:"prep",title:"Dry the chicken",body:"Lift the chicken out onto a tray. Pat each piece dry with paper towels and leave it to cool for 5 minutes. Pour the cooking liquid into a cup and keep it.",why:"Wet chicken makes hot oil spit. Dry chicken fries crispier and more safely.",about:"5 minutes",timer:{minutes:5,label:"Cool the chicken"},media:[],ingredientIds:[]},{id:"c5",phase:"cook",title:"Fry until golden (or bake)",body:`Pour oil into the deep pan to about 2\u20133 cm deep and heat it on medium-high. Test it by dipping the handle of a wooden spoon in. When steady bubbles rise around it, the oil is ready (about 175\xB0C). Gently lay in a few pieces, away from you, without crowding. Fry 4\u20136 minutes per side until deep golden and crisp. Lift onto paper towels. Repeat with the rest.

No frying? Bake on a lined tray at 220\xB0C (425\xB0F) for 20\u201325 minutes, turning once, until golden.`,cues:{hear:"A lively, steady sizzle.",see:"Deep golden-brown, crisp skin."},about:"10\u201312 minutes per batch",timer:{minutes:5,label:"Fry one side"},media:[qe("15-second clip: laying chicken into hot oil away from the body, then turning golden pieces with tongs.","suya")],ingredientIds:["fry-oil"],tips:[{kind:"watch",text:"Never leave hot oil alone, and never put water on an oil fire. If it flames, cover it with a lid and turn off the heat."},{kind:"kitchen",text:"Fry in batches. Too many pieces at once cools the oil and makes them greasy instead of crisp."}],checkpoint:{question:"What colour is your chicken?",options:[{id:"pale",label:"Pale gold",verdict:"wait",media:F("Chicken fried only briefly: pale and soft skin.","onion"),guidance:"Give it another 1\u20132 minutes per side."},{id:"golden",label:"Deep golden-brown, crisp",verdict:"good",media:F("Correctly fried chicken: deep golden, crisp.","suya"),guidance:"Perfect. Out onto the paper towels."},{id:"dark",label:"Very dark in under 3 minutes",verdict:"fix",media:F("Chicken browned too fast, very dark.","suya"),guidance:"Your oil is too hot. Turn the heat down a little before the next batch."}]}},{id:"c6",phase:"cook",title:"Make the pepper sauce",body:"Blend the scotch bonnets, red peppers and half the onion until roughly smooth. In a clean pan, heat 3 tablespoons of oil on medium. Add the onion rings and cook for 2 minutes. Pour in the pepper blend and fry, stirring often, until the water cooks off and it turns thick and glossy. Add the last stock cube and 3 tablespoons of the chicken liquid.",cues:{see:"Thick, shiny red sauce with oil showing at the edges.",smell:"Sweet, roasted pepper, no longer raw."},about:"10\u201312 minutes",timer:{minutes:10,label:"Fry pepper sauce"},media:[F("Thick glossy pepper sauce in a pan with onion rings.","jollof")],ingredientIds:["sb","rbp","sauce-onion","sauce-oil"],checkpoint:{question:"How does your sauce look?",options:[{id:"watery",label:"Still watery",verdict:"wait",media:F("Watery pepper sauce, pale and loose.","jollof"),guidance:"Keep frying and stirring for 3\u20135 more minutes."},{id:"glossy",label:"Thick and glossy",verdict:"good",media:F("Correct pepper sauce: thick and glossy.","jollof"),guidance:"Perfect. Add the chicken."}]}},{id:"c7",phase:"finish",title:"Toss the chicken in the sauce",body:"Turn the heat to low. Add the fried chicken to the sauce and turn the pieces gently with tongs until every piece is coated. Let it warm through for 2 minutes.",about:"2\u20133 minutes",media:[qe("8-second clip: tossing golden chicken in the glossy pepper sauce.","suya")],ingredientIds:[]},{id:"c8",phase:"finish",title:"Serve",body:"Pile the chicken onto a plate and spoon over any sauce left in the pan. Serve hot with jollof rice and fried plantain for the classic party plate.",media:[F("Mcuire party plate: peppered chicken, jollof, dodo.","jollof")],ingredientIds:[],tips:[{kind:"kitchen",text:"Leftovers keep 3 days in the fridge. Reheat in a hot oven for 10 minutes so the skin stays crisp."}]}]}});var H,mt,ea,ta,ia=N(()=>{H=(t,e,i=t)=>({kind:"photo",src:null,alt:i,brief:t,tone:e}),mt=(t,e,i=t)=>({kind:"video",src:null,poster:null,alt:i,brief:t,tone:e}),ea={id:"dodo",slug:"dodo",status:"complete",title:"Fried Plantain (Dodo)",subtitle:"Sweet, caramelised plantain with crisp edges and a soft centre.",categoryId:"street",region:"West Africa",story:"Dodo is simple, but most of the result is decided before you light the stove: by how ripe your plantain is and how thick you cut it. Get those right and it caramelises perfectly every time.",prepMinutes:5,cookMinutes:12,difficulty:"Beginner friendly",baseServings:4,servingOptions:[2,4,6,10,15,20],previewSteps:0,allergens:[],dietary:["Vegan","Gluten-free"],hero:H("Golden-brown diagonal slices of dodo with dark caramelised edges, piled on a plate. 45\xB0, warm light.","plantain","A plate of fried plantain"),gallery:[H("Three plantains side by side: green, yellow with black spots, fully black.","plantain")],serveWith:["Nigerian Party Jollof Rice","Peppered Chicken","Beans","Eggs for breakfast"],equipment:[{name:"Frying pan",note:"Wide and heavy-based."},{name:"Sharp knife and board",note:""},{name:"Slotted spoon or tongs",note:""},{name:"Plate with paper towels",note:"For draining."}],ingredients:[{id:"plantain",name:"Ripe plantains (yellow with black spots)",qty:3,unit:"",scale:"whole",shopCategory:"Produce",availability:["african-grocery","international","mainstream"],note:"Plantains look like large bananas but must be cooked. Buy them yellow-black, or buy green and wait 4\u20137 days.",substitutes:[{name:"No good substitute",note:"Bananas fall apart when fried. Wait until your plantains ripen."}]},{id:"salt",name:"Salt",qty:.25,unit:"tsp",scale:"taste",optional:!0,shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"oil",name:"Vegetable oil for frying",qty:1,unit:"cup",altQty:250,altUnit:"ml",scale:"fixed",shopCategory:"Pantry",availability:["mainstream"],note:"About 1 cm deep in your pan.",substitutes:[]}],steps:[{id:"d1",phase:"prep",title:"Check your plantains are ripe",body:"Look at the skin. For sweet dodo you want plantains that are yellow with lots of black spots or patches, and feel slightly soft when you press them, like a ripe avocado.",media:[H("Ripeness guide: green, yellow with black spots, fully black.","plantain")],ingredientIds:["plantain"],checkpoint:{question:"Which looks most like yours?",options:[{id:"green",label:"Green and hard",verdict:"wait",media:H("Green, unripe plantain.","leaf"),guidance:"Not ready for dodo. It will taste starchy, not sweet. Leave it in a paper bag at room temperature for 4\u20137 days."},{id:"spotty",label:"Yellow with black spots",verdict:"good",media:H("Perfectly ripe plantain: yellow with black spots.","plantain"),guidance:"Perfect for dodo."},{id:"black",label:"Almost all black, very soft",verdict:"good",media:H("Very ripe plantain: black skin, soft.","suya"),guidance:"Extra sweet. It works, but it burns faster, so use slightly lower heat and watch closely."}]}},{id:"d2",phase:"prep",title:"Peel the plantains",body:"Cut off both ends. Then run your knife lengthwise along one ridge of the skin, just deep enough to cut the skin, not the fruit. Push your thumb under the skin and peel it away.",about:"2 minutes",media:[mt("10-second clip: trimming the ends, scoring along a ridge, and peeling the skin off in one piece.","plantain")],ingredientIds:[],tips:[{kind:"kitchen",text:"Plantain skin is thicker than banana skin. Scoring it first makes peeling easy."}]},{id:"d3",phase:"prep",title:"Slice evenly",body:"Cut the plantain at an angle into slices about 1.5 cm thick (roughly the width of your finger). Try to keep every slice the same thickness so they all cook at the same speed. Sprinkle with a little salt if you like.",cues:{see:"Long, oval slices, all about the same thickness."},about:"2 minutes",media:[H("Diagonal plantain slices, even 1.5 cm thickness, ruler for scale.","plantain")],ingredientIds:["salt"],tips:[{kind:"mcuire",text:"At Mcuire we cut on a long diagonal. More surface means more of those caramelised edges everyone fights over."}]},{id:"d4",phase:"cook",title:"Heat the oil",body:"Pour oil into the frying pan to about 1 cm deep. Heat on medium for 2\u20133 minutes. Test with one slice: it should sizzle gently and steadily straight away.",cues:{hear:"A gentle, steady sizzle when the test slice goes in."},about:"2\u20133 minutes",media:[],ingredientIds:["oil"],tips:[{kind:"watch",text:"If the oil smokes or the test slice browns in seconds, it\u2019s too hot. Take the pan off the heat for a minute."}]},{id:"d5",phase:"cook",title:"Fry until caramelised",body:"Lay the slices in the pan in a single layer, not touching. Fry until the underside is deep golden-brown, then turn each slice with tongs and fry the other side.",cues:{see:"Deep golden-brown with darker caramel edges.",smell:"Sweet, like caramel."},about:"2\u20133 minutes per side",timer:{minutes:3,label:"Fry dodo, first side"},media:[mt("12-second clip: turning dodo slices, showing the caramelised underside.","plantain")],ingredientIds:[],checkpoint:{question:"What colour are yours?",options:[{id:"pale",label:"Pale yellow",verdict:"wait",media:H("Underfried dodo: pale yellow.","plantain"),guidance:"Give them another minute or two."},{id:"golden",label:"Golden-brown, dark edges",verdict:"good",media:H("Perfect dodo: golden-brown with caramelised edges.","plantain"),guidance:"Perfect. Turn them, or take them out if both sides are done."},{id:"burnt",label:"Black patches",verdict:"fix",media:H("Overfried dodo with black patches.","suya"),guidance:"Too hot or too long. Lower the heat for the next batch. Very ripe plantain burns faster."}]}},{id:"d6",phase:"finish",title:"Drain and serve",body:"Lift the dodo out onto the paper towels for a minute to drain. Serve warm next to jollof and peppered chicken, or with beans or eggs.",media:[H("Drained dodo on a plate beside jollof and peppered chicken.","plantain")],ingredientIds:[],tips:[{kind:"ready",text:"Soft and sweet inside, slightly crisp at the edges, golden all over."}]}]},ta={id:"puff-puff",slug:"puff-puff",status:"complete",title:"Puff-Puff",subtitle:"Soft, fluffy, lightly sweet fried dough balls, golden outside and airy inside.",categoryId:"street",region:"Nigeria",story:"Puff-puff is the snack that disappears first at every party. It has just a handful of pantry ingredients and one technique: shaping the batter with your hand. We\u2019ll show you the batter texture and the drop until you have it.",prepMinutes:15,cookMinutes:75,difficulty:"Beginner friendly",baseServings:6,servingOptions:[4,6,10,15,20,30],previewSteps:0,allergens:["Wheat (gluten)"],dietary:["Vegan","Dairy-free"],hero:H("A bowl heaped with round golden puff-puff, one broken open to show the fluffy inside. Natural light.","plantain","A bowl of puff-puff"),gallery:[H("Risen puff-puff batter: doubled, bubbly, stretchy on a spoon.","rice")],serveWith:["Chapman drink","Small chops platter","A dusting of sugar"],equipment:[{name:"Large mixing bowl",note:"The batter doubles in size."},{name:"Deep pot or wok",note:"Heavy-based, for deep frying."},{name:"Slotted spoon",note:""},{name:"Cling film or clean tea towel",note:"To cover the batter while it rises."},{name:"Kitchen thermometer",note:"Optional."}],ingredients:[{id:"flour",name:"All-purpose (plain) flour",qty:3,unit:"cup",altQty:375,altUnit:"g",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"sugar",name:"Sugar",qty:.5,unit:"cup",altQty:100,altUnit:"g",shopCategory:"Pantry",availability:["mainstream"],note:"Use a little less for a less sweet puff-puff.",substitutes:[]},{id:"yeast",name:"Instant (fast-action) yeast",qty:2.25,unit:"tsp",altQty:7,altUnit:"g",shopCategory:"Pantry",availability:["mainstream"],note:"One standard sachet.",substitutes:[{name:"Active dry yeast",note:"Same amount. Stir it into the warm water first and wait 5 minutes until foamy."}]},{id:"salt",name:"Salt",qty:.5,unit:"tsp",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"nutmeg",name:"Ground nutmeg",qty:.25,unit:"tsp",optional:!0,shopCategory:"Spices",availability:["mainstream"],substitutes:[]},{id:"water",name:"Warm water",qty:1.5,unit:"cup",altQty:360,altUnit:"ml",shopCategory:"Other",availability:["mainstream"],note:"Warm like a comfortable bath, not hot.",substitutes:[]},{id:"oil",name:"Vegetable oil for deep frying",qty:4,unit:"cup",altQty:1,altUnit:"l",scale:"fixed",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]}],steps:[{id:"p1",phase:"prep",title:"Get the water just warm",body:"Mix hot and cold water until it feels comfortably warm on the inside of your wrist, like a nice bath. Not hot.",why:"Yeast is alive. Water that\u2019s too hot kills it and your puff-puff won\u2019t rise.",cues:{texture:"Pleasantly warm on your wrist. If you\u2019re using a thermometer, about 40\xB0C (105\xB0F)."},about:"1 minute",media:[],ingredientIds:["water"]},{id:"p2",phase:"prep",title:"Mix the dry ingredients",body:"In the large bowl, mix the flour, sugar, yeast, salt and nutmeg with a spoon until evenly combined.",about:"1 minute",media:[H("Flour, sugar, yeast and nutmeg in a large bowl, mixed.","rice")],ingredientIds:["flour","sugar","yeast","salt","nutmeg"]},{id:"p3",phase:"prep",title:"Add the water and beat the batter",body:"Pour in the warm water. Mix with your clean hand or a wooden spoon, scooping up from the bottom and slapping it back down, for 3\u20135 minutes until the batter is smooth with no dry flour.",why:"Beating builds stretch in the batter. That\u2019s what gives puff-puff its soft, chewy inside.",cues:{texture:"Thick, smooth, sticky and stretchy. It falls slowly from the spoon in a thick ribbon."},about:"3\u20135 minutes",media:[mt("15-second clip: beating the batter by hand, then lifting to show the thick, stretchy ribbon.","rice")],ingredientIds:[],checkpoint:{question:"How does your batter fall from the spoon?",options:[{id:"stiff",label:"Stiff, more like dough",verdict:"fix",media:H("Batter too stiff: clumps on the spoon.","rice"),guidance:"Mix in warm water, 2 tablespoons at a time."},{id:"ribbon",label:"Thick ribbon, falls slowly",verdict:"good",media:H("Correct batter: thick, slow ribbon from spoon.","rice"),guidance:"Perfect. Cover and let it rise."},{id:"runny",label:"Runny like pancake batter",verdict:"fix",media:H("Batter too runny: pours quickly.","rice"),guidance:"Mix in flour, 2 tablespoons at a time. Runny batter makes flat, oily puff-puff."}]}},{id:"p4",phase:"prep",title:"Let the batter rise",body:"Cover the bowl with cling film or a tea towel and put it somewhere warm, away from draughts. Leave it until it has doubled in size and the top is full of bubbles.",cues:{see:"Doubled in size, puffy, with lots of bubbles on top.",smell:"Slightly sweet and yeasty, like bread."},about:"45\u201360 minutes",timer:{minutes:45,label:"Let the batter rise"},media:[H("Before and after: batter at the start vs doubled and bubbly.","rice")],ingredientIds:[],tips:[{kind:"mcuire",text:"A cold kitchen? Put the bowl in your oven with only the light switched on. It makes a perfect warm spot."}],checkpoint:{question:"Has your batter risen?",options:[{id:"flat",label:"Barely changed",verdict:"wait",media:H("Batter that hasn\u2019t risen.","rice"),guidance:"Give it another 15\u201320 minutes somewhere warmer. If nothing happens after an hour, your yeast may be old or the water was too hot."},{id:"doubled",label:"Doubled and bubbly",verdict:"good",media:H("Batter doubled with bubbles.","rice"),guidance:"Ready to fry. Give it one quick stir to knock out large bubbles."}]}},{id:"p5",phase:"cook",title:"Heat the oil",body:"Pour oil into the deep pot until it\u2019s about 6\u20138 cm deep, and heat on medium. Test by dropping in a tiny bit of batter. It should sink slightly, then rise to the top and sizzle steadily within 3\u20134 seconds (about 170\xB0C).",about:"5\u20138 minutes",media:[],ingredientIds:["oil"],tips:[{kind:"watch",text:"If the test piece browns in seconds, the oil is too hot. Your puff-puff would be dark outside and raw inside. Turn it down and wait 2 minutes."},{kind:"watch",text:"Never leave hot oil alone. Keep a lid nearby. If it ever catches fire, cover it and turn off the heat. Never use water."}]},{id:"p6",phase:"cook",title:"Shape and drop the balls",body:"Wet your hand with water. Scoop up some batter, close your fist gently, and squeeze so a small ball of batter pushes out between your thumb and first finger. Scrape it off with a spoon and let it drop gently into the oil, close to the surface. Repeat, leaving space between them.",about:"A few seconds each",media:[mt("20-second clip: squeezing batter through the fist, scraping a round ball into the oil. Slow and clear.","plantain")],ingredientIds:[],tips:[{kind:"chef",text:"Not comfortable using your hand? Use two spoons: scoop with one, push off with the other. They\u2019ll be less round, but just as tasty."},{kind:"kitchen",text:"Dip your hand (or spoons) in water between drops so the batter doesn\u2019t stick."}]},{id:"p7",phase:"cook",title:"Fry until golden all over",body:"Fry until golden on the bottom. Many will roll over on their own; turn the rest with the slotted spoon. Fry until evenly golden-brown all over.",cues:{see:"Round, puffed and evenly golden-brown."},about:"2\u20133 minutes per batch",timer:{minutes:3,label:"Fry puff-puff batch"},media:[H("Puff-puff balls frying, some turned showing golden sides.","plantain")],ingredientIds:[],checkpoint:{question:"Break one open. What do you see?",options:[{id:"fluffy",label:"Golden outside, fluffy inside",verdict:"good",media:H("Perfect puff-puff broken open: fluffy, cooked through.","plantain"),guidance:"Perfect. Keep going with the rest of the batter."},{id:"raw",label:"Dark outside, wet inside",verdict:"fix",media:H("Puff-puff dark outside, raw inside.","suya"),guidance:"Oil too hot. Turn the heat down a little and make the balls slightly smaller."},{id:"oily",label:"Pale and greasy",verdict:"fix",media:H("Pale, oil-soaked puff-puff.","rice"),guidance:"Oil not hot enough. Turn the heat up a little and fry fewer at a time."}]}},{id:"p8",phase:"finish",title:"Drain and serve",body:"Lift them out onto paper towels to drain. Serve warm, plain, or tossed in a little sugar.",media:[H("Bowl of finished puff-puff, a few dusted with sugar.","plantain")],ingredientIds:[],tips:[{kind:"kitchen",text:"Best eaten the same day. To refresh, warm them in the oven at 180\xB0C for 5 minutes."}]}]}});var j,ue,aa,oa,sa,na,ra=N(()=>{j=(t,e,i=t)=>({kind:"photo",src:null,alt:i,brief:t,tone:e}),ue=(t,e,i=t)=>({kind:"video",src:null,poster:null,alt:i,brief:t,tone:e}),aa={id:"suya",slug:"suya",status:"complete",title:"Beef Suya",subtitle:"Thin, smoky beef skewers crusted in spicy peanut yaji, just like the street grill.",categoryId:"grills",region:"Nigeria (Hausa)",story:"Suya comes from the night-time grills of Northern Nigeria. Mallams slice the beef paper-thin and press on yaji, a spice mix of ground roasted peanuts, ginger and chilli. Then they cook it over fierce heat. You don\u2019t need a street grill: your oven\u2019s grill (broiler) or a barbecue does it beautifully.",prepMinutes:45,cookMinutes:12,difficulty:"Beginner friendly",baseServings:4,servingOptions:[2,4,6,10,15,20],previewSteps:0,allergens:["Peanuts","Check stock cubes: some contain wheat, soy or celery"],dietary:["Gluten-free if your stock cube is","Dairy-free"],hero:j("Suya skewers with charred edges and red-brown yaji crust, sliced raw onion and tomato on the side, on newspaper-style paper. Evening light.","suya","Beef suya skewers"),gallery:[j("Bowl of homemade yaji spice: fine, reddish-brown powder.","suya")],serveWith:["Sliced raw onion, tomato and cabbage","Extra yaji for dipping","A cold drink"],equipment:[{name:"Wooden or metal skewers",note:"About 10. Wooden ones must soak first."},{name:"Oven with grill (broiler), or a barbecue",note:""},{name:"Baking tray lined with foil + wire rack",note:"For the oven method."},{name:"Sharp knife and board",note:"A sharp knife makes thin slices easy."},{name:"Blender or spice grinder",note:"Only if you\u2019re grinding peanuts yourself."},{name:"Pastry brush",note:"Or use a spoon."}],ingredients:[{id:"beef",group:"Beef",name:"Beef sirloin, rump or flank steak",qty:800,unit:"g",shopCategory:"Meat & Fish",availability:["mainstream"],note:"A tender steak cut. Suya cooks fast, so tough stewing beef won\u2019t soften in time.",substitutes:[{name:"Boneless chicken thighs",note:"Slice thin the same way. Cook 1\u20132 minutes longer per side."}]},{id:"kuli",group:"Yaji (suya spice)",name:"Kuli-kuli powder (ground roasted peanut)",qty:.5,unit:"cup",altQty:70,altUnit:"g",shopCategory:"African Ingredients",availability:["african-grocery","online"],note:"The base of yaji. It gives the nutty crust.",substitutes:[{name:"Unsalted roasted peanuts, ground",note:"Pulse in short bursts until powdery. Stop before it turns into peanut butter."}]},{id:"ginger",group:"Yaji (suya spice)",name:"Ground ginger",qty:1,unit:"tsp",shopCategory:"Spices",availability:["mainstream"],substitutes:[]},{id:"garlic",group:"Yaji (suya spice)",name:"Garlic powder",qty:1,unit:"tsp",shopCategory:"Spices",availability:["mainstream"],substitutes:[]},{id:"onion-powder",group:"Yaji (suya spice)",name:"Onion powder",qty:1,unit:"tsp",shopCategory:"Spices",availability:["mainstream"],substitutes:[]},{id:"paprika",group:"Yaji (suya spice)",name:"Smoked paprika",qty:1,unit:"tbsp",shopCategory:"Spices",availability:["mainstream"],note:"Gives colour and a smoky taste even in an oven.",substitutes:[{name:"Sweet paprika",note:"Same amount."}]},{id:"cayenne",group:"Yaji (suya spice)",name:"Cayenne pepper (or ground dried chilli)",qty:1.5,unit:"tsp",scale:"taste",shopCategory:"Spices",availability:["mainstream"],note:"1 tsp for warm, 2 tsp for fiery.",substitutes:[]},{id:"stock-cube",group:"Yaji (suya spice)",name:"Stock cube, crushed to powder",qty:1,unit:"cube",scale:"whole",shopCategory:"African Ingredients",availability:["mainstream","african-grocery"],substitutes:[{name:"1 tsp bouillon powder",note:""}]},{id:"salt",group:"Yaji (suya spice)",name:"Salt",qty:.5,unit:"tsp",scale:"taste",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"oil",group:"To cook and serve",name:"Vegetable oil",qty:3,unit:"tbsp",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"serve-onion",group:"To cook and serve",name:"Red onion, thinly sliced",qty:1,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"serve-tomato",group:"To cook and serve",name:"Tomatoes, sliced",qty:2,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"cabbage",group:"To cook and serve",name:"Cabbage, finely shredded",qty:150,unit:"g",optional:!0,shopCategory:"Produce",availability:["mainstream"],substitutes:[]}],steps:[{id:"y1",phase:"prep",title:"Soak the skewers and chill the beef",body:"If you\u2019re using wooden skewers, put them in a tray of water to soak. Put the beef in the freezer at the same time.",why:"Soaked skewers don\u2019t burn under the grill. Slightly frozen beef is firm, so you can slice it very thin easily.",about:"30 minutes",timer:{minutes:30,label:"Soak skewers & chill beef"},media:[j("Wooden skewers soaking in a tray of water; beef on a plate going into the freezer.","suya")],ingredientIds:["beef"]},{id:"y2",phase:"prep",title:"Slice the beef thinly",body:"Look at the beef for the thin lines running through it (the \u201Cgrain\u201D). Slice across those lines, not along them, into strips about 3\u20135 mm thick, roughly the thickness of two coins stacked. Then cut long strips into pieces about the length of your hand.",why:"Thin slices cook quickly and stay tender. Cutting across the grain keeps them from being chewy.",cues:{see:"Thin, even strips you can almost see light through at the edges."},about:"10 minutes",media:[ue("15-second clip: slicing chilled beef across the grain into thin, even strips.","suya")],ingredientIds:[],checkpoint:{question:"How thick are your slices?",options:[{id:"thick",label:"Thick like a steak",verdict:"fix",media:j("Beef slices too thick, about 1 cm.","suya"),guidance:"Lay each slice flat and cut it in half through the middle to make two thin slices."},{id:"thin",label:"Thin, about 3\u20135 mm",verdict:"good",media:j("Correct suya slices, 3\u20135 mm thick.","suya"),guidance:"Perfect suya thickness."}]}},{id:"y3",phase:"prep",title:"Make the yaji spice",body:"In a bowl, mix the kuli-kuli (or ground peanuts), ginger, garlic powder, onion powder, paprika, cayenne, crushed stock cube and salt. Rub it between your fingers to break up any lumps. Put aside about a quarter of it for serving.",cues:{see:"A fine, reddish-brown, sandy powder.",smell:"Nutty, smoky and spicy."},about:"5 minutes",media:[j("All yaji spices in small piles, then mixed into one reddish powder.","suya")],ingredientIds:["kuli","ginger","garlic","onion-powder","paprika","cayenne","stock-cube","salt"],tips:[{kind:"chef",text:"Grinding your own peanuts? Pulse for 1 second at a time. Peanuts turn into butter very quickly."}],checkpoint:{question:"How does your yaji look?",options:[{id:"powder",label:"Fine and powdery",verdict:"good",media:j("Correct yaji: fine, loose powder.","suya"),guidance:"Perfect."},{id:"paste",label:"Clumping, oily paste",verdict:"fix",media:j("Over-ground peanuts turning to paste.","suya"),guidance:"The peanuts were ground too long. Stir in 2 tablespoons of plain flour or more spices to dry it out. It will still taste good."}]}},{id:"y4",phase:"prep",title:"Coat the beef and let it rest",body:"Put the beef in a bowl and rub it all over with the oil. Sprinkle the yaji on and press it onto both sides of every slice with your fingers. Cover and leave it to soak up the flavour.",cues:{see:"Every slice evenly coated in a reddish crust, with no bare patches."},about:"30 minutes (or overnight in the fridge)",timer:{minutes:30,label:"Marinate the suya"},media:[j("Hands pressing yaji onto thin beef slices.","suya")],ingredientIds:["oil"],tips:[{kind:"mcuire",text:"Press, don\u2019t just sprinkle. The yaji should stick like a crust. That\u2019s where all the flavour is."}]},{id:"y5",phase:"prep",title:"Thread onto skewers",body:"Thread each slice onto a skewer in a zig-zag, piercing it 2\u20133 times like folding a ribbon, so it lies flat. Fit 3\u20134 slices per skewer, close together but not squashed.",about:"10 minutes",media:[ue("10-second clip: threading a thin beef slice onto a skewer in a zig-zag.","suya")],ingredientIds:[]},{id:"y6",phase:"cook",title:"Heat your grill",body:"Oven: move a shelf to about 10 cm below the grill (broiler) and turn it on high. Put a wire rack on a foil-lined tray. Barbecue: heat it to medium-high and oil the grates.",about:"5 minutes",media:[],ingredientIds:[],tips:[{kind:"watch",text:"Under a grill, things go from browned to burnt quickly. Stay close and keep the oven light on so you can watch."}]},{id:"y7",phase:"cook",title:"Grill until the edges char",body:"Lay the skewers on the rack (or barbecue). Grill until the edges are dark and slightly charred, then turn each skewer, brush lightly with oil and sprinkle on a little more yaji. Grill the other side the same way.",cues:{see:"Browned all over with darker, crispy edges.",smell:"Smoky, toasted peanut and spice.",hear:"Sizzling and spitting."},about:"4\u20135 minutes per side",timer:{minutes:4,label:"Grill first side"},media:[ue("12-second clip: suya under the grill, turning skewers to show charred edges.","suya")],ingredientIds:[],checkpoint:{question:"How does your suya look?",options:[{id:"pale",label:"Grey-brown, no char",verdict:"wait",media:j("Suya not grilled long enough: grey, no dark edges.","suya"),guidance:"Give it 1\u20132 more minutes, or move it closer to the heat."},{id:"charred",label:"Browned, charred edges",verdict:"good",media:j("Perfect suya: browned with charred edges.","suya"),guidance:"Perfect. That smoky char is what you want."},{id:"burnt",label:"Black and bitter",verdict:"fix",media:j("Burnt suya, black all over.","suya"),guidance:"Too close to the heat. Move the shelf down a level for the next batch and check after 3 minutes."}]}},{id:"y8",phase:"finish",title:"Serve with onions, tomato and extra yaji",body:"Slide the suya off the skewers or serve them whole. Pile on sliced raw onion, tomato and shredded cabbage, and sprinkle over the yaji you saved.",media:[j("Mcuire plating: suya on paper with onion, tomato, cabbage and a little pile of yaji.","suya")],ingredientIds:["serve-onion","serve-tomato","cabbage"],tips:[{kind:"kitchen",text:"Leftover yaji keeps for a month in a sealed jar. Sprinkle it on grilled chicken, roasted corn or eggs."}]}]},oa={id:"pounded-yam",slug:"pounded-yam",status:"complete",title:"Pounded Yam",subtitle:"Smooth, stretchy and soft: the king of swallows, made in a modern kitchen.",categoryId:"soups",region:"Nigeria",story:"Pounded yam is traditionally beaten in a big wooden mortar, and it\u2019s hard work. At home a food processor or stand mixer does the pounding for you. The secret is the same either way: work the yam while it\u2019s very hot.",prepMinutes:15,cookMinutes:30,difficulty:"Beginner friendly",baseServings:4,servingOptions:[2,4,6,10],previewSteps:0,allergens:[],dietary:["Vegan","Gluten-free"],hero:j("Two smooth, glossy white balls of pounded yam beside a bowl of egusi. 45\xB0.","rice","Pounded yam"),gallery:[j("A whole puna yam next to peeled white chunks.","rice")],serveWith:["Egusi Soup","Efo Riro","Ogbono Soup","Okra Soup"],equipment:[{name:"Large pot",note:"For boiling the yam."},{name:"Food processor or stand mixer (paddle)",note:"Or a traditional mortar and pestle."},{name:"Sharp knife and board",note:""},{name:"Kitchen gloves",note:"Raw yam can make some people\u2019s hands itch."},{name:"Wooden spoon",note:""},{name:"Cling film",note:"For wrapping portions."}],ingredients:[{id:"yam",name:"Puna yam (African white yam)",qty:1.2,unit:"kg",shopCategory:"Produce",availability:["african-grocery"],note:"A big, rough, brown tuber. Sweet potatoes and \u201Cyams\u201D from mainstream North American supermarkets are not the same and won\u2019t work.",substitutes:[{name:"Pounded yam flour (poundo yam)",note:"About 2 cups for 4 people. Make it like eba (see the Eba lesson): water first, flour on top, then turn until smooth."}]},{id:"water",name:"Water",qty:2,unit:"l",scale:"fixed",shopCategory:"Other",availability:["mainstream"],note:"Enough to cover the yam.",substitutes:[]}],steps:[{id:"py1",phase:"prep",title:"Peel and cut the yam",body:"Put on gloves if you have them. Cut the yam into thick rounds, about 4 cm. Stand each round flat and cut  Two things make it work: rice cooked in stock until just tender, then cooled so the grains stay separate, and vegetables cut small and fried quickly so they stay crunchy and bright.",prepMinutes:30,cookMinutes:45,difficulty:"Beginner friendly",baseServings:6,servingOptions:[2,4,6,10,15,20],previewSteps:0,allergens:["Shellfish (prawns, optional)","Milk (butter)","Check stock cubes: some contain wheat, soy or celery"],dietary:["Gluten-free if your stock cubes are","Leave out prawns and liver for vegetarian (use vegetable stock)"],hero:j("Golden fried rice with green, orange and yellow vegetables, prawns on top, in a serving dish. Overhead.","plantain","Nigerian fried rice"),gallery:[j("Fried rice and jollof side by side on a party plate with chicken and dodo.","jollof")],serveWith:["Peppered Chicken","Fried Plantain (Dodo)","Coleslaw","Party Jollof (for a \u201Cmix\u201D)"],equipment:[{name:"Medium pot with lid",note:"For cooking the rice."},{name:"Very large frying pan or wok",note:"Bigger is better. Rice needs room to fry, not steam."},{name:"Large tray or baking sheet",note:"For cooling the rice."},{name:"Sharp knife and board",note:""},{name:"Wooden spatula",note:""}],ingredients:[{id:"rice",group:"Rice",name:"Long-grain parboiled rice",qty:3,unit:"cup",altQty:600,altUnit:"g",shopCategory:"Rice & Grains",availability:["mainstream","african-grocery"],substitutes:[{name:"Basmati rice",note:"Use \xBC less stock and cook 5 minutes less."}]},{id:"stock",group:"Rice",name:"Chicken stock",qty:3,unit:"cup",altQty:720,altUnit:"ml",shopCategory:"Pantry",availability:["mainstream"],substitutes:[{name:"Water + 1 extra stock cube",note:""}]},{id:"curry",group:"Rice",name:"Nigerian-style curry powder",qty:2,unit:"tsp",shopCategory:"Spices",availability:["african-grocery","online"],note:"This is what makes it golden.",substitutes:[{name:"Mild curry powder + \xBD tsp turmeric",note:""}]},{id:"thyme",group:"Rice",name:"Dried thyme",qty:1,unit:"tsp",shopCategory:"Spices",availability:["mainstream"],substitutes:[]},{id:"stock-cubes",group:"Rice",name:"Stock cubes",qty:2,unit:"cube",scale:"whole",shopCategory:"African Ingredients",availability:["mainstream","african-grocery"],substitutes:[{name:"Bouillon powder",note:"1 tsp per cube."}]},{id:"carrot",group:"Vegetables",name:"Carrots, finely diced",qty:2,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"beans",group:"Vegetables",name:"Green beans, finely chopped",qty:150,unit:"g",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"peas",group:"Vegetables",name:"Frozen peas",qty:1,unit:"cup",shopCategory:"Frozen",availability:["mainstream"],substitutes:[]},{id:"corn",group:"Vegetables",name:"Sweet corn (frozen or tinned)",qty:1,unit:"cup",shopCategory:"Frozen",availability:["mainstream"],substitutes:[]},{id:"green-pepper",group:"Vegetables",name:"Green bell pepper, diced",qty:1,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"onion",group:"Vegetables",name:"Onion, diced",qty:1,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"garlic",group:"Vegetables",name:"Garlic, minced",qty:2,unit:"clove",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"spring-onion",group:"Vegetables",name:"Spring onions, sliced",qty:4,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"prawns",group:"Protein",name:"Prawns, peeled",qty:200,unit:"g",optional:!0,shopCategory:"Frozen",availability:["mainstream"],substitutes:[{name:"Diced cooked chicken",note:"Add with the spring onions just to warm through."}]},{id:"liver",group:"Protein",name:"Chicken or beef liver, diced",qty:200,unit:"g",optional:!0,shopCategory:"Meat & Fish",availability:["mainstream","african-grocery"],note:"Traditional in Nigerian fried rice, but optional.",substitutes:[{name:"Leave it out",note:""}]},{id:"oil",group:"For frying",name:"Vegetable oil",qty:4,unit:"tbsp",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"butter",group:"For frying",name:"Butter",qty:2,unit:"tbsp",optional:!0,shopCategory:"Other",availability:["mainstream"],substitutes:[{name:"More oil",note:""}]},{id:"white-pepper",group:"For frying",name:"Ground white pepper",qty:.5,unit:"tsp",shopCategory:"Spices",availability:["mainstream"],substitutes:[{name:"Black pepper",note:""}]},{id:"salt",group:"For frying",name:"Salt",qty:.5,unit:"tsp",scale:"taste",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]}],steps:[{id:"fr1",phase:"prep",title:"Wash the rice and chop the vegetables",body:"Wash the rice in a bowl of cold water 3\u20134 times until the water is mostly clear, then drain. Dice the carrots, green beans, green pepper and onion into small pieces, about the size of a pea, so everything is roughly the same size as the peas and corn.",why:"Small, even pieces cook quickly and evenly, and look beautiful mixed through the rice.",about:"15 minutes",media:[j("Diced vegetables in separate small bowls, all pea-sized.","leaf"),ue("10-second clip: dicing a carrot into pea-sized pieces.","plantain")],ingredientIds:["rice","carrot","beans","green-pepper","onion","garlic"]},{id:"fr2",phase:"cook",title:"Cook the rice in curry stock",body:"Put the rice in the pot with the stock, curry powder, thyme and 1 crumbled stock cube. Stir once, bring to a boil, then cover and turn the heat to low. Cook until the liquid is absorbed and the rice is just tender, with a tiny bit of bite.",cues:{see:"Bright golden-yellow rice, liquid gone.",texture:"Tender but still firm. Not soft or mushy."},about:"15\u201318 minutes",timer:{minutes:15,label:"Cook the curry rice"},media:[j("Golden curry rice in the pot, liquid just absorbed.","plantain")],ingredientIds:["stock","curry","thyme","stock-cubes"],checkpoint:{question:"Taste a few grains. How are they?",options:[{id:"hard",label:"Crunchy in the middle",verdict:"wait",media:j("Undercooked rice with chalky centres.","rice"),guidance:"Add 3 tablespoons of water, cover and cook 3\u20134 minutes more."},{id:"tender",label:"Tender with a slight bite",verdict:"good",media:j("Correct rice: separate, tender, slight bite.","plantain"),guidance:"Perfect. Take it off the heat now."},{id:"mushy",label:"Soft and sticky",verdict:"fix",media:j("Overcooked, sticky rice.","rice"),guidance:"Spread it out thinly on the tray straight away to dry. Fry in smaller batches. It will still taste good."}]}},{id:"fr3",phase:"prep",title:"Spread the rice out to cool",body:"Spread the rice out in a thin layer on the tray and leave it to cool and dry. Fluff it with a fork once or twice.",why:"This is the secret. Warm, wet rice clumps and goes mushy when you fry it. Cooled, drier rice stays separate.",about:"10\u201315 minutes",timer:{minutes:10,label:"Cool the rice"},media:[j("Golden rice spread thin on a tray to cool.","plantain")],ingredientIds:[],tips:[{kind:"mcuire",text:"Leftover rice from yesterday makes the best fried rice of all, because it\u2019s already dry."}]},{id:"fr4",phase:"cook",title:"Cook the prawns and liver",body:"Heat 1 tablespoon of oil in the big pan on medium-high. Add the diced liver and cook, stirring, until browned and no longer pink inside. Then add the prawns and cook until they turn pink and curl. Tip everything onto a plate.",cues:{see:"Prawns pink and curled into a \u201CC\u201D shape. A tight \u201CO\u201D shape means overcooked."},about:"5\u20136 minutes",media:[j("Prawns turned pink and curled in the pan with browned liver.","jollof")],ingredientIds:["prawns","liver"]},{id:"fr5",phase:"cook",title:"Fry the vegetables quickly",body:"In the same pan, heat 1 tablespoon of oil and the butter on medium-high. Add the onion and garlic and stir for 1 minute. Add the carrots and green beans and stir-fry for 2 minutes. Add the peas, corn and green pepper and stir-fry for 1\u20132 minutes more. Season with a pinch of salt. Tip half of the vegetables into a bowl.",cues:{see:"Bright, shiny colours.",texture:"Still slightly crunchy. Not soft."},about:"4\u20135 minutes",timer:{minutes:4,label:"Stir-fry vegetables"},media:[ue("10-second clip: stir-frying the colourful vegetables on high heat.","leaf")],ingredientIds:["oil","butter","peas","corn"],tips:[{kind:"watch",text:"Don\u2019t let the vegetables go soft and dull. They\u2019ll cook a little more with the rice."}]},{id:"fr6",phase:"cook",title:"Fry the rice in two batches",body:"With half the vegetables still in the pan, add 1 tablespoon of oil and half the rice. Turn the heat up. Toss and stir-fry for 3\u20134 minutes, scraping from the bottom, until the rice is hot and every grain is coated. Sprinkle in half the white pepper and the second crumbled stock cube. Tip it into your serving dish. Repeat with the rest of the vegetables and rice.",why:"Too much rice at once steams instead of frying. Two batches keep it light and separate.",cues:{hear:"A lively crackle as the rice fries.",see:"Even golden colour, vegetables spread through every spoonful."},about:"8 minutes (two batches)",timer:{minutes:4,label:"Fry rice batch"},media:[ue("12-second clip: tossing golden rice and vegetables in a wide pan.","plantain")],ingredientIds:["white-pepper","salt"],checkpoint:{question:"Does yours look like this?",options:[{id:"patchy",label:"Patchy, white bits",verdict:"wait",media:j("Fried rice with uneven colour.","rice"),guidance:"Keep tossing for another minute. Add a pinch more curry powder if it looks pale."},{id:"golden",label:"Even gold, grains separate",verdict:"good",media:j("Correct fried rice: even gold, separate grains.","plantain"),guidance:"Perfect."},{id:"clumpy",label:"Clumping together",verdict:"fix",media:j("Clumpy fried rice.","rice"),guidance:"Turn the heat up, press the clumps apart with the spatula and fry smaller amounts."}]}},{id:"fr7",phase:"finish",title:"Fold in the prawns, liver and spring onions",body:"Gently fold the prawns, liver and spring onions through all the rice. Taste and add salt if needed.",about:"1\u20132 minutes",media:[],ingredientIds:["spring-onion"]},{id:"fr8",phase:"finish",title:"Serve",body:"Serve hot, on its own or with peppered chicken and dodo. For a true party plate, serve it half and half with jollof.",media:[j("Mcuire party plate: fried rice and jollof side by side, chicken, dodo, coleslaw.","plantain")],ingredientIds:[],tips:[{kind:"kitchen",text:"Keeps 3 days in the fridge. Reheat in a hot pan with a splash of water, until steaming hot."}]}]},na={id:"moi-moi",slug:"moi-moi",status:"complete",title:"Moi Moi",subtitle:"Silky, savoury steamed bean pudding with peppers, egg and fish.",categoryId:"street",region:"Nigeria",story:"Moi moi is steamed blended beans, rich with peppers and oil. It\u2019s served at parties next to jollof and at breakfast with pap. The two skills are peeling the beans and getting the batter to the right thickness. We\u2019ll walk you through both.",prepMinutes:60,cookMinutes:60,difficulty:"Intermediate",baseServings:6,servingOptions:[4,6,10,15,20],previewSteps:0,allergens:["Eggs (optional)","Fish and shellfish (crayfish, fish, optional)","Check stock cubes: some contain wheat, soy or celery"],dietary:["Gluten-free if your stock cubes are","Dairy-free","Vegan without egg, fish and crayfish"],hero:j("Moi moi turned out of a ramekin, cut open to show smooth orange inside with slices of boiled egg. 45\xB0.","jollof","A sliced moi moi"),gallery:[j("Peeled white beans next to beans with skins on.","rice")],serveWith:["Nigerian Party Jollof Rice","Pap (ogi) or custard for breakfast","Fried Rice"],equipment:[{name:"Large bowl",note:"For soaking and peeling the beans."},{name:"Blender",note:"A powerful one gives the smoothest moi moi."},{name:"6\u20138 ramekins, foil cups or heatproof bowls",note:"Or traditional moi moi leaves (uma leaves)."},{name:"Large pot with lid",note:"For steaming."},{name:"Small rack or a crumpled sheet of foil",note:"To keep the containers off the bottom of the pot."},{name:"Aluminium foil",note:"For covering each container."}],ingredients:[{id:"beans",group:"Batter",name:"Black-eyed beans or Nigerian brown beans (dry)",qty:2,unit:"cup",altQty:400,altUnit:"g",shopCategory:"Rice & Grains",availability:["mainstream","african-grocery"],note:"Black-eyed peas are in most supermarkets. Nigerian brown (honey) beans are sweeter.",substitutes:[{name:"Peeled bean flour (moi moi / akara flour)",note:"Skips soaking and peeling. Use about 2 cups and mix with liquid as in step 4."}]},{id:"rbp",group:"Batter",name:"Red bell peppers",qty:2,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"sb",group:"Batter",name:"Scotch bonnet pepper",qty:1,unit:"",scale:"taste",shopCategory:"Produce",availability:["african-grocery","international","mainstream"],substitutes:[{name:"Habanero",note:""}]},{id:"onion",group:"Batter",name:"Onion",qty:1,unit:"",scale:"whole",shopCategory:"Produce",availability:["mainstream"],substitutes:[]},{id:"oil",group:"Batter",name:"Vegetable oil or palm oil",qty:.5,unit:"cup",altQty:120,altUnit:"ml",shopCategory:"Pantry",availability:["mainstream","african-grocery"],note:"Oil makes moi moi soft and silky. Don\u2019t reduce it too much.",substitutes:[]},{id:"crayfish",group:"Batter",name:"Ground crayfish",qty:2,unit:"tbsp",optional:!0,shopCategory:"African Ingredients",availability:["african-grocery","online"],substitutes:[{name:"Dried shrimp powder",note:""}]},{id:"stock-cubes",group:"Batter",name:"Stock cubes",qty:2,unit:"cube",scale:"whole",shopCategory:"African Ingredients",availability:["mainstream","african-grocery"],substitutes:[]},{id:"salt",group:"Batter",name:"Salt",qty:1,unit:"tsp",scale:"taste",shopCategory:"Pantry",availability:["mainstream"],substitutes:[]},{id:"warm-stock",group:"Batter",name:"Warm stock or water",qty:1.5,unit:"cup",altQty:360,altUnit:"ml",shopCategory:"Pantry",availability:["mainstream"],note:"Add it gradually. You may not need all of it.",substitutes:[]},{id:"eggs",group:"Fillings",name:"Hard-boiled eggs, sliced",qty:3,unit:"",scale:"whole",optional:!0,shopCategory:"Other",availability:["mainstream"],substitutes:[]},{id:"fish",group:"Fillings",name:"Flaked fish (tinned mackerel or sardines)",qty:1,unit:"tin",scale:"whole",optional:!0,shopCategory:"Pantry",availability:["mainstream"],substitutes:[]}],steps:[{id:"m1",phase:"prep",title:"Soak the beans",body:"Put the beans in a large bowl and cover with plenty of cold water. Leave them to soak so the skins loosen.",cues:{see:"Beans slightly swollen, with skins starting to wrinkle."},about:"30\u201360 minutes",timer:{minutes:30,label:"Soak the beans"},media:[j("Black-eyed beans soaking in a bowl, skins wrinkling.","rice")],ingredientIds:["beans"],tips:[{kind:"mcuire",text:"Using peeled bean flour? Skip to step 3. It saves about an hour."}]},{id:"m2",phase:"prep",title:"Peel the beans",body:`Grab a handful of beans and rub them firmly between your palms under the water, as if you\u2019re warming your hands. The skins will come off and float. Tip the floating skins away, add fresh water and repeat until almost all the beans are white.
