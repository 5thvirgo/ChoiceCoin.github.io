# Background server for mcuire.ca/cooking-courses (accounts, payments, uploads).
# Render: New → Blueprint → pick this repository. You'll be asked for values marked sync: false.
# Extra Stripe accounts: after deploy, add STRIPE_SECRET_KEY_<NAME> and STRIPE_WEBHOOK_SECRET_<NAME>
# in Render → Environment (e.g. STRIPE_SECRET_KEY_SOUPS). See README, step 4.
services:
  - type: web
    name: mcuire-kitchen
    runtime: docker
    plan: starter
    healthCheckPath: /api/catalog
    disk:
      name: mcuire-data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://mcuire-kitchen.onrender.com
      - key: APP_URL
        value: https://mcuire.ca/cooking-courses
      - key: DATABASE_PATH
        value: /data/mcuire.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: STAFF_EMAILS
        sync: false
