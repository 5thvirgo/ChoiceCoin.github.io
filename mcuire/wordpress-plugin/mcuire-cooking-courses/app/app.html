<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cooking Courses · Mcuire African Restaurant</title>
  <meta name="description" content="Learn to cook authentic West African food with Mcuire African Restaurant. Step-by-step Cook With Me lessons, from party jollof to egusi and suya.">
  <meta name="theme-color" content="#fbf6ee">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
/* Mcuire Kitchen design system
   Warm cream paper, palm-oil red, turmeric gold, leaf green.
   Food photography is the hero; UI chrome stays quiet. */

:root {
  --paper: #fbf6ee;
  --paper-2: #f4ecdf;
  --card: #fffdf9;
  --ink: #23170f;
  --ink-2: #4f4035;
  --muted: #6f5d4c; /* 5:1 on paper, easy to read */
  --line: #e8dccb;
  --jollof: #c43d1a;
  --jollof-deep: #93290f;
  --gold: #e0a22a;
  --gold-soft: #f6e3b4;
  --leaf: #3b6a3a;
  --leaf-soft: #dfead9;
  --clay: #b45a33;
  --night: #1d140e;
  --good: #2f6b3a;
  --wait: #a86a0b;
  --fix: #b0361b;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 1px 2px rgba(35, 23, 15, 0.06), 0 8px 24px -12px rgba(35, 23, 15, 0.25);
  /* Same type as mcuire.ca: Playfair Display headings, Roboto text. */
  --display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --body: 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --gutter: clamp(16px, 4vw, 40px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-kerning: normal;
  overflow-x: hidden;
}
img, video { max-width: 100%; display: block; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
[tabindex='-1']:focus { outline: none; }
.ic { flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

h1, h2, h3, h4 { font-family: var(--display); font-weight: 700; line-height: 1.15; margin: 0 0 0.45em; letter-spacing: 0; font-variant-numeric: lining-nums; text-wrap: balance; color: var(--ink); }
.dark-section h1, .dark-section h2, .dark-section h3, .flagship h2, .flagship h3 { color: inherit; }
h1 { font-size: clamp(2.2rem, 6vw, 4.2rem); }
h2 { font-size: clamp(1.7rem, 3.6vw, 2.6rem); }
h3 { font-size: 1.35rem; line-height: 1.25; }
h4 { line-height: 1.3; }
p { margin: 0 0 1em; text-wrap: pretty; }
@media (min-width: 900px) { body { font-size: 18px; } }
.eyebrow { font: 700 0.78rem/1.2 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--clay); margin-bottom: 0.9rem; display: block; }
.lede { font-size: clamp(1.08rem, 1.6vw, 1.25rem); color: var(--ink-2); max-width: 38em; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }

.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 var(--gutter); }
.narrow { max-width: 760px; }
.section { padding: clamp(48px, 8vw, 96px) 0; }
.section-tight { padding: clamp(28px, 5vw, 56px) 0; }
.stack > * + * { margin-top: 1rem; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }

/* Woven band: a restrained nod to West African strip-weave cloth. */
.band {
  height: 6px;
  background:
    repeating-linear-gradient(90deg,
      var(--jollof) 0 22px, var(--gold) 22px 30px, var(--night) 30px 34px,
      var(--leaf) 34px 52px, var(--gold) 52px 60px, var(--night) 60px 64px);
}
.band.thin { height: 3px; opacity: 0.9; }

/* ---------------------------------------------------------------- Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 0 24px; border-radius: 999px;
  border: 1.5px solid transparent; font-weight: 700; font-size: 1rem;
  text-decoration: none; transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
  white-space: nowrap;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--jollof); color: #fff; box-shadow: 0 10px 24px -12px rgba(196, 61, 26, 0.8); }
.btn-primary:hover { background: var(--jollof-deep); }
.btn-dark { background: var(--night); color: #fff; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { border-color: var(--ink-2); }
.btn-light { background: #fff; color: var(--ink); }
.btn-gold { background: var(--gold); color: var(--night); }
.btn-lg { min-height: 60px; padding: 0 30px; font-size: 1.08rem; }
.btn-sm { min-height: 40px; padding: 0 16px; font-size: 0.92rem; }
.btn-block { width: 100%; white-space: normal; text-align: center; line-height: 1.25; padding-top: 10px; padding-bottom: 10px; }
.btn[disabled] { opacity: 0.5; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--jollof); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
  background: var(--paper-2); color: var(--ink-2); font-size: 0.85rem; font-weight: 600;
}
.chip.gold { background: var(--gold-soft); color: #6d4a06; }
.chip.leaf { background: var(--leaf-soft); color: var(--leaf); }
.chip.dark { background: rgba(0, 0, 0, 0.45); color: #fff; backdrop-filter: blur(6px); }

/* ---------------------------------------------------------------- Header */
.site-header { position: sticky; top: 0; z-index: 40; background: rgba(251, 246, 238, 0.92); backdrop-filter: saturate(1.4) blur(12px); }
.site-header .bar { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand-logo { height: 44px; width: auto; flex: none; display: block; }
.brand-sub { display: block; font: 700 0.66rem/1.25 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--clay); padding-left: 12px; border-left: 1.5px solid var(--line); }
.logo-chip { display: inline-flex; background: var(--paper); border-radius: 10px; padding: 6px 10px; }
.footer-logo { height: 40px; width: auto; display: block; }
.nav { display: flex; align-items: center; gap: 6px; }
.nav a { white-space: nowrap; text-decoration: none; font-weight: 600; font-size: 0.95rem; padding: 10px 14px; border-radius: 999px; color: var(--ink-2); }
.nav a:hover, .nav a.active { color: var(--ink); background: var(--paper-2); }
.nav .btn { color: #fff; }
@media (max-width: 760px) {
  .nav a.hide-sm { display: none; }
  .brand-sub { display: none; }
  .brand { gap: 8px; }
  .brand-logo { height: 34px; }
  .nav { gap: 0; }
  .nav a { padding: 8px 7px; font-size: 0.9rem; font-weight: 500; }
  .nav a.active { font-weight: 700; }
}
/* Small phones: a slightly smaller logo so the menu fits. */
@media (max-width: 400px) { .brand-logo { height: 30px; } }
@media (max-width: 340px) { .nav a { padding: 8px 5px; font-size: 0.86rem; } }

/* ---------------------------------------------------------------- Media placeholders
   Clearly marked slots for Mcuire's own photography. Nothing generated. */
.media { position: relative; overflow: hidden; background: var(--paper-2); border-radius: var(--radius); isolation: isolate; }
.media img, .media video { width: 100%; height: 100%; object-fit: cover; }
.ratio-hero { aspect-ratio: 4 / 3; }
.ratio-wide { aspect-ratio: 16 / 9; }
.ratio-square { aspect-ratio: 1; }
.ratio-tall { aspect-ratio: 4 / 5; }
.ph { width: 100%; height: 100%; display: grid; place-items: end start; padding: 16px; color: rgba(255, 255, 255, 0.95); }
.ph::before {
  content: ''; position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(120% 90% at 30% 25%, var(--t1) 0%, transparent 60%),
    radial-gradient(90% 80% at 80% 80%, var(--t3) 0%, transparent 65%),
    linear-gradient(160deg, var(--t2), var(--t3));
}
.ph::after { /* faint plate ring so it reads as "food goes here" */
  content: ''; position: absolute; z-index: -1; width: 62%; aspect-ratio: 1; left: 50%; top: 46%;
  transform: translate(-50%, -50%); border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.22); box-shadow: inset 0 0 0 14px rgba(255, 255, 255, 0.05);
}
.ph-label { display: flex; gap: 10px; align-items: flex-start; max-width: 34em; font-size: 0.8rem; line-height: 1.35; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }
.ph-label strong { display: block; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; }
.ph-compact .ph-label span { display: none; }
.tone-jollof { --t1: #ef7a3d; --t2: #c8401c; --t3: #7d220c; }
.tone-rice { --t1: #f6ead2; --t2: #d8c29a; --t3: #9d8257; }
.tone-egusi { --t1: #e6c35a; --t2: #a98c2f; --t3: #4e4114; }
.tone-suya { --t1: #b75631; --t2: #6e2c14; --t3: #2a130a; }
.tone-plantain { --t1: #f7c457; --t2: #db8a26; --t3: #8d4510; }
.tone-leaf { --t1: #7ea661; --t2: #436f39; --t3: #1f3a1b; }
.tone-onion { --t1: #f1d9b8; --t2: #c9976a; --t3: #7d5333; }
.tone-rice .ph, .tone-onion .ph { color: rgba(35, 23, 15, 0.85); }
.tone-rice .ph-label, .tone-onion .ph-label { text-shadow: none; }
.video-badge { position: absolute; top: 12px; left: 12px; }

/* ---------------------------------------------------------------- Landing */
.hero { position: relative; padding: clamp(24px, 5vw, 64px) 0 clamp(40px, 6vw, 80px); }
.hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(28px, 5vw, 64px); align-items: center; }
.hero h1 em { font-style: italic; color: var(--jollof); }
.hero .media { box-shadow: var(--shadow); }
.hero-media { position: relative; }
.hero-note {
  position: absolute; left: -24px; top: 28px; max-width: 260px; background: var(--card); border-radius: var(--radius-sm);
  padding: 14px 16px; box-shadow: var(--shadow); font-size: 0.92rem;
}
.hero-note b { display: block; font-family: var(--display); font-size: 1.05rem; }
@media (max-width: 880px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-media { order: -1; }
  .hero-note { left: 12px; top: 12px; max-width: 220px; font-size: 0.85rem; }
}

.journey { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; counter-reset: j; border-top: 1px solid var(--line); }
.journey li { list-style: none; padding: 28px 24px 8px 0; position: relative; counter-increment: j; }
.journey li::before { content: counter(j, decimal-leading-zero); font-family: var(--display); font-size: 2.4rem; color: var(--jollof); display: block; line-height: 1; margin-bottom: 12px; }
.journey h3 { font-size: 1.2rem; }
@media (max-width: 880px) { .journey { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .journey { grid-template-columns: 1fr; } .journey li { padding-right: 0; } }

.feature-split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 72px); align-items: center; }
@media (max-width: 880px) { .feature-split { grid-template-columns: 1fr; } }

.phone {
  width: min(340px, 100%); margin: 0 auto; border-radius: 40px; background: var(--night); padding: 12px;
  box-shadow: 0 30px 60px -30px rgba(35, 23, 15, 0.6);
}
.phone-screen { background: var(--paper); border-radius: 30px; overflow: hidden; }
.phone-screen .ps-top { padding: 14px 18px 8px; font-size: 0.78rem; color: var(--muted); display: flex; justify-content: space-between; }
.phone-screen .ps-bar { height: 4px; background: var(--line); margin: 0 18px; border-radius: 4px; overflow: hidden; }
.phone-screen .ps-bar i { display: block; height: 100%; width: 58%; background: var(--jollof); }
.phone-screen .ps-body { padding: 14px 18px 18px; }
.phone-screen h4 { font-size: 1.25rem; margin: 12px 0 6px; }
.phone-screen p { font-size: 0.9rem; color: var(--ink-2); margin-bottom: 12px; }

.compare { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.compare figure { margin: 0; }
.compare figcaption { font-size: 0.82rem; font-weight: 700; margin-top: 6px; display: flex; align-items: center; gap: 6px; }

.dark-section { background: var(--night); color: #f6eee2; }
.dark-section .lede, .dark-section .muted { color: #cdbfae; }
.dark-section .eyebrow { color: var(--gold); }

.quote { font-family: var(--display); font-size: clamp(1.4rem, 3vw, 2.1rem); line-height: 1.3; font-style: italic; max-width: 26em; }

/* ---------------------------------------------------------------- Catalogue */
.cat-nav { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; position: sticky; top: 68px; z-index: 5; background: var(--paper); }
.cat-nav::-webkit-scrollbar { display: none; }
.cat-nav a { flex: none; text-decoration: none; padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--line); font-weight: 600; font-size: 0.92rem; }
.cat-nav a:hover { border-color: var(--ink-2); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 28px 20px; }
.tile { text-decoration: none; display: block; }
.tile .media { margin-bottom: 12px; transition: transform 0.3s ease; }
.tile:hover .media { transform: translateY(-3px); }
.tile h3 { font-size: 1.15rem; margin-bottom: 4px; }
.tile p { font-size: 0.92rem; color: var(--muted); margin: 0; }
.tile .meta { display: flex; gap: 10px; font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
.tile .status { position: absolute; top: 12px; right: 12px; }

.course-row { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(20px, 4vw, 56px); align-items: center; padding: 36px 0; border-top: 1px solid var(--line); }
.course-row:nth-child(even) .media { order: 2; }
.price { font-family: var(--display); font-size: 2rem; font-weight: 600; }
.price s { font-size: 1.1rem; color: var(--muted); margin-left: 8px; font-weight: 400; }
@media (max-width: 760px) { .course-row { grid-template-columns: 1fr; } .course-row:nth-child(even) .media { order: 0; } }

.flagship {
  display: grid; grid-template-columns: 1fr 1fr; border-radius: 28px; overflow: hidden; background: var(--night); color: #f6eee2;
}
.flagship .media { border-radius: 0; min-height: 100%; }
.flagship .body { padding: clamp(28px, 5vw, 56px); }
.flagship .eyebrow { color: var(--gold); }
.flagship .lede { color: #d9cbb8; }
.ticks { list-style: none; padding: 0; margin: 0 0 1.4em; }
.ticks li { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.ticks .ic { color: var(--gold); margin-top: 4px; }
@media (max-width: 860px) { .flagship { grid-template-columns: 1fr; } .flagship .media { aspect-ratio: 16 / 10; } }

/* ---------------------------------------------------------------- Course page */
.module { border-top: 1px solid var(--line); padding: 22px 0; }
.module summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.module summary::-webkit-details-marker { display: none; }
.module summary h3 { margin: 0; }
.module[open] summary .ic { transform: rotate(180deg); }
.lesson-list { list-style: none; padding: 0; margin: 14px 0 0; }
.lesson-list li { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.lesson-list .media { width: 64px; height: 48px; border-radius: 10px; flex: none; }
.lesson-list a { text-decoration: none; font-weight: 600; }
.lesson-list .grow { flex: 1; min-width: 0; }
.buy-box { position: sticky; top: 90px; background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
.course-layout { display: grid; grid-template-columns: 1fr 360px; gap: 48px; align-items: start; }
@media (max-width: 900px) { .course-layout { grid-template-columns: 1fr; } .buy-box { position: static; } }

/* ---------------------------------------------------------------- Recipe overview */
.recipe-hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(24px, 4vw, 56px); align-items: center; }
@media (max-width: 880px) { .recipe-hero { grid-template-columns: 1fr; } .recipe-hero .media { order: -1; margin: 0 calc(-1 * var(--gutter)); border-radius: 0; } }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 24px 0; }
.facts div { padding: 14px 8px 14px 0; }
.facts b { display: block; font-family: var(--display); font-size: 1.2rem; }
.facts span { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
@media (max-width: 520px) { .facts { grid-template-columns: 1fr 1fr; } }

.servings { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.servings h3 { font-size: 1.15rem; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button {
  min-width: 52px; min-height: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--paper);
  font-weight: 700; font-size: 1rem;
}
.seg button[aria-pressed='true'] { background: var(--ink); border-color: var(--ink); color: #fff; }
.seg input { width: 92px; min-height: 48px; border-radius: 14px; border: 1.5px solid var(--line); padding: 0 12px; background: var(--paper); font-weight: 700; }
.notice { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--gold-soft); color: #5d3f05; font-size: 0.92rem; margin-top: 12px; }

.two-col { display: grid; grid-template-columns: 1.2fr 1fr; gap: clamp(28px, 5vw, 64px); align-items: start; }
@media (max-width: 880px) { .two-col { grid-template-columns: 1fr; } }

.ing-group h4 { font-family: var(--body); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--clay); margin: 22px 0 6px; }
.ing { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ing .qty { font-weight: 700; text-align: right; white-space: nowrap; }
.ing .qty small { display: block; font-weight: 500; color: var(--muted); }
.ing .name small { color: var(--muted); }
.ing .opt { font-size: 0.75rem; font-weight: 700; color: var(--leaf); text-transform: uppercase; letter-spacing: 0.08em; margin-left: 6px; }
.ing .note { grid-column: 1 / -1; font-size: 0.88rem; color: var(--ink-2); }
.cantfind { grid-column: 1 / -1; }
.cantfind summary { cursor: pointer; font-size: 0.88rem; font-weight: 700; color: var(--jollof); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
.cantfind summary::-webkit-details-marker { display: none; }
.cantfind .box { background: var(--paper-2); border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 8px; font-size: 0.9rem; }
.cantfind ul { margin: 6px 0 0; padding-left: 18px; }
.where { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

.equip li { padding: 10px 0; border-bottom: 1px solid var(--line); list-style: none; }
.equip { padding: 0; margin: 0; }
.equip small { display: block; color: var(--muted); }

.sticky-cta {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 12px var(--gutter) calc(12px + var(--safe-bottom));
  background: linear-gradient(to top, var(--paper) 70%, rgba(251, 246, 238, 0)); display: none;
}
@media (max-width: 880px) { .sticky-cta { display: block; } .has-sticky-cta { padding-bottom: 96px; } }

/* ---------------------------------------------------------------- Cook With Me */
body.cooking { overflow: hidden; }
body.cooking .site-header, body.cooking .site-footer, body.cooking .timer-dock { display: none; }
.cook {
  position: fixed; inset: 0; z-index: 60; background: var(--paper); display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); height: 100dvh;
}
.cook > * { min-width: 0; }
.cook-top { padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gutter) 10px; background: var(--paper); border-bottom: 1px solid var(--line); }
.cook-top .row { justify-content: space-between; flex-wrap: nowrap; }
.cook-top .title { flex: 1; min-width: 0; text-align: center; }
.cook-top .title b { display: block; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cook-top .title span { font-size: 0.82rem; color: var(--muted); }
.icon-btn {
  width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card);
  display: grid; place-items: center; flex: none;
}
.icon-btn:hover { border-color: var(--ink-2); }
.progress { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; margin-top: 10px; }
.progress i { display: block; height: 100%; background: var(--jollof); border-radius: 6px; transition: width 0.4s ease; }
.progress.gold i { background: var(--gold); }

.cook-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.cook-step { max-width: 760px; margin: 0 auto; padding: 18px var(--gutter) 32px; }
.cook-step .phase { font: 700 0.75rem/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay); }
.cook-step h2 { font-size: clamp(1.7rem, 6vw, 2.4rem); margin: 10px 0 14px; }
.cook-step .body { white-space: pre-line; font-size: clamp(1.12rem, 2.4vw, 1.3rem); line-height: 1.6; }
.cook-step .why { font-size: 1rem; color: var(--ink-2); border-left: 3px solid var(--gold); padding-left: 14px; margin: 16px 0; }
.cook-media { display: grid; gap: 10px; margin: 6px 0 18px; }
.cook-media.two { grid-template-columns: 1fr 1fr; }
.cook-media .media { aspect-ratio: 4 / 3; }
.cook-media figcaption { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
.cook-media figure { margin: 0; }
@media (max-width: 520px) { .cook-media.two { grid-template-columns: 1fr; } }

.step-ings { background: var(--card); border-radius: var(--radius-sm); padding: 14px 16px; margin: 16px 0; box-shadow: var(--shadow); }
.step-ings h4 { font: 700 0.75rem/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.step-ings li { list-style: none; display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.step-ings li:last-child { border-bottom: 0; }
.step-ings ul { margin: 0; padding: 0; }

.cues { display: grid; gap: 10px; margin: 18px 0; }
.cue { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.cue .ico { width: 40px; height: 40px; border-radius: 50%; background: var(--leaf-soft); color: var(--leaf); display: grid; place-items: center; }
.cue b { display: block; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--leaf); }
.about { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; color: var(--ink-2); margin-top: 4px; }

.timer-card {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  border-radius: var(--radius); padding: 16px 18px; background: var(--night); color: #fff; margin: 18px 0;
}
.timer-card .big { font-family: var(--display); font-size: clamp(2.6rem, 11vw, 3.6rem); font-variant-numeric: tabular-nums; line-height: 1; }
.timer-card .label { font-size: 0.85rem; color: #cdbfae; }
.timer-card.done { background: var(--leaf); }
.timer-card .btn { min-height: 52px; }
.timer-card .ctrls { display: flex; gap: 8px; flex-wrap: wrap; }
.timer-card .ctrls .btn-ghost { color: #fff; border-color: rgba(255, 255, 255, 0.3); }

.tip { border-radius: var(--radius-sm); padding: 14px 16px; margin: 12px 0; background: var(--gold-soft); color: #4a3305; }
.tip b { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
.tip p { margin: 0; }
.tip.watch { background: #fbe1d7; color: #6d2410; }
.tip.ready { background: var(--leaf-soft); color: #22451f; }
.tip.kitchen { background: var(--paper-2); color: var(--ink-2); }
.tip.mcuire { background: var(--night); color: #f6eee2; }
.tip.mcuire b { color: var(--gold); }

.checkpoint { margin: 24px 0; padding: 18px; border-radius: var(--radius); border: 2px solid var(--ink); background: var(--card); }
.checkpoint h3 { display: flex; gap: 10px; align-items: center; font-size: 1.3rem; }
.cp-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.cp-option { text-align: left; border: 2px solid var(--line); border-radius: var(--radius-sm); background: var(--paper); padding: 0; overflow: hidden; }
.cp-option .media { border-radius: 0; aspect-ratio: 4 / 3; }
.cp-option span { display: block; padding: 10px 12px; font-weight: 700; font-size: 0.95rem; }
.cp-option[aria-pressed='true'] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.cp-option[aria-pressed='true'].good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good); }
.cp-answer { margin-top: 14px; padding: 14px 16px; border-radius: var(--radius-sm); display: flex; gap: 10px; font-size: 1.02rem; }
.cp-answer.good { background: var(--leaf-soft); color: #1f421d; }
.cp-answer.wait { background: var(--gold-soft); color: #5d3f05; }
.cp-answer.fix { background: #fbe1d7; color: #6d2410; }

.trouble { margin: 18px 0; }
.trouble summary { cursor: pointer; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; color: var(--jollof); min-height: 44px; list-style: none; }
.trouble summary::-webkit-details-marker { display: none; }
.trouble dl { margin: 8px 0 0; }
.trouble dt { font-weight: 700; margin-top: 10px; }
.trouble dd { margin: 2px 0 0; color: var(--ink-2); }

.cook-bottom {
  display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 12px var(--gutter) calc(12px + var(--safe-bottom));
  background: var(--paper); border-top: 1px solid var(--line);
}
.cook-bottom .btn { min-height: 62px; font-size: 1.1rem; white-space: normal; text-align: center; line-height: 1.2; }
.cook-bottom .back { width: 62px; padding: 0; }
@media (min-width: 760px) { .cook-bottom { max-width: 760px; width: 100%; margin: 0 auto; border-top: 0; } }

.cook-overlay { position: absolute; inset: 0; z-index: 5; background: rgba(29, 20, 14, 0.94); color: #f6eee2; display: grid; place-items: center; padding: var(--gutter); text-align: center; }
.cook-overlay h2 { color: #fff; }
.cook-overlay .stack { max-width: 460px; }

.drawer { position: absolute; inset: 0; z-index: 6; background: rgba(29, 20, 14, 0.5); display: flex; align-items: flex-end; }
.drawer-panel { background: var(--paper); width: 100%; max-height: 85dvh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 20px var(--gutter) calc(24px + var(--safe-bottom)); }
@media (min-width: 760px) { .drawer { justify-content: flex-end; align-items: stretch; } .drawer-panel { max-width: 440px; max-height: none; border-radius: 0; } }

/* Preview gate */
.gate { text-align: left; }
.gate .ticks .ic { color: var(--gold); }

/* Completion */
.complete { text-align: center; padding: 32px var(--gutter) 48px; max-width: 640px; margin: 0 auto; }
.complete .seal { width: 120px; height: 120px; margin: 0 auto 18px; }
.badge-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 18px 0; }

/* ---------------------------------------------------------------- Timer dock + alert */
/* Reserve room so a running timer never covers page buttons. */
body.has-timers main { padding-bottom: calc(76px * 2 + var(--safe-bottom)); }
body.has-timers .sticky-cta { bottom: calc(68px + var(--safe-bottom)); }
.timer-dock { position: fixed; right: 16px; bottom: calc(16px + var(--safe-bottom)); z-index: 50; display: grid; gap: 8px; }
.timer-pill { display: flex; align-items: center; gap: 10px; background: var(--night); color: #fff; border-radius: 999px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow); text-decoration: none; border: 0; }
.timer-pill b { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.timer-pill.done { background: var(--leaf); animation: pulse 1s ease infinite; }
.timer-pill small { display: block; color: #cdbfae; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes pulse { 50% { transform: scale(1.04); } }

.alarm { position: fixed; inset: 0; z-index: 100; background: var(--leaf); color: #fff; display: grid; place-items: center; text-align: center; padding: var(--gutter); }
.alarm .stack { max-width: 440px; }
.alarm h2 { color: #fff; font-size: clamp(2.2rem, 9vw, 3.4rem); }
.alarm .ring { width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.5); display: grid; place-items: center; margin: 0 auto 16px; animation: pulse 1s ease infinite; }

/* ---------------------------------------------------------------- Checkout */
.checkout { display: grid; grid-template-columns: 1fr 420px; gap: clamp(24px, 4vw, 56px); align-items: start; }
@media (max-width: 900px) { .checkout { grid-template-columns: 1fr; } .checkout .summary { order: -1; } }
.summary { background: var(--card); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
.summary .line { display: flex; justify-content: space-between; padding: 8px 0; }
.summary .total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px; font-weight: 700; font-size: 1.2rem; }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field label { font-weight: 700; font-size: 0.92rem; }
.field small { color: var(--muted); }
.input, .field input, .field select, .field textarea {
  width: 100%; min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; padding: 12px 14px; font-size: 1rem;
}
.field textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--ink); }
.paybox { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 18px; background: #fff; }
.wallets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.wallet { min-height: 52px; border-radius: 12px; border: 0; background: #000; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
.wallet.g { background: #fff; color: #222; border: 1.5px solid var(--line); }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.85rem; margin: 14px 0; }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.test-banner { background: var(--gold-soft); color: #5d3f05; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.88rem; margin-bottom: 14px; }
.trust { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); margin-top: 14px; }
.trust span { display: inline-flex; gap: 6px; align-items: center; }

/* ---------------------------------------------------------------- My Kitchen */
.kitchen-hero { background: var(--night); color: #f6eee2; padding: clamp(28px, 5vw, 56px) 0; }
.kitchen-hero h1 { color: #fff; font-size: clamp(2rem, 5vw, 3.2rem); }
.continue { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: center; background: rgba(255, 255, 255, 0.06); border-radius: var(--radius); padding: 14px; margin-top: 18px; text-decoration: none; }
.continue .media { aspect-ratio: 4 / 3; }
.continue b { font-family: var(--display); font-size: 1.4rem; display: block; color: #fff; }
@media (max-width: 600px) { .continue { grid-template-columns: 1fr; } }
.k-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: clamp(24px, 4vw, 48px); }
@media (max-width: 900px) { .k-grid { grid-template-columns: 1fr; } }
.k-block { padding: 24px 0; border-top: 1px solid var(--line); }
.k-block:first-child { border-top: 0; padding-top: 0; }
.ring-stat { display: flex; align-items: center; gap: 18px; }
.ring-stat svg { flex: none; }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.ach { padding: 14px; border-radius: var(--radius-sm); background: var(--card); box-shadow: var(--shadow); text-align: center; }
.ach.locked { opacity: 0.55; box-shadow: none; background: var(--paper-2); }
.ach svg { margin: 0 auto 8px; }
.ach b { display: block; font-size: 0.92rem; line-height: 1.25; }
.ach small { color: var(--muted); font-size: 0.78rem; line-height: 1.3; display: block; margin-top: 4px; }
.mini-list li { list-style: none; display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mini-list { padding: 0; margin: 0; }
.mini-list .media { width: 56px; height: 44px; border-radius: 10px; flex: none; }
.mini-list a { text-decoration: none; font-weight: 600; }
.challenge { padding: 16px 0; border-bottom: 1px solid var(--line); }
.challenge h4 { font-size: 1.1rem; margin-bottom: 4px; }

/* ---------------------------------------------------------------- Shopping */
.shop-cat h3 { font-family: var(--body); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--clay); margin: 26px 0 6px; }
.shop-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-height: 56px; }
.shop-item input { width: 26px; height: 26px; accent-color: var(--leaf); flex: none; }
.shop-item .grow { flex: 1; }
.shop-item.checked .grow { text-decoration: line-through; color: var(--muted); }
.shop-item small { display: block; color: var(--muted); }
.pick { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pick .grow { flex: 1; }
.pick select { min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); padding: 0 10px; background: #fff; }

/* ---------------------------------------------------------------- Certificate */
.cert-wrap { background: var(--paper-2); padding: clamp(16px, 4vw, 48px); border-radius: var(--radius); }
.cert-svg { width: 100%; height: auto; display: block; box-shadow: 0 30px 60px -30px rgba(35, 23, 15, 0.5); background: #fffdf8; }
.cert-preview-note { text-align: center; margin-top: 12px; }

/* ---------------------------------------------------------------- Admin */
.admin { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100dvh - 68px); }
.admin-nav { background: var(--night); color: #f6eee2; padding: 20px 12px; }
.admin-nav a { display: block; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: #d9cbb8; font-weight: 600; font-size: 0.95rem; }
.admin-nav a.active, .admin-nav a:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
.admin-nav .eyebrow { color: var(--gold); padding: 0 12px; }
.admin-main { padding: 24px clamp(16px, 3vw, 40px) 80px; min-width: 0; }
@media (max-width: 860px) {
  .admin { grid-template-columns: 1fr; }
  .admin-nav { display: flex; overflow-x: auto; gap: 4px; padding: 8px; }
  .admin-nav .eyebrow { display: none; }
  .admin-nav a { flex: none; }
}
.table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.table th { text-align: left; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); }
.table td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table-wrap { overflow-x: auto; }
.panel { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 18px; }
.panel h3 { font-size: 1.15rem; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 12px; }
@media (max-width: 700px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: 1fr 1fr; } }
.editor-tabs { display: flex; gap: 6px; overflow-x: auto; margin: 16px 0; border-bottom: 1px solid var(--line); }
.editor-tabs button { border: 0; background: none; padding: 12px 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; flex: none; }
.editor-tabs button[aria-selected='true'] { color: var(--ink); border-color: var(--jollof); }
.repeat { border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px; background: #fff; }
.repeat-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.repeat-head .row { gap: 4px; }
.repeat-head .icon-btn { width: 38px; height: 38px; }
.media-field { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: start; padding: 10px; border-radius: var(--radius-sm); background: var(--paper); margin-bottom: 10px; }
.media-field .media { aspect-ratio: 4 / 3; border-radius: 10px; }
.save-bar { position: sticky; bottom: 0; background: rgba(251, 246, 238, 0.95); backdrop-filter: blur(8px); padding: 12px 0; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--line); margin-top: 20px; z-index: 3; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--wait); }
.status-dot.ok { background: var(--good); }

/* ---------------------------------------------------------------- Footer + toast */
.site-footer { background: var(--night); color: #cdbfae; padding: 48px 0 calc(32px + var(--safe-bottom)); margin-top: 0; font-size: 0.92rem; }
.site-footer a { color: #f6eee2; text-decoration: none; }
.site-footer .cols { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 32px; }
.site-footer h4 { font-family: var(--body); color: var(--gold); font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; }
.site-footer ul { list-style: none; padding: 0; margin: 0; }
.site-footer li { padding: 4px 0; }
@media (max-width: 700px) { .site-footer .cols { grid-template-columns: 1fr; } }

#toast {
  position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); bottom: auto; transform: translate(-50%, -160%); z-index: 120;
  background: var(--night); color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 600; transition: transform 0.3s ease; max-width: calc(100% - 32px); font-size: 0.95rem; text-align: center;
}
#toast.show { transform: translate(-50%, 0); }

.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.loading { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

@media print {
  .site-header, .site-footer, .timer-dock, .no-print { display: none !important; }
  body { background: #fff; }
  .cert-wrap { padding: 0; background: none; }
  .cert-svg { box-shadow: none; }
}

/* Drawn illustrations shown until a real photo is uploaded */
.illus-wrap { background: #4f321e; }
.illus-wrap:has(.illus-linen) { background: #efe4cf; }
.illus-wrap:not([class*="ratio-"]) { aspect-ratio: 4 / 3; }
.illus { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.illus-tag { position: absolute; top: 10px; right: 10px; z-index: 1; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #fbf6ee; background: rgba(20, 12, 6, 0.55); padding: 4px 8px; border-radius: 999px; }
.illus-cap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 28px 14px 12px; font-size: 0.85rem; line-height: 1.35; color: #fff; background: linear-gradient(transparent, rgba(15, 9, 4, 0.82)); }
.illus-brief { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; font-size: 0.72rem; opacity: 0.8; }
.ph-compact .illus-cap { display: none; }

.photo-credit { position: absolute; right: 6px; bottom: 6px; z-index: 1; max-width: 80%; font-size: 0.62rem; line-height: 1.3; color: #fff; background: rgba(15, 9, 4, 0.55); padding: 2px 7px; border-radius: 999px; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.photo-credit:hover { text-decoration: underline; }

.share-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
.complete .share-row { justify-content: center; }

/* Weekend class booking */
.weekend { padding: clamp(18px, 3vw, 30px); }
.wk-label { font-size: 1rem; margin: 22px 0 10px; }
.chips-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.chip-btn { flex: none; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
.chip-btn small { font-weight: 400; font-size: 0.72rem; color: var(--muted); }
.chip-btn.is-on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip-btn.is-on small { color: var(--gold-soft); }
.chip-btn:disabled { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper span { font-weight: 600; margin-right: 4px; }
.stepper button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 1.2rem; cursor: pointer; color: var(--ink); }
.stepper b { min-width: 1.5em; text-align: center; font-size: 1.2rem; }
.wk-total { margin-top: 24px; max-width: 460px; }

/* ---------------------------------------------------------------- Type & interaction polish
   Numbers line up, links and buttons respond to the hand, and everything
   keeps a clear focus ring for keyboard users. */
::selection { background: var(--gold-soft); color: var(--ink); }
.price, .facts b, .journey li::before, .wk-total, .table td, .qty, .stepper, .timer-card .big { font-variant-numeric: lining-nums tabular-nums; }
.price { font-weight: 700; letter-spacing: 0; }
.quote { font-weight: 500; }
.lede { line-height: 1.6; }
.small, .tile p, .tile .meta { line-height: 1.5; }

/* Links inside text: a soft underline that fills in on hover */
main p a:not(.btn), .lede a:not(.btn), .notice a, .site-footer a:not(.btn) {
  color: var(--jollof-deep); text-decoration: underline; text-decoration-thickness: 1.5px;
  text-underline-offset: 3px; text-decoration-color: rgba(196, 61, 26, 0.35);
  transition: text-decoration-color 0.2s var(--ease), color 0.2s var(--ease);
}
main p a:not(.btn):hover, .lede a:not(.btn):hover, .notice a:hover { color: var(--jollof); text-decoration-color: currentColor; }
.dark-section p a:not(.btn), .site-footer a:not(.btn) { color: var(--gold-soft); text-decoration-color: rgba(246, 227, 180, 0.4); }
.site-footer a:not(.btn):hover { color: #fff; text-decoration-color: currentColor; }
.link { transition: color 0.2s var(--ease); }
.link:hover { color: var(--jollof-deep); }

/* Buttons lift slightly under the pointer and press down on tap */
.btn { letter-spacing: 0.01em; transition: transform 0.18s var(--ease), background-color 0.2s var(--ease), border-color 0.2s var(--ease), box-shadow 0.25s var(--ease), color 0.2s var(--ease); }
@media (hover: hover) {
  .btn:hover { transform: translateY(-2px); }
  .btn-primary:hover { box-shadow: 0 14px 28px -12px rgba(147, 41, 15, 0.75); }
  .btn-dark:hover { background: #3a2a1f; box-shadow: 0 12px 24px -14px rgba(29, 20, 14, 0.8); }
  .btn-ghost:hover { background: var(--card); box-shadow: var(--shadow); }
  .btn-light:hover { box-shadow: 0 12px 24px -14px rgba(0, 0, 0, 0.6); }
  .btn-gold:hover { background: #eab042; box-shadow: 0 12px 24px -14px rgba(224, 162, 42, 0.9); }
}
.btn:active { transform: translateY(0) scale(0.98); transition-duration: 0.06s; }

/* Header links: an underline that slides in */
.nav a:not(.btn) { position: relative; transition: color 0.2s var(--ease), background-color 0.2s var(--ease); }
.nav a:not(.btn)::after {
  content: ''; position: absolute; left: 14px; right: 14px; bottom: 5px; height: 2px; border-radius: 2px;
  background: var(--jollof); transform: scaleX(0); transform-origin: left; transition: transform 0.25s var(--ease);
}
.nav a:not(.btn):hover::after, .nav a.active::after { transform: scaleX(1); }
@media (max-width: 760px) { .nav a:not(.btn)::after { left: 7px; right: 7px; bottom: 3px; } }
@media (max-width: 340px) { .nav a:not(.btn)::after { left: 5px; right: 5px; } }
.nav a:not(.btn):hover, .nav a.active { background: transparent; }
.brand { transition: opacity 0.2s var(--ease); }
.brand:hover { opacity: 0.85; }

/* Dish and course cards: photo zooms gently, title picks up the brand colour */
.tile .media img, .course-row .media img, .flagship .media img { transition: transform 0.6s var(--ease); }
.tile h3 { transition: color 0.2s var(--ease); }
@media (hover: hover) {
  .tile:hover .media { transform: translateY(-4px); box-shadow: var(--shadow); }
  .tile:hover .media img, .course-row:hover .media img, .flagship:hover .media img { transform: scale(1.05); }
  .tile:hover h3 { color: var(--jollof); }
  .cat-nav a:hover { background: var(--card); }
  .chip-btn:not(:disabled):not(.is-on):hover { border-color: var(--ink-2); background: var(--card); }
  .seg button:not([aria-pressed='true']):hover { border-color: var(--ink-2); background: var(--card); }
  .icon-btn:hover { background: var(--paper-2); }
  .lesson-list li a:hover { color: var(--jollof); }
  .module summary:hover h3 { color: var(--jollof); }
  .table tbody tr:hover td { background: var(--paper-2); }
}
.cat-nav a, .chip-btn, .seg button, .icon-btn, .module summary h3, .lesson-list li a, .table td { transition: background-color 0.2s var(--ease), border-color 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease); }
.chip-btn:active:not(:disabled), .seg button:active, .icon-btn:active { transform: scale(0.96); }
.module summary .ic { transition: transform 0.25s var(--ease); }

/* Form fields: clear focus with a warm ring */
.input, .field input, .field select, .field textarea { transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease); }
.input:hover, .field input:hover, .field select:hover, .field textarea:hover { border-color: var(--muted); }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--jollof); box-shadow: 0 0 0 4px rgba(196, 61, 26, 0.14); }
::placeholder { color: #9c8b7a; opacity: 1; }
